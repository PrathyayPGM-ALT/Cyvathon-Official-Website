<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyvathon ID Card</title>
  <!-- social / SEO metadata -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Your Cyvathon ID card — citizenship status, designation, net worth, badges and public profile." />
  <link rel="canonical" href="https://cyvathon.onrender.com/profile" />
  <meta name="theme-color" content="#58c4ff" />
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cyvathon" />
  <meta property="og:title" content="Cyvathon ID Card" />
  <meta property="og:description" content="Your Cyvathon ID card — citizenship status, designation, net worth, badges and public profile." />
  <meta property="og:url" content="https://cyvathon.onrender.com/profile" />
  <meta property="og:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cyvathon ID Card" />
  <meta name="twitter:description" content="Your Cyvathon ID card — citizenship status, designation, net worth, badges and public profile." />
  <meta name="twitter:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .id-card{ max-width:560px; margin:0 auto 2rem; border-radius:18px; overflow:hidden;
      border:1px solid rgba(88,196,255,.35); box-shadow:0 12px 40px rgba(0,0,0,.5); }
    .id-top{ background:linear-gradient(135deg,#102a43,#0d1117); padding:1.4rem 1.8rem;
      display:flex; align-items:center; gap:1.2rem; border-bottom:1px solid rgba(88,196,255,.3); }
    .id-avatar{ width:74px; height:74px; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:2rem; color:#06223a; flex-shrink:0;
      background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .id-top h2{ margin:0; } .id-top .pill{ margin-top:.4rem; }
    .id-body{ background:#0f141b; padding:1.6rem 1.8rem; }
    .id-row{ display:flex; justify-content:space-between; padding:.5rem 0;
      border-bottom:1px solid rgba(255,255,255,.05); }
    .id-row .l{ color:var(--muted); }
    .id-watermark{ text-align:right; color:rgba(88,196,255,.3); font-size:.75rem; letter-spacing:2px; margin-top:.6rem; }
    .rec{ padding:.7rem 1rem; border-left:3px solid var(--accent); margin-bottom:.6rem;
      background:var(--panel); border-radius:0 8px 8px 0; }
    .rec.bad{ border-color:var(--red); }
    .rec .d{ font-size:.75rem; color:var(--muted); }
    .int-req{ border:1px solid var(--gold)!important; box-shadow:0 0 0 1px var(--gold) inset; }
    .chips{ display:flex; flex-wrap:wrap; gap:.45rem; margin:.7rem 0; }
    .chip{ display:inline-flex; align-items:center; gap:.4rem; padding:.45rem .8rem; border-radius:999px; cursor:pointer;
      border:1px solid var(--panel-border); background:var(--panel-2); color:var(--muted); font-size:.83rem; font-weight:600;
      transition:.15s; user-select:none; }
    .chip:hover{ color:var(--text); border-color:var(--accent); }
    .chip.on{ color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-color:transparent; }
    .id-banner{ height:120px; background:linear-gradient(120deg,var(--accent),var(--accent2)); background-size:cover; background-position:center; position:relative; }
    .id-banner .bedit{ position:absolute; right:.6rem; top:.6rem; backdrop-filter:blur(4px); background:rgba(8,14,26,.45)!important; }
    .badges{ display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 1.4rem; }
    .badge{ display:inline-flex; align-items:center; gap:.4rem; padding:.38rem .75rem; border-radius:999px; font-size:.8rem; font-weight:700;
      border:1px solid var(--panel-border); background:var(--panel-2); }
    .pinned{ border:1px solid var(--panel-border); background:var(--panel); border-radius:14px; padding:1rem 1.15rem; margin:0 0 1.4rem; text-align:left; }
    .pinned .pl{ font-size:.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--gold); font-weight:700; margin-bottom:.4rem; }
    .pinned h4{ margin:0 0 .35rem; font-size:1.1rem; } .pinned h4 a{ color:var(--text); text-decoration:none; } .pinned h4 a:hover{ color:var(--accent); }
    .pinned p{ color:var(--muted); font-size:.9rem; white-space:pre-wrap; line-height:1.5; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="wrap" style="max-width:640px;"><div id="view"></div></div>

  <script src="/static/app.js"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const esc = (s)=>(s||"").replace(/</g,"&lt;");

    function recordsHtml(records){
      if(!records || !records.length) return `<p class="muted">Clean record. Nothing on file.</p>`;
      return records.map(r=>{
        const bad = /default|seiz|tax|fired|reject/i.test(r.entry);
        return `<div class="rec ${bad?'bad':''}">${esc(r.entry)}
          <div class="d">${new Date(r.created_at).toLocaleString()}</div></div>`;
      }).join("");
    }

    /* ---- Profile picture ---- */
    function compressImg(file, max){
      return new Promise((resolve,reject)=>{
        const img=new Image(), rd=new FileReader();
        rd.onload=()=>{ img.onload=()=>{
          let{width:w,height:h}=img;
          if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
          const c=document.createElement("canvas"); c.width=w; c.height=h;
          c.getContext("2d").drawImage(img,0,0,w,h);
          c.toBlob(b=>b?resolve(b):reject(new Error("Compress failed")),"image/jpeg",0.85);
        }; img.onerror=()=>reject(new Error("Bad image")); img.src=rd.result; };
        rd.onerror=()=>reject(new Error("Read failed")); rd.readAsDataURL(file);
      });
    }
    function changeAvatar(){
      const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
      inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
        try{
          const blob = f.type==="image/gif" ? f : await compressImg(f,400);
          const fd=new FormData(); fd.append("file", blob, f.name||"avatar.jpg");
          const r=await fetch("/avatar",{method:"POST",credentials:"include",body:fd});
          const d=await r.json();
          if(!r.ok||d.success===false) throw new Error(d.error||"Upload failed");
          showOwn();
        }catch(e){ alert(e.message); }
      };
      inp.click();
    }
    async function removeAvatar(){
      try{ await api("/avatar/remove",{method:"POST",body:"{}"}); showOwn(); }catch(e){ alert(e.message); }
    }

    /* ---- Banner / badges / pinned post ---- */
    function bannerHtml(banner, own){
      const bg = banner ? `background-image:url('${encodeURI(banner+'').replace(/['()]/g, encodeURIComponent)}')` : '';
      return `<div class="id-banner" style="${bg}">${own?`<button class="ghost bedit" style="width:auto;margin:0;padding:.25rem .7rem;font-size:.72rem;" onclick="editBanner()"><i class="fas fa-image"></i> Banner</button>`:''}</div>`;
    }
    function badgesHtml(badges){
      if(!badges || !badges.length) return '';
      return `<div class="badges">${badges.map(b=>`<span class="badge" style="color:${b.color};border-color:${b.color}55" title="${esc(b.desc)}"><i class="fas ${b.icon}"></i> ${esc(b.name)}</span>`).join("")}</div>`;
    }
    function pinnedHtml(pin, own, myBlogs){
      let picker='';
      if(own){
        const opts=(myBlogs||[]).map(b=>`<option value="${b.id}" ${pin&&pin.id===b.id?'selected':''}>${esc(b.title)}</option>`).join("");
        picker=`<div style="margin-top:.7rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;">
          <select id="pinSel" style="width:auto;margin:0;flex:1;min-width:160px;"><option value="">— none —</option>${opts}</select>
          <button style="width:auto;margin:0;padding:.5rem 1rem;" onclick="savePin()">Pin</button></div>`;
      }
      if(!pin && !own) return '';
      return `<div class="pinned"><div class="pl">📌 Pinned post</div>
        ${pin?`<h4><a href="/blogs?b=${pin.id}">${esc(pin.title)}</a></h4><p>${esc(pin.excerpt||'')}</p>`:'<p class="muted" style="margin:0">No pinned post yet — choose one below.</p>'}
        ${picker}</div>`;
    }
    async function editBanner(){
      const url=prompt("Paste a direct https:// image link for your profile banner.\nLeave blank to remove it.", window._banner||"");
      if(url===null) return;
      try{ await api("/banner",{method:"POST",body:JSON.stringify({url:url.trim()})}); showOwn(); }
      catch(e){ alert(e.message); }
    }
    async function savePin(){
      const v=document.getElementById("pinSel").value;
      try{ await api("/profile/pin",{method:"POST",body:JSON.stringify({blog_id:v||null})}); showOwn(); }
      catch(e){ alert(e.message); }
    }

    /* ---- Own full ID card ---- */
    function editBio(){
      const box=document.getElementById("bioText"); if(!box) return;
      box.outerHTML = `<div style="margin-top:.5rem;">
        <textarea id="bioInput" rows="3" maxlength="300" placeholder="e.g. President of Cyvathon, founder of Import &amp; Export, aspiring tycoon.">${esc(window._bio||"")}</textarea>
        <div class="row" style="gap:.5rem;margin-top:.5rem;">
          <button onclick="saveBio()">Save</button>
          <button class="ghost" onclick="showOwn()">Cancel</button>
        </div></div>`;
      document.getElementById("bioInput").focus();
    }
    async function saveBio(){
      const v=document.getElementById("bioInput").value;
      try{ await api("/bio",{method:"POST",body:JSON.stringify({bio:v})}); showOwn(); }
      catch(e){ alert(e.message); }
    }

    async function showOwn(){
      const d = await api("/profile_data");
      const p = d.profile;
      window._bio = p.bio || ""; window._banner = d.banner || "";
      const roles = (d.cabinet_role||[]);
      document.getElementById("view").innerHTML = `
        <h2 class="section-title"><i class="fas fa-id-card"></i> Citizen ID Card</h2>
        <div class="id-card">
          ${bannerHtml(d.banner, true)}
          <div class="id-top">
            <div class="id-avatar" ${avatarStyle(p.avatar)}>${p.avatar?'':esc(p.username[0].toUpperCase())}</div>
            <div><h2>${esc(p.username)}</h2><span class="pill">${esc(p.designation)}</span>
              ${p.account_type==='micronation'?`<span class="pill" style="background:linear-gradient(135deg,#26e0a8,#12a37c);color:#032018;">🏳️ Micronation</span>`:''}
              ${p.allied?`<span class="pill" style="background:rgba(31,214,166,.18);color:#4be3b6;">🤝 Allied with Cyvathon</span>`:(p.ally_interest?`<span class="pill" style="background:rgba(255,206,86,.16);color:#ffce56;">Seeking alliance</span>`:'')}
              <div style="margin-top:.5rem;">
                <button class="ghost" style="width:auto;margin:0;padding:.3rem .8rem;font-size:.78rem;" onclick="changeAvatar()"><i class="fas fa-camera"></i> ${p.avatar?'Change':'Add'} photo</button>
                ${p.avatar?`<button class="ghost" style="width:auto;margin:0 0 0 .3rem;padding:.3rem .7rem;font-size:.78rem;" onclick="removeAvatar()">Remove</button>`:''}
              </div>
            </div>
          </div>
          <div class="id-body">
            <div class="id-row"><span class="l">Cybucks</span><b>${fmt(p.balance)}</b></div>
            <div class="id-row"><span class="l">Pufferbucks</span><b>${fmt(p.pufb)}</b></div>
            <div class="id-row"><span class="l">Aquilines</span><b>${fmt(p.aquilines)}</b></div>
            <div class="id-row"><span class="l">Cybits</span><b>${fmt(p.cybits)}</b></div>
            <div class="id-row"><span class="l">Email</span><b>${p.email?esc(p.email):"—"}</b></div>
            <div class="id-row"><span class="l">Weekly Salary</span><b>${fmt(d.salary)} CB</b></div>
            ${roles.length?`<div class="id-row"><span class="l">Cabinet Role</span><b style="color:var(--gold)">${roles.map(esc).join(", ")}</b></div>`:''}
            <div class="id-row"><span class="l">Company</span><b>${d.company?esc(d.company.name):"None"}</b></div>
            <div class="id-row"><span class="l">Citizen Since</span><b>${d.member_since?new Date(d.member_since).toLocaleDateString():"—"}</b></div>
            <div class="id-watermark">★ REPUBLIC OF CYVATHON ★</div>
          </div>
        </div>
        <p style="text-align:center;margin:-.6rem 0 1.2rem;">
          <a class="link" href="/passport"><i class="fas fa-passport"></i> View Passport &amp; Citizenship →</a></p>
        ${badgesHtml(d.badges)}
        ${pinnedHtml(d.pinned, true, d.my_blogs)}
        <div class="panel" style="text-align:left;margin:0 0 1.4rem;">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;">
            <b><i class="fas fa-circle-info"></i> What I Do</b>
            <button class="ghost" style="width:auto;margin:0;padding:.3rem .8rem;font-size:.78rem;" onclick="editBio()"><i class="fas fa-pen"></i> Edit</button>
          </div>
          <p id="bioText" style="margin-top:.5rem;white-space:pre-wrap;color:${p.bio?'var(--text)':'var(--muted)'};">${p.bio?esc(p.bio):"Add a description of what you do in Cyvathon."}</p>
        </div>
        <div class="panel ${(p.interests&&p.interests.length)?'':'int-req'}" id="interestPanel" style="text-align:left;margin:0 0 1.4rem;"></div>
        <h3 style="margin-bottom:.8rem;"><i class="fas fa-file-lines"></i> Official Record</h3>
        <div>${recordsHtml(d.records)}</div>`;
      renderInterests(p.interests||[]);
    }

    /* ---- Interests (favorite things) ---- */
    let _intCatalog = null, _intSel = new Set();
    async function renderInterests(current){
      _intSel = new Set(current||[]);
      const panel = document.getElementById("interestPanel"); if(!panel) return;
      if(!_intCatalog){ try{ _intCatalog = (await api("/interests_catalog")).interests||[]; }catch{ _intCatalog=[]; } }
      const need = _intSel.size===0;
      panel.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;">
          <b><i class="fas fa-heart" style="color:${need?'var(--gold)':'var(--red)'}"></i> What I Love</b>
          <button class="ghost" style="width:auto;margin:0;padding:.3rem .9rem;font-size:.78rem;" id="intSaveBtn" onclick="saveInterests()"><i class="fas fa-check"></i> Save</button>
        </div>
        <p class="small" style="color:${need?'var(--gold)':'var(--muted)'};margin:.4rem 0 0;">
          ${need?'Pick what you love so Cyvathon can recommend features and put you in group chats with similar people — please set this.':'Tap to update your interests. These power your dashboard recommendations & interest group chats.'}</p>
        <div class="chips" id="intChips">${_intCatalog.map(i=>
          `<span class="chip ${_intSel.has(i.key)?'on':''}" onclick="toggleIntChip(this,'${i.key}')"><i class="fas ${i.icon}"></i> ${esc(i.label)}</span>`).join("")}</div>
        <p id="intMsg" class="small" style="margin:.2rem 0 0;min-height:1em;"></p>`;
    }
    function toggleIntChip(el,k){
      if(_intSel.has(k)){ _intSel.delete(k); el.classList.remove("on"); }
      else { _intSel.add(k); el.classList.add("on"); }
    }
    async function saveInterests(){
      const msg=document.getElementById("intMsg");
      if(_intSel.size===0){ msg.style.color="var(--red)"; msg.textContent="Pick at least one thing you love."; return; }
      document.getElementById("intSaveBtn").disabled=true;
      try{
        const d=await api("/interests",{method:"POST",body:JSON.stringify({interests:Array.from(_intSel)})});
        msg.style.color="var(--green)"; msg.textContent="Saved! You've joined the matching group chats — find them in Chat.";
        document.getElementById("interestPanel").classList.remove("int-req");
      }catch(e){ msg.style.color="var(--red)"; msg.textContent=e.message; }
      finally{ document.getElementById("intSaveBtn").disabled=false; }
    }

    /* ---- Another citizen's public profile ---- */
    async function showPublic(username){
      let d;
      try{ d = await api("/u/"+encodeURIComponent(username)); }
      catch(e){ document.getElementById("view").innerHTML = `<p class="muted">${e.message}</p><p><a class="link" href="/chat">← Back</a></p>`; return; }
      if(d.profile.is_self){ return showOwn(); }
      const p = d.profile;
      const companies = (p.companies||[]).map(c=>`<a class="link" href="/company?id=${c.id}">${esc(c.name)}</a>`).join(", ") || "None";
      const jobs = (p.jobs||[]).map(j=>`${esc(j.role)} @ <a class="link" href="/company?id=${j.company_id}">${esc(j.company)}</a>`).join(", ") || "None";
      document.getElementById("view").innerHTML = `
        <p><a class="link" href="#" onclick="history.back();return false;"><i class="fas fa-arrow-left"></i> Back</a></p>
        <h2 class="section-title"><i class="fas fa-id-card"></i> Citizen Profile</h2>
        <div class="id-card">
          ${bannerHtml(p.banner, false)}
          <div class="id-top">
            <div class="id-avatar" ${avatarStyle(p.avatar)}>${p.avatar?'':esc(p.username[0].toUpperCase())}</div>
            <div><h2>${esc(p.username)}</h2><span class="pill">${esc(p.designation)}</span>
              ${p.account_type==='micronation'?`<span class="pill" style="background:linear-gradient(135deg,#26e0a8,#12a37c);color:#032018;">🏳️ Micronation</span>`:''}
              ${p.allied?`<span class="pill" style="background:rgba(31,214,166,.18);color:#4be3b6;">🤝 Allied</span>`:(p.ally_interest?`<span class="pill" style="background:rgba(255,206,86,.16);color:#ffce56;">Seeking alliance</span>`:'')}
            </div>
          </div>
          <div class="id-body">
            <div class="id-row"><span class="l">Net Worth</span><b style="color:var(--accent)">${fmt(p.net_worth)} CB</b></div>
            ${(p.cabinet_role&&p.cabinet_role.length)?`<div class="id-row"><span class="l">Cabinet Role</span><b style="color:var(--gold)">${p.cabinet_role.map(esc).join(", ")}</b></div>`:''}
            <div class="id-row"><span class="l">Companies Founded</span><b>${companies}</b></div>
            <div class="id-row"><span class="l">Employment</span><b>${jobs}</b></div>
            <div class="id-row"><span class="l">Citizen Since</span><b>${p.member_since?new Date(p.member_since).toLocaleDateString():"—"}</b></div>
            <div class="id-watermark">★ REPUBLIC OF CYVATHON ★</div>
          </div>
        </div>
        ${badgesHtml(p.badges)}
        ${pinnedHtml(p.pinned, false)}
        ${p.bio?`<div class="panel" style="text-align:left;margin:0 0 1.4rem;"><b><i class="fas fa-circle-info"></i> What ${esc(p.username)} Does</b><p style="margin-top:.5rem;white-space:pre-wrap;">${esc(p.bio)}</p></div>`:''}
        <h3 style="margin-bottom:.8rem;"><i class="fas fa-file-lines"></i> Public Record</h3>
        <div>${recordsHtml(p.records)}</div>`;
    }

    (async function(){
      const me = await requireAuth(); if(!me) return;
      renderNav("/profile", me);
      const who = qs.get("user");
      if(who && who !== me.username) showPublic(who); else showOwn();
    })();
  </script>
</body>
</html>
