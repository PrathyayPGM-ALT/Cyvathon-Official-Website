<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybucks Banking System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      margin: auto;
      background: #1a1a1a;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }
    h2, h3 {
      text-align: center;
    }
    input, button, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }
    input, select {
      background: #111;
      color: #fff;
    }
    button {
      background: #00b894;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #019371; }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .row button {
      flex: 1;
    }
    .small {
      font-size: 12px;
      color: #aaa;
      margin-top: 6px;
    }
    #bankBox {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Cybucks Banking System</h2>

    <!-- LOGIN / REGISTER BOX -->
    <div id="authBox">
      <input id="username" placeholder="Username">
      <input id="password" type="password" placeholder="Password">

      <div class="row">
        <button onclick="login()">Login</button>
        <button onclick="registerUser()">Register</button>
      </div>
      <p class="small">
        Tip: Register once, then login. Your cybucks are stored on the server.
      </p>
    </div>

    <!-- BANK SYSTEM -->
    <div id="bankBox" style="display:none;">
      <h3>Welcome, <span id="userDisplay"></span>!</h3>
      <p>Balance: <b id="balance">0</b> Cybucks</p>

      <h4>Send Cybucks</h4>
      <select id="recipientSelect">
        <option value="">Select recipient</option>
      </select>

      <input id="amount" type="number" min="1" placeholder="Amount to send">
      <button onclick="sendCybucks()">Send</button>

      <button style="margin-top:12px; background:#d63031;" onclick="logout()">
        Logout
      </button>
    </div>
  </div>

<script>
  // If your backend is same origin (cyvathon-official-website.onrender.com), this can be empty string
  const API_BASE = ""; // "" means same domain

  async function fetchJSON(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      credentials: "include", // send session cookie
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    });

    const text = await res.text();
    let data;
    try {
      data = text ? JSON.parse(text) : {};
    } catch (e) {
      throw new Error("Bad JSON from server: " + text.slice(0, 200));
    }

    if (!res.ok || data.success === false) {
      const errMsg = data.error || ("HTTP " + res.status);
      throw new Error(errMsg);
    }
    return data;
  }

  function showBank(username, balance) {
    document.getElementById("userDisplay").innerText = username;
    document.getElementById("balance").innerText = balance;

    document.getElementById("authBox").style.display = "none";
    document.getElementById("bankBox").style.display = "block";
  }

  function showAuth() {
    document.getElementById("authBox").style.display = "block";
    document.getElementById("bankBox").style.display = "none";
  }

  async function loadUsers() {
    try {
      const data = await fetchJSON("/users", { method: "GET" });
      const select = document.getElementById("recipientSelect");
      select.innerHTML = '<option value="">Select recipient</option>';

      data.users.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        select.appendChild(opt);
      });
    } catch (err) {
      console.error("Could not load users:", err.message);
    }
  }

  // REGISTER
  async function registerUser() {
    try {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!user || !pass) {
        alert("Fill username and password, vro");
        return;
      }

      const data = await fetchJSON("/register", {
        method: "POST",
        body: JSON.stringify({ username: user, password: pass })
      });

      alert("Registered and logged in as " + data.username);
      showBank(data.username, data.balance);
      await loadUsers();
    } catch (err) {
      console.error(err);
      alert("Register failed: " + err.message);
    }
  }

  // LOGIN
  async function login() {
    try {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!user || !pass) {
        alert("Fill username and password, vro");
        return;
      }

      const data = await fetchJSON("/login", {
        method: "POST",
        body: JSON.stringify({ username: user, password: pass })
      });

      showBank(data.username, data.balance);
      await loadUsers();
    } catch (err) {
      console.error(err);
      alert("Login failed: " + err.message);
    }
  }

  // SEND CYBUCKS
  async function sendCybucks() {
    try {
      const select = document.getElementById("recipientSelect");
      const toUser = select.value;
      const amount = parseInt(document.getElementById("amount").value, 10);

      if (!toUser) {
        alert("Select a recipient");
        return;
      }
      if (!amount || amount <= 0) {
        alert("Enter a positive amount");
        return;
      }

      const data = await fetchJSON("/transfer", {
        method: "POST",
        body: JSON.stringify({ to_username: toUser, amount })
      });

      alert("Sent " + amount + " Cybucks to " + toUser);
      document.getElementById("balance").innerText = data.balance;
      document.getElementById("amount").value = "";
    } catch (err) {
      console.error(err);
      alert("Transfer failed: " + err.message);
    }
  }

  // LOGOUT
  async function logout() {
    try {
      await fetchJSON("/logout", { method: "POST", body: JSON.stringify({}) });
    } catch (err) {
      console.warn("Logout error:", err.message);
    }
    showAuth();
  }

  // On load, check if already logged in
  (async function init() {
    try {
      const data = await fetchJSON("/me", { method: "GET" });
      showBank(data.username, data.balance);
      await loadUsers();
    } catch (err) {
      // not logged in, show auth
      showAuth();
    }
  })();
</script>

</body>
</html>
