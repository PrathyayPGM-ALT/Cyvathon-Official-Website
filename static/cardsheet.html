<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Sheet · Cyvathon</title>
  <!-- social / SEO metadata -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Print every citizen's Cyvathon debit card." />
  <link rel="canonical" href="https://cyvathon.onrender.com/card/sheet" />
  <meta name="theme-color" content="#58c4ff" />
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cyvathon" />
  <meta property="og:title" content="Card Sheet · Cyvathon" />
  <meta property="og:description" content="Print every citizen's Cyvathon debit card." />
  <meta property="og:url" content="https://cyvathon.onrender.com/card/sheet" />
  <meta property="og:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Card Sheet · Cyvathon" />
  <meta name="twitter:description" content="Print every citizen's Cyvathon debit card." />
  <meta name="twitter:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/card.css">
  <style>
    /* Cut lines are dashed so they vanish into the scissor cut. */
    .sheet .cy-card{ outline:.3mm dashed rgba(120,160,190,.55); outline-offset:1.6mm; }
    .sheet{ display:grid; grid-template-columns:repeat(2,85.6mm);
      gap:9mm 8mm; justify-content:center; }
    @media(max-width:820px){ .sheet{ grid-template-columns:85.6mm; } }
    @media print{
      @page{ size:A4 portrait; margin:9mm; }
      body{ background:#fff !important; }
      #nav,.noprint{ display:none !important; }
      .sheet{ gap:8mm 6mm; }
      .sheet .cy-card{ break-inside:avoid; page-break-inside:avoid; }
    }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap" style="max-width:1000px;">
    <h2 class="section-title noprint"><i class="fas fa-id-card"></i> Citizen Card Sheet</h2>
    <p class="section-sub noprint">
      Every citizen's card, 10 to an A4 page. Print, cut along the dashed lines, hand out.
    </p>
    <div class="noprint" style="margin-bottom:1.4rem;">
      <button onclick="window.print()" style="width:auto;margin:0;">
        <i class="fas fa-print"></i> Print all
      </button>
      <span class="small" id="count" style="margin-left:.8rem;color:var(--muted);"></span>
      <p id="msg" class="small" style="margin-top:.6rem;"></p>
    </div>

    <div class="sheet" id="sheet"></div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/card.js"></script>
  <script>
    (async function(){
      const user = await requireAuth(); if(!user) return;
      renderNav("/card", user);
      try{
        const d = await api("/card/all");
        document.getElementById("sheet").innerHTML = d.cards.map(cyCardStatic).join("");
        const pages = Math.ceil(d.count/10);
        document.getElementById("count").textContent =
          `${d.count} card${d.count===1?"":"s"} · ${pages} A4 page${pages===1?"":"s"}`;
      }catch(e){
        const m = document.getElementById("msg");
        m.textContent = e.message; m.style.color = "var(--red)";
      }
    })();
  </script>
</body>
</html>
