<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay by Card · Cyvathon</title>
  <!-- social / SEO metadata -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Scan a Cyvathon card and send the cardholder money." />
  <link rel="canonical" href="https://cyvathon.onrender.com/pay" />
  <meta name="theme-color" content="#58c4ff" />
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cyvathon" />
  <meta property="og:title" content="Pay by Card · Cyvathon" />
  <meta property="og:description" content="Scan a Cyvathon card and send the cardholder money." />
  <meta property="og:url" content="https://cyvathon.onrender.com/pay" />
  <meta property="og:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pay by Card · Cyvathon" />
  <meta name="twitter:description" content="Scan a Cyvathon card and send the cardholder money." />
  <meta name="twitter:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .payee{ display:flex; align-items:center; gap:.9rem; padding:1rem 1.1rem;
      border:1px solid var(--panel-border); border-radius:14px; background:var(--panel);
      margin-bottom:1.2rem; }
    .payee .av{ width:52px; height:52px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-weight:800;
      font-size:1.3rem; color:#06223a;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      background-size:cover; background-position:center; }
    .payee .nm{ font-size:1.15rem; font-weight:700; }
    .payee .rl{ font-size:.8rem; color:var(--muted); }
    .cardno{ font-family:"Consolas",monospace; font-size:.78rem; color:var(--muted);
      letter-spacing:.5px; margin-top:.15rem; }
    .amtrow{ display:flex; gap:.6rem; }
    .amtrow input{ flex:1; }
    .amtrow select{ width:auto; flex-shrink:0; }
    .quick{ display:flex; gap:.5rem; flex-wrap:wrap; margin:.7rem 0 1rem; }
    .quick button{ width:auto; margin:0; padding:.4rem .9rem; font-size:.85rem; }
    .done{ text-align:center; padding:2rem 1rem; }
    .done i{ font-size:3rem; color:var(--green); }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap" style="max-width:480px;">
    <h2 class="section-title"><i class="fas fa-qrcode"></i> Pay by Card</h2>
    <p class="section-sub" id="sub">Scan a citizen's card, or type their card number.</p>

    <div id="lookup" class="panel" style="display:none;">
      <h3>Card number</h3>
      <input id="cardin" inputmode="numeric" autocomplete="off"
             placeholder="4921 0000 0000 0000" maxlength="19">
      <button onclick="lookup()"><i class="fas fa-magnifying-glass"></i> Find citizen</button>
    </div>

    <div id="form" style="display:none;">
      <div class="payee" id="payee"></div>
      <div class="panel">
        <h3>Amount</h3>
        <div class="amtrow">
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00">
          <select id="currency">
            <option value="cybucks">CB — Cybucks</option>
            <option value="pufb">PB — Pufferbucks</option>
            <option value="aquilines">AQ — Aquilines</option>
            <option value="cybit">cb — Cybits</option>
          </select>
        </div>
        <div class="quick">
          <button class="ghost" onclick="setAmt(10)">10</button>
          <button class="ghost" onclick="setAmt(50)">50</button>
          <button class="ghost" onclick="setAmt(100)">100</button>
          <button class="ghost" onclick="setAmt(500)">500</button>
        </div>
        <p class="small">Your balance: <b id="bal">—</b></p>
        <button id="payBtn" onclick="pay()"><i class="fas fa-paper-plane"></i> Send payment</button>
        <p id="msg" class="small" style="text-align:center;margin-top:.7rem;"></p>
      </div>
    </div>

    <div id="done" class="done" style="display:none;">
      <i class="fas fa-circle-check"></i>
      <h3 id="doneTxt" style="margin-top:.8rem;"></h3>
      <button class="ghost" style="margin-top:1rem;" onclick="location.href='/bank'">Back to the bank</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let PAYEE = null, CARDNO = null, ME = null;
    const msg=(t,err=true)=>{const m=document.getElementById("msg");
      m.textContent=t; m.style.color=err?"var(--red)":"var(--green)";};
    const esc=(s)=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    const setAmt=(n)=>{ document.getElementById("amount").value=n; };

    function showPayee(h, cardno){
      PAYEE = h; CARDNO = cardno;
      const initial = esc((h.username||"?")[0].toUpperCase());
      document.getElementById("payee").innerHTML =
        `<div class="av" ${avatarStyle(h.avatar)}>${h.avatar?"":initial}</div>
         <div><div class="nm">${esc(h.username)}</div>
              <div class="rl">${esc(h.designation||"Citizen")}</div>
              <div class="cardno">${esc(cardno.replace(/(\d{4})(?=\d)/g,"$1 "))}</div></div>`;
      document.getElementById("lookup").style.display="none";
      document.getElementById("form").style.display="";
      document.getElementById("sub").textContent="Sending money to this citizen.";
    }

    async function resolve(cardno){
      const d = await api("/card/resolve?c="+encodeURIComponent(cardno));
      showPayee(d.holder, cardno.replace(/\D/g,""));
    }

    async function lookup(){
      const raw = document.getElementById("cardin").value.replace(/\D/g,"");
      if(raw.length !== 16){ msg("A card number is 16 digits."); return; }
      try{ await resolve(raw); }
      catch(e){ alert(e.message); }
    }

    async function pay(){
      const amount = parseFloat(document.getElementById("amount").value);
      const currency = document.getElementById("currency").value;
      if(!(amount > 0)){ msg("Enter an amount."); return; }
      if(PAYEE.username === ME.username){ msg("That's your own card."); return; }
      const btn = document.getElementById("payBtn");
      btn.disabled = true;
      try{
        // Reuses /transfer, so payments go through the same atomic
        // compare-and-swap as every other transfer in the bank.
        await api("/transfer",{method:"POST",body:JSON.stringify({
          to_username: PAYEE.username, currency, amount })});
        document.getElementById("form").style.display="none";
        document.getElementById("sub").style.display="none";
        document.getElementById("done").style.display="";
        document.getElementById("doneTxt").textContent =
          `Sent ${amount} to ${PAYEE.username}`;
      }catch(e){ msg(e.message); btn.disabled=false; }
    }

    (async function(){
      const user = await requireAuth(); if(!user) return;
      ME = user;
      renderNav("/pay", user);
      document.getElementById("bal").textContent =
        `${fmt(user.balance)} CB · ${fmt(user.pufb)} PB · ${fmt(user.aquilines)} AQ · ${fmt(user.cybits)} cb`;

      const c = new URLSearchParams(location.search).get("c");
      if(c){
        try{ await resolve(c); }
        catch(e){
          document.getElementById("lookup").style.display="";
          document.getElementById("sub").textContent = e.message;
        }
      } else {
        document.getElementById("lookup").style.display="";
      }
    })();
  </script>
</body>
</html>
