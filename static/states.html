<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>States · Cyvathon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .state-grid{ display:grid; gap:1.4rem; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
    .state{ position:relative; border-radius:16px; overflow:hidden; border:1px solid var(--panel-border);
      background:var(--panel); transition:.25s; display:flex; flex-direction:column; }
    .state:hover{ transform:translateY(-6px); box-shadow:0 16px 40px rgba(0,0,0,.4); }
    .state .banner{ height:96px; display:flex; align-items:center; justify-content:center; font-size:3rem;
      position:relative; }
    .state .banner::after{ content:""; position:absolute; inset:0; opacity:.18;
      background:radial-gradient(circle at 30% 20%, currentColor, transparent 70%); }
    .state .body{ padding:1.2rem 1.3rem 1.4rem; flex:1; display:flex; flex-direction:column; }
    .state h3{ display:flex; align-items:center; gap:.5rem; margin-bottom:.2rem; }
    .state .cap{ font-size:.78rem; color:var(--muted); margin-bottom:.6rem; }
    .state .tag{ font-size:.88rem; color:var(--muted); flex:1; }
    .sec{ position:absolute; top:.7rem; right:.7rem; font-size:.66rem; font-weight:700; letter-spacing:.5px;
      padding:.25rem .6rem; border-radius:20px; text-transform:uppercase; background:rgba(0,0,0,.45); color:#fff; }
    .statusrow{ display:flex; align-items:center; gap:.5rem; margin:.8rem 0 .4rem; font-size:.8rem; }
    .dot{ width:9px; height:9px; border-radius:50%; }
    .ok{ background:var(--green); } .no{ background:var(--gold); }
    .visited{ font-size:.72rem; color:var(--green); }
    .capital{ font-size:.6rem; font-weight:700; letter-spacing:.4px; color:var(--gold);
      border:1px solid rgba(255,206,86,.4); background:rgba(255,206,86,.1); padding:.12rem .5rem; border-radius:20px; vertical-align:middle; }
    .homebadge{ font-size:.72rem; color:var(--accent); font-weight:600; }
    .pop{ font-size:.72rem; color:var(--muted); }
    .state.ishome{ border-color:rgba(88,196,255,.5); box-shadow:0 0 0 1px rgba(88,196,255,.25); }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap">
    <h2 class="section-title"><i class="fas fa-map-location-dot"></i> States of Cyvathon</h2>
    <p class="section-sub">The Republic is a union of sovereign states, each with its own local marketplace.
      Cross a border and you'll pass through customs &amp; security — bring your <a class="link" href="/passport">passport</a>.</p>
    <div class="state-grid" id="grid"></div>
    <p id="msg" class="small" style="text-align:center;"></p>
  </div>

  <script src="/static/app.js"></script>
  <script>
    const esc = (s)=>(s||"").replace(/</g,"&lt;");
    const secColor = { "Basic":"#34d399", "Standard":"#58c4ff", "Maximum":"#fbbf24" };

    function card(s){
      const status = s.can_enter
        ? `<span class="statusrow"><span class="dot ok"></span> Cleared for entry</span>`
        : `<span class="statusrow"><span class="dot no"></span> Additional clearance required</span>`;
      const visited = s.visited ? `<span class="visited"><i class="fas fa-stamp"></i> Visa on file</span>` : "";
      const capital = s.is_capital ? `<span class="capital"><i class="fas fa-crown"></i> National Capital</span>` : "";
      const home = s.is_home ? `<span class="homebadge"><i class="fas fa-house-chimney"></i> Your residence</span>` : "";
      const pop = `<span class="pop"><i class="fas fa-users"></i> ${s.population} resident${s.population===1?"":"s"}</span>`;
      return `<div class="state ${s.is_home?'ishome':''}" style="color:${s.color}">
        <div class="banner" style="background:linear-gradient(160deg, ${s.color}22, transparent);">${s.flag}</div>
        <span class="sec" style="color:${secColor[s.security]||'#fff'}">${esc(s.security)} security</span>
        <div class="body" style="color:var(--text)">
          <h3>${esc(s.name)} ${capital}</h3>
          <div class="cap"><i class="fas fa-location-dot"></i> Capital: ${esc(s.capital)} &nbsp;·&nbsp; ${pop}</div>
          <div class="tag">${esc(s.tagline)}</div>
          ${status}${home||visited}
          <a href="/state?id=${s.id}"><button style="margin-top:.8rem;">
            <i class="fas fa-id-card-clip"></i> ${s.is_home?"Enter home state":"Approach border"}</button></a>
        </div>
      </div>`;
    }

    (async function(){
      const me = await requireAuth(); if(!me) return;
      renderNav("/states", me);
      try{
        const d = await api("/states/list");
        document.getElementById("grid").innerHTML = d.states.map(card).join("");
      }catch(e){ document.getElementById("msg").textContent = e.message; document.getElementById("msg").style.color="var(--red)"; }
    })();
  </script>
</body>
</html>
