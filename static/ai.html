<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyvathon AI · Assistant</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .ai-wrap{ max-width:760px; margin:0 auto; }
    .feed{ min-height:46vh; max-height:60vh; overflow-y:auto; display:flex; flex-direction:column; gap:.9rem; padding:.4rem; margin-bottom:1rem; }
    .msg{ display:flex; gap:.7rem; align-items:flex-start; max-width:88%; }
    .msg.me{ flex-direction:row-reverse; align-self:flex-end; }
    .av{ width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:.9rem;
      color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .msg.ai .av{ background:linear-gradient(135deg,#a78bfa,#7b4bc0); color:#fff; }
    .bubble{ background:#1b232e; border:1px solid #2a3340; padding:.7rem 1rem; border-radius:15px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:anywhere; }
    .msg.me .bubble{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#06223a; border:none; }
    html[data-theme="light"] .bubble{ background:#eef2f8; border-color:#d8e0ec; color:#12243d; }
    .bubble.think{ color:var(--muted); font-style:italic; }
    .suggest{ display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1rem; justify-content:center; }
    .suggest button{ width:auto; margin:0; padding:.5rem .9rem; font-size:.83rem; background:var(--panel-2);
      color:var(--text); border:1px solid var(--panel-border); box-shadow:none; }
    .suggest button:hover{ border-color:var(--accent); color:var(--accent); transform:none; }
    .composer{ display:flex; gap:.5rem; align-items:flex-end; }
    .composer textarea{ flex:1; margin:0; border-radius:18px; padding:.7rem 1.05rem; resize:none; max-height:120px; min-height:46px; }
    .composer .send{ width:48px; height:48px; flex-shrink:0; border-radius:50%; margin:0; padding:0; }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap ai-wrap">
    <h2 class="section-title"><i class="fas fa-robot"></i> Cyvathon AI</h2>
    <p class="section-sub">Your guide to the Republic. Ask how anything works — the Bank, companies, states, passports, elections, or the economy.</p>

    <div class="suggest" id="suggest">
      <button onclick="ask(this.textContent)">How do I found a company?</button>
      <button onclick="ask(this.textContent)">What are Cybits?</button>
      <button onclick="ask(this.textContent)">How do I get a passport?</button>
      <button onclick="ask(this.textContent)">How do I earn money?</button>
      <button onclick="ask(this.textContent)">How do I visit a state?</button>
    </div>

    <div class="feed" id="feed"></div>

    <div class="composer">
      <textarea id="q" rows="1" placeholder="Ask Cyvathon AI anything about the nation…"></textarea>
      <button class="send" onclick="ask()" title="Send"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let ME=null, history=[], busy=false;
    const esc=(s)=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");

    function add(role, text){
      const feed=document.getElementById("feed");
      const wrap=document.createElement("div");
      wrap.className="msg "+(role==="me"?"me":"ai");
      const av = role==="me" ? (ME?ME[0].toUpperCase():"U") : '<i class="fas fa-robot"></i>';
      wrap.innerHTML=`<div class="av">${av}</div><div class="bubble">${esc(text)}</div>`;
      feed.appendChild(wrap); feed.scrollTop=feed.scrollHeight;
      return wrap.querySelector(".bubble");
    }

    async function ask(preset){
      if(busy) return;
      const t=document.getElementById("q");
      const msg=(preset || t.value).trim();
      if(!msg) return;
      t.value=""; autogrow(t);
      document.getElementById("suggest").style.display="none";
      add("me", msg);
      history.push({role:"user", content:msg});
      const think=add("ai","Thinking…"); think.classList.add("think");
      busy=true;
      try{
        const res=await fetch("/ai_ask",{method:"POST",credentials:"include",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({message:msg, history:history.slice(-6)})});
        const d=await res.json();
        const reply=d.reply||"No response.";
        think.classList.remove("think"); think.textContent=reply;
        history.push({role:"assistant", content:reply});
      }catch(e){
        think.classList.remove("think"); think.textContent="Sorry — I couldn't reach the assistant. Try again.";
      }finally{ busy=false; document.getElementById("feed").scrollTop=document.getElementById("feed").scrollHeight; }
    }

    function autogrow(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,120)+"px"; }

    (async function(){
      const user=await requireAuth(); if(!user) return;
      ME=user.username; renderNav("/ai", user);
      add("ai", `Hi${ME?" "+ME:""}! 👋 I'm Cyvathon AI — your guide to the Republic. Tap a question above or ask me anything about how Cyvathon works.`);
      const t=document.getElementById("q");
      t.addEventListener("input",()=>autogrow(t));
      t.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); ask(); }});
    })();
  </script>
</body>
</html>
