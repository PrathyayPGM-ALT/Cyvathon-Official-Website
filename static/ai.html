<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyvathon AI</title>
  <style>
    body {
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }
    textarea {
      width: 80%;
      max-width: 600px;
      height: 120px;
      padding: 12px;
      font-size: 16px;
      margin-top: 20px;
    }
    button {
      margin-top: 10px;
      padding: 10px 24px;
      font-size: 16px;
      cursor: pointer;
    }
    #response {
      margin-top: 30px;
      white-space: pre-wrap;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

<h1>🤖 Cyvathon AI</h1>
<p>Your AI mentor for Cyvathon & cybersecurity</p>

<textarea id="prompt" placeholder="Ask the AI..."></textarea><br>
<button onclick="askAI()">Ask</button>

<div id="response"></div>

<script>
async function askAI() {
  const input = document.getElementById("prompt");
  const output = document.getElementById("response");
  const thinking = document.getElementById("thinking");

  thinking.style.display = "block";
  output.innerText = "";

  const res = await fetch("/ai_ask", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      message: input.value
    })
  });

  const data = await res.json();

  thinking.style.display = "none";
  output.innerText = data.reply || "No response";
}
</script>


</body>
</html>
