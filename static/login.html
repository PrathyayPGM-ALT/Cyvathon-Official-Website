<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Cyvathon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    body{ display:flex; flex-direction:column; min-height:100vh; }
    .auth-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
    .auth-card{ width:100%; max-width:430px; padding:2.4rem 2.2rem 2rem; position:relative; overflow:hidden;
      animation:fadeUp .5s ease both; }
    .auth-card::before{ content:""; position:absolute; top:-45%; left:-20%; width:140%; height:70%;
      background:radial-gradient(circle, rgba(88,196,255,.16), transparent 62%); pointer-events:none; }
    .brand{ display:flex; align-items:center; justify-content:center; gap:.55rem; position:relative; }
    .brand i{ font-size:1.55rem; color:var(--accent); filter:drop-shadow(0 0 10px rgba(88,196,255,.5)); }
    .brand h1{ font-size:1.5rem; font-weight:800; letter-spacing:.5px;
      background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .auth-card h2{ text-align:center; font-size:1.55rem; margin:.9rem 0 .25rem; }
    .sub{ text-align:center; color:var(--muted); font-size:.87rem; margin-bottom:1.35rem; line-height:1.5; }
    .tabs{ display:flex; background:var(--panel-2); border:1px solid var(--panel-border); border-radius:13px;
      padding:.3rem; margin-bottom:1.25rem; gap:.3rem; }
    .tabs button{ flex:1; margin:0; padding:.6rem; border:none; background:transparent; color:var(--muted);
      box-shadow:none; font-weight:600; border-radius:10px; transition:.2s; }
    .tabs button:hover{ color:var(--text); transform:none; }
    .tabs button.active{ background:linear-gradient(135deg,#5ec5ff,#3aa0ee); color:#04223b; box-shadow:0 4px 14px rgba(58,160,238,.3); }
    .field{ position:relative; margin-bottom:.8rem; }
    .field > i{ position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.95rem; pointer-events:none; }
    .field input{ margin:0; padding-left:42px; }
    .captcha-q{ display:block; font-size:.85rem; color:var(--muted); margin:.25rem 0 .35rem .2rem; }
    #submitBtn{ margin-top:.5rem; padding:.85rem; font-size:1rem; }
    .msg{ text-align:center; font-size:.86rem; margin-top:.9rem; min-height:1.25em; }
    .back{ text-align:center; margin-top:1.05rem; }
    .hp{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
    .chips{ display:flex; flex-wrap:wrap; gap:.45rem; margin-bottom:.7rem; }
    .chip{ display:inline-flex; align-items:center; gap:.4rem; padding:.45rem .75rem; border-radius:999px; cursor:pointer;
      border:1px solid var(--panel-border); background:var(--panel-2); color:var(--muted); font-size:.82rem; font-weight:600;
      transition:.15s; user-select:none; }
    .chip:hover{ color:var(--text); border-color:var(--accent); }
    .chip.on{ color:#06223a; background:linear-gradient(135deg,#5ec5ff,#3aa0ee); border-color:transparent; }
    .tcards{ display:flex; gap:.6rem; margin-bottom:1rem; }
    .tcard{ flex:1; text-align:center; padding:1rem .6rem; border-radius:14px; cursor:pointer; user-select:none;
      border:1px solid var(--panel-border); background:var(--panel-2); transition:.16s; }
    .tcard:hover{ border-color:var(--accent); transform:translateY(-2px); }
    .tcard i{ font-size:1.4rem; color:var(--muted); display:block; margin-bottom:.45rem; transition:.16s; }
    .tcard b{ display:block; font-size:.9rem; color:var(--text); }
    .tcard span{ font-size:.72rem; color:var(--muted); }
    .tcard.on{ border-color:var(--accent); background:rgba(88,196,255,.12); box-shadow:0 0 0 1px var(--accent) inset; }
    .tcard.on i{ color:var(--accent); }
    .ally-row{ display:flex; gap:.65rem; align-items:flex-start; cursor:pointer; padding:.85rem 1rem; border-radius:12px;
      background:rgba(31,214,166,.09); border:1px solid rgba(31,214,166,.4); margin-bottom:.8rem; }
    .ally-row input{ width:auto; margin:.15rem 0 0; accent-color:var(--green); flex-shrink:0; }
    .ally-row b{ font-size:.87rem; color:var(--text); }
    .ally-sub{ font-size:.75rem; color:var(--muted); }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="panel auth-card">
      <div class="brand"><i class="fas fa-code"></i><h1>CYVATHON</h1></div>
      <h2 id="title">Welcome Back</h2>
      <p class="sub" id="sub">Log in to your citizen account.</p>

      <div class="tabs">
        <button id="tabLogin" class="active" type="button" onclick="setMode('login')">Login</button>
        <button id="tabSignup" type="button" onclick="setMode('signup')">Sign Up</button>
      </div>

      <form id="authForm" onsubmit="doAuth();return false;">
        <div id="typeBox" style="display:none;">
          <label class="captcha-q">Who's signing up?</label>
          <div class="tcards">
            <div class="tcard" id="tcCitizen" onclick="pickType('citizen')">
              <i class="fas fa-user"></i><b>I'm a citizen</b><span>Join as a person</span>
            </div>
            <div class="tcard" id="tcNation" onclick="pickType('micronation')">
              <i class="fas fa-flag"></i><b>We're a micronation</b><span>Another nation</span>
            </div>
          </div>
        </div>

        <div class="field" id="fUser"><i class="fas fa-user"></i>
          <input id="username" placeholder="Username" autocomplete="username" autofocus></div>

        <div class="field" id="emailField" style="display:none;"><i class="fas fa-envelope"></i>
          <input id="email" type="email" placeholder="Email (shown on your ID card)" autocomplete="email"></div>

        <div class="field" id="fPass"><i class="fas fa-lock"></i>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password"></div>

        <div id="allyBox" style="display:none;">
          <label class="ally-row">
            <input type="checkbox" id="allyChk">
            <span><b>We're interested in an alliance with Cyvathon</b><br>
              <span class="ally-sub">The President will reach out about a treaty.</span></span>
          </label>
        </div>

        <div id="interestBox" style="display:none;">
          <label class="captcha-q">What do you love to do? <span style="opacity:.7">(pick a few — we'll tailor Cyvathon to you)</span></label>
          <div class="chips" id="chips"></div>
        </div>

        <div id="captchaBox" style="display:none;">
          <label class="captcha-q" id="captchaQ"></label>
          <div class="field"><i class="fas fa-shield-halved"></i>
            <input id="captchaA" placeholder="Human check — your answer" autocomplete="off"></div>
        </div>

        <div id="tsBox" style="display:none; margin:.2rem 0 .6rem;"></div>

        <input id="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" placeholder="Leave this empty">
        <button id="submitBtn" type="submit"><i class="fas fa-right-to-bracket"></i> Login</button>
      </form>

      <p id="msg" class="msg" style="color:var(--red);"></p>
      <p class="back"><a class="link" href="/"><i class="fas fa-arrow-left"></i> Back to home</a></p>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let mode = "login", captchaToken = "", TS_ON = false;
    const REF = (new URLSearchParams(location.search).get("ref") || "").trim();
    const $ = (id)=>document.getElementById(id);

    async function loadCaptcha(){
      try{ const d = await api("/captcha"); captchaToken = d.token; $("captchaQ").textContent = d.question; }
      catch{ $("captchaQ").textContent = "Human check unavailable — try reloading."; }
    }

    // Interest chips shown on signup.
    let selInterests = new Set();
    async function loadInterests(){
      if($("chips").dataset.loaded) return;
      try{
        const d = await api("/interests_catalog");
        $("chips").innerHTML = (d.interests||[]).map(i=>
          `<span class="chip" data-k="${i.key}" onclick="toggleChip(this,'${i.key}')"><i class="fas ${i.icon}"></i> ${i.label}</span>`).join("");
        $("chips").dataset.loaded = "1";
      }catch{}
    }
    function toggleChip(el,k){
      if(selInterests.has(k)){ selInterests.delete(k); el.classList.remove("on"); }
      else { selInterests.add(k); el.classList.add("on"); }
    }

    // Cloudflare Turnstile — render only if the server has it configured, and
    // only once the signup panel is VISIBLE (Turnstile renders blank into a
    // display:none container, which is why the widget wasn't showing).
    let tsApiReady = false, tsRendered = false;
    window.cfTurnstileReady = function(){ tsApiReady = true; renderTurnstile(); };
    function renderTurnstile(){
      if(!TS_ON || !tsApiReady || tsRendered) return;
      const box = $("tsBox");
      if(!box || box.style.display === "none") return;   // wait until it's on-screen
      try{
        window.__tsWidgetId = turnstile.render("#tsBox", { sitekey: window.__tsSiteKey, theme:"dark" });
        tsRendered = true;
      }catch(e){}
    }
    async function initTurnstile(){
      try{
        const c = await api("/public_config");
        if(c.turnstile && c.turnstile_sitekey){
          TS_ON = true;
          window.__tsSiteKey = c.turnstile_sitekey;
          const s = document.createElement("script");
          s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=cfTurnstileReady";
          s.async = true; s.defer = true;
          document.head.appendChild(s);
          if(mode === "signup"){ $("tsBox").style.display = "block"; $("captchaBox").style.display = "none"; renderTurnstile(); }
        }
      }catch{}
    }
    function tsReset(){ try{ if(TS_ON && window.turnstile && tsRendered) turnstile.reset(window.__tsWidgetId); }catch(e){} }

    let ACCT = null;      // 'citizen' | 'micronation' — chosen first, gates the rest

    function setMode(m){
      mode = m;
      if(m === "login") ACCT = null;
      $("tabLogin").classList.toggle("active", m==="login");
      $("tabSignup").classList.toggle("active", m==="signup");
      $("submitBtn").innerHTML = m==="login"
        ? '<i class="fas fa-right-to-bracket"></i> Login'
        : '<i class="fas fa-user-plus"></i> Sign Up';
      $("password").autocomplete = m==="login" ? "current-password" : "new-password";
      $("msg").textContent = "";
      applyVis();
    }

    function pickType(t){
      ACCT = t;
      $("tcCitizen").classList.toggle("on", t==="citizen");
      $("tcNation").classList.toggle("on", t==="micronation");
      applyVis();
      $("username").focus();
    }

    function applyVis(){
      const signup = mode === "signup";
      const ready  = signup && !!ACCT;        // signup fields appear once a type is picked
      const fields = !signup || ready;        // login always shows username/password

      $("typeBox").style.display   = signup ? "block" : "none";
      $("fUser").style.display     = fields ? "" : "none";
      $("fPass").style.display     = fields ? "" : "none";
      $("submitBtn").style.display = fields ? "" : "none";
      $("emailField").style.display  = ready ? "block" : "none";
      $("interestBox").style.display = ready ? "block" : "none";
      $("allyBox").style.display     = (ready && ACCT==="micronation") ? "block" : "none";
      $("captchaBox").style.display  = (ready && !TS_ON) ? "block" : "none";
      $("tsBox").style.display       = (ready && TS_ON) ? "block" : "none";

      const invitedBy = REF ? `<i class="fas fa-gift" style="color:var(--accent)"></i> Invited by <b>${REF.replace(/</g,"&lt;")}</b> — ` : "";
      if(!signup){
        $("title").textContent = "Welcome Back";
        $("sub").innerHTML = "Log in to your citizen account.";
      } else if(!ACCT){
        $("title").textContent = "Join Cyvathon";
        $("sub").innerHTML = invitedBy + "first, are you joining as a person or as a micronation?";
      } else if(ACCT === "micronation"){
        $("title").textContent = "Register your Micronation";
        $("sub").innerHTML = "Welcome, neighbour 🌐 Register your nation — you get <b>100 of each currency</b>. Reviewed by the President.";
      } else {
        $("title").textContent = "Become a Citizen";
        $("sub").innerHTML = invitedBy + "join the Republic — new citizens get <b>100 of each currency</b>. Reviewed by the President.";
      }

      if(ready) loadInterests();
      if(ready && !TS_ON) loadCaptcha();
      if(ready && TS_ON) renderTurnstile();
    }

    async function doAuth(){
      const username = $("username").value.trim();
      const password = $("password").value.trim();
      if(!username || !password){ $("msg").style.color="var(--red)"; $("msg").textContent = "Fill in username and password"; return; }
      const path = mode==="login" ? "/login" : "/register";
      const body = {username, password};
      if(mode==="signup"){
        if(!ACCT){ $("msg").style.color="var(--red)"; $("msg").textContent = "Pick whether you're a citizen or a micronation."; return; }
        body.account_type = ACCT;
        if(ACCT==="micronation") body.ally = $("allyChk").checked;
        if(TS_ON){
          const tok = (window.turnstile && window.__tsWidgetId!=null) ? turnstile.getResponse(window.__tsWidgetId) : "";
          if(!tok){ $("msg").style.color="var(--red)"; $("msg").textContent = "Please complete the human check."; return; }
          body.cf_turnstile_response = tok;
        } else {
          body.captcha_token = captchaToken;
          body.captcha_answer = $("captchaA").value.trim();
        }
        body.email = $("email").value.trim();
        body.website = $("website").value;
        body.interests = Array.from(selInterests);
        if(REF) body.ref = REF;
      }
      $("submitBtn").disabled = true;
      try{
        const r = await api(path, {method:"POST", body:JSON.stringify(body)});
        if(r.pending){
          $("msg").style.color = "var(--green)";
          $("msg").textContent = r.message || "Application submitted — awaiting Presidential approval.";
          setMode("login");
          return;
        }
        window.location.href = "/";
      }catch(e){
        $("msg").style.color = "var(--red)";
        $("msg").textContent = e.message;
        if(mode==="signup"){
          if(TS_ON) tsReset();
          else { loadCaptcha(); $("captchaA").value=""; }
        }
      }finally{ $("submitBtn").disabled = false; }
    }

    (async function(){
      if(await currentUser()){ window.location.href = "/"; return; }
      await initTurnstile();
      if(REF) setMode("signup");      // applyVis() shows the "Invited by …" line
    })();
  </script>
</body>
</html>
