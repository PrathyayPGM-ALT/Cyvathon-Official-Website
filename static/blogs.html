<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs · Cyvathon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .wrap{ max-width:1480px; }
    .layout{ display:grid; grid-template-columns:270px minmax(0,1fr) 350px; gap:1.9rem; align-items:start; margin:0 auto; }
    .rail{ position:sticky; top:88px; display:flex; flex-direction:column; gap:1.2rem; }
    .center{ min-width:0; display:flex; flex-direction:column; gap:1.2rem; }
    .card{ background:var(--panel); border:1px solid var(--panel-border); border-radius:18px; }

    /* ---- left profile card ---- */
    .me-card{ overflow:hidden; }
    .me-card .cover{ height:66px; background:linear-gradient(120deg,var(--accent),var(--accent2)); }
    .me-card .inner{ padding:0 1.2rem 1.35rem; text-align:center; }
    .me-card .av{ width:76px; height:76px; border-radius:50%; margin:-38px auto .7rem; border:3px solid var(--panel);
      display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.7rem; color:#06223a;
      background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .me-card .nm{ font-weight:800; font-size:1.12rem; } .me-card .nm a{ color:var(--text); text-decoration:none; }
    .me-card .role{ color:var(--muted); font-size:.86rem; margin-top:.2rem; }
    .me-card .stat{ display:flex; justify-content:space-between; align-items:center; margin-top:1.1rem; padding-top:1rem;
      border-top:1px solid var(--panel-border); font-size:.86rem; }
    .me-card .stat b{ color:var(--accent); font-size:1rem; } .me-card .stat span{ color:var(--muted); }
    .me-card .idbtn{ display:block; margin-top:1.1rem; padding:.65rem; border-radius:12px; text-decoration:none; text-align:center;
      font-weight:700; font-size:.9rem; color:var(--accent); border:1px solid rgba(88,196,255,.4); transition:.15s; }
    .me-card .idbtn:hover{ background:rgba(88,196,255,.1); }

    /* ---- right rail ---- */
    .rc{ padding:1.2rem 1.3rem; }
    .rc h4{ margin:0 0 1rem; font-size:.98rem; display:flex; align-items:center; gap:.5rem; }
    .voice{ display:flex; align-items:center; gap:.7rem; padding:.55rem 0; text-decoration:none; }
    .voice:not(:last-child){ border-bottom:1px solid var(--panel-border); }
    .voice .av{ width:40px; height:40px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:.92rem; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .voice .vn{ font-weight:700; color:var(--text); font-size:.92rem; } .voice:hover .vn{ color:var(--accent); }
    .voice .vs{ font-size:.77rem; color:var(--muted); }
    .prompt{ font-size:.88rem; color:#cdd6e0; line-height:1.6; }

    /* ---- composer ---- */
    .composer{ padding:1.1rem 1.2rem; }
    .composer .top{ display:flex; align-items:center; gap:.8rem; }
    .composer .av{ width:46px; height:46px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-weight:700; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .composer .pill{ flex:1; text-align:left; background:var(--panel-2); border:1px solid var(--panel-border); color:var(--muted);
      border-radius:999px; padding:.85rem 1.3rem; font-weight:600; font-size:.95rem; box-shadow:none; margin:0; width:auto; }
    .composer .pill:hover{ background:rgba(88,196,255,.08); color:var(--text); transform:none; border-color:rgba(88,196,255,.35); }
    .writer{ display:none; margin-top:1rem; }
    .writer.on{ display:block; }
    .writer input, .writer textarea{ margin-top:.7rem; }
    .writer textarea{ min-height:180px; resize:vertical; line-height:1.65; }
    .writer .actions{ display:flex; justify-content:flex-end; gap:.6rem; margin-top:.8rem; }
    .writer .actions button{ width:auto; margin:0; padding:.6rem 1.4rem; }
    .writer .ghost{ background:transparent; border:1px solid var(--panel-border); color:var(--muted); box-shadow:none; }

    /* ---- post card ---- */
    .post{ padding:1.35rem 1.5rem 1.1rem; transition:border-color .18s, box-shadow .18s, transform .18s; }
    .post.click{ cursor:pointer; }
    .post.click:hover{ border-color:rgba(88,196,255,.4); box-shadow:0 10px 30px rgba(0,0,0,.28); transform:translateY(-2px); }
    .phead{ display:flex; align-items:center; gap:.75rem; }
    .phead .av{ width:50px; height:50px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-weight:700; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); text-decoration:none; }
    .phead .pwho{ min-width:0; flex:1; }
    .phead .nm{ font-weight:700; line-height:1.25; } .phead .nm a{ color:var(--text); text-decoration:none; } .phead .nm a:hover{ color:var(--accent); }
    .phead .role{ font-size:.8rem; color:var(--muted); }
    .phead .dt{ font-size:.76rem; color:var(--muted); margin-top:.05rem; }
    .ptitle{ font-size:1.32rem; font-weight:800; letter-spacing:-.3px; margin:1rem 0 .55rem; line-height:1.3; }
    .post.click:hover .ptitle{ color:var(--accent); }
    .pbody{ color:#cdd6e0; line-height:1.7; white-space:pre-wrap; word-wrap:break-word; }
    .seemore{ color:var(--accent); font-weight:600; font-size:.9rem; display:inline-block; margin-top:.5rem; }
    .pcounts{ display:flex; align-items:center; gap:.55rem; font-size:.82rem; color:var(--muted); margin-top:1rem; min-height:1em; }
    .pcounts .hearts{ color:#ff5d6c; }
    .pbar{ display:flex; gap:.3rem; margin-top:.55rem; padding-top:.5rem; border-top:1px solid var(--panel-border); }
    .pbtn{ flex:1; background:none; border:none; color:var(--muted); cursor:pointer; font-size:.9rem; font-weight:600; padding:.6rem;
      margin:0; box-shadow:none; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:.5rem; transition:.13s; }
    .pbtn:hover{ background:var(--panel-2); color:var(--text); transform:none; }
    .pbtn.liked{ color:#ff5d6c; }

    /* comments */
    .comments{ margin-top:1rem; display:none; flex-direction:column; gap:.8rem; }
    .comments.on{ display:flex; }
    .cbox{ display:flex; gap:.6rem; align-items:center; }
    .cbox .av{ width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:.84rem; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .cbox input{ margin:0; border-radius:999px; }
    .cbox button{ margin:0; width:auto; padding:.55rem 1.15rem; white-space:nowrap; }
    .cmt{ display:flex; gap:.65rem; align-items:flex-start; }
    .cmt .av{ width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:.82rem; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .cmt .cb{ background:var(--panel-2); border:1px solid var(--panel-border); border-radius:14px; padding:.55rem .85rem; flex:1; min-width:0; }
    .cmt .cn{ font-weight:700; font-size:.84rem; } .cmt .cn a{ color:var(--text); text-decoration:none; } .cmt .cn a:hover{ color:var(--accent); }
    .cmt .cd{ color:var(--muted); font-weight:500; font-size:.75rem; margin-left:.4rem; }
    .cmt .ct{ font-size:.92rem; color:#e6ecf3; white-space:pre-wrap; margin-top:.12rem; line-height:1.5; }
    .empty{ text-align:center; color:var(--muted); padding:2.5rem 1rem; }

    /* ---- article (full post) view ---- */
    .aback{ width:auto; background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:.92rem; font-weight:600;
      padding:.35rem 0; margin:0 0 1.1rem; box-shadow:none; display:inline-flex; align-items:center; gap:.5rem; }
    .aback:hover{ color:var(--accent); transform:none; }
    .readwrap{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:1.9rem; align-items:start; }
    .article{ padding:2rem 2.2rem 1.6rem; }
    .atitle{ font-size:2rem; font-weight:800; letter-spacing:-.5px; line-height:1.22; margin:.4rem 0 1.1rem; }
    .abody{ color:#dbe4ee; line-height:1.85; font-size:1.04rem; white-space:pre-wrap; word-wrap:break-word; }
    @media(max-width:960px){ .readwrap{ grid-template-columns:1fr; } .r-side{ display:none; } }

    @media(max-width:1050px){ .layout{ grid-template-columns:250px minmax(0,1fr); } .r-rail{ display:none; } }
    @media(max-width:800px){ .layout{ grid-template-columns:1fr; } .l-rail{ display:none; } }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap">
    <div id="stage"></div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let ME=null, MEUSER=null, POSTS=[];
    const esc=(s)=>(s||"").replace(/</g,"&lt;");
    const enc=encodeURIComponent;

    function ago(d){ const s=(Date.now()-new Date(d).getTime())/1000;
      if(s<60) return "just now";
      const u=[["yr",31536000],["mo",2592000],["w",604800],["d",86400],["h",3600],["m",60]];
      for(const [l,n] of u){ const k=Math.floor(s/n); if(k>=1) return k+l; }
      return "now"; }
    function fdate(d){ return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }

    /* ---------- shared bits ---------- */
    function socialLine(p){
      const s=[];
      if(p.likes) s.push(`<span class="hearts">❤</span> ${p.likes}`);
      if(p.comments) s.push(`${p.comments} comment${p.comments>1?'s':''}`);
      if(p.shares) s.push(`${p.shares} share${p.shares>1?'s':''}`);
      return s.join(" · ");
    }
    function actionBar(p){
      const heart=p.liked?"fas":"far";
      return `<div class="pbar">
        <button class="pbtn ${p.liked?'liked':''}" id="lk${p.id}" onclick="event.stopPropagation();like(${p.id})"><i class="${heart} fa-heart"></i> Like</button>
        <button class="pbtn" onclick="event.stopPropagation();commentAction(${p.id})"><i class="far fa-comment"></i> Comment</button>
        <button class="pbtn" id="sh${p.id}" onclick="event.stopPropagation();share(${p.id})"><i class="fas fa-share"></i> Share</button>
      </div>`;
    }

    /* ---------- rails ---------- */
    function topVoicesCard(){
      const tally={};
      POSTS.forEach(p=>{ const k=p.username; if(!k) return;
        (tally[k]=tally[k]||{username:k,avatar:p.avatar,designation:p.designation,n:0}).n++; });
      const voices=Object.values(tally).sort((a,b)=>b.n-a.n).slice(0,5);
      return `<div class="card rc"><h4>🏛️ Top voices</h4>
        ${voices.length?voices.map(v=>{ const vn=esc(v.username);
          return `<a class="voice" href="/profile?user=${enc(v.username)}">
            <div class="av" ${avatarStyle(v.avatar)}>${v.avatar?'':vn[0].toUpperCase()}</div>
            <div><div class="vn">${vn}</div><div class="vs">${esc(v.designation||"Citizen")} · ${v.n} post${v.n>1?'s':''}</div></div>
          </a>`; }).join(""):`<div class="vs" style="color:var(--muted)">No writers yet.</div>`}
      </div>`;
    }
    function leftRail(){
      const u=MEUSER||{}; const n=esc(u.username||"?");
      const myPosts=POSTS.filter(p=>p.username===u.username).length;
      return `<div class="rail l-rail">
        <div class="card me-card">
          <div class="cover"></div>
          <div class="inner">
            <div class="av" ${avatarStyle(u.avatar)}>${u.avatar?'':n[0].toUpperCase()}</div>
            <div class="nm"><a href="/profile">${n}</a></div>
            <div class="role">${esc(u.designation||"Citizen")} · Cyvathon</div>
            <div class="stat"><span>Your posts</span><b>${myPosts}</b></div>
            <a class="idbtn" href="/profile"><i class="fas fa-id-card"></i> View ID Card</a>
          </div>
        </div>
        ${topVoicesCard()}
      </div>`;
    }
    function rightRail(){
      return `<div class="rail r-rail">
        <div class="card rc"><h4>✍️ Not sure what to write?</h4>
          <ul class="prompt" style="margin:0;padding-left:1.1rem;">
            <li>How you made your first 1,000 CB</li>
            <li>A company you're building</li>
            <li>What the Republic should do next</li>
            <li>A lesson from the markets</li>
          </ul></div></div>`;
    }

    /* ---------- FEED ---------- */
    function feedCard(p){
      const n=esc(p.username||"?");
      return `<div class="card post click" id="bp${p.id}" onclick="openPost(${p.id})">
        <div class="phead">
          <a class="av" href="/profile?user=${enc(p.username)}" onclick="event.stopPropagation()" ${avatarStyle(p.avatar)}>${p.avatar?'':n[0].toUpperCase()}</a>
          <div class="pwho">
            <div class="nm"><a href="/profile?user=${enc(p.username)}" onclick="event.stopPropagation()">${n}</a></div>
            <div class="role">${esc(p.designation||"Citizen")}</div>
            <div class="dt">${ago(p.created_at)} · ${fdate(p.created_at)}</div>
          </div>
        </div>
        <div class="ptitle">${esc(p.title)}</div>
        <div class="pbody">${esc(p.excerpt||"")}</div>
        ${(p.excerpt||"").endsWith("…")?`<span class="seemore">…see more</span>`:''}
        <div class="pcounts" id="pc${p.id}">${socialLine(p)}</div>
        ${actionBar(p)}
        <div class="comments" id="cm${p.id}"></div>
      </div>`;
    }
    function renderFeed(){
      document.title="Blogs · Cyvathon";
      const feed = POSTS.length
        ? POSTS.map(feedCard).join("")
        : `<p class="empty">No posts yet — share the Republic's first! ✍️</p>`;
      document.getElementById("stage").innerHTML=`
        <div class="layout">
          ${leftRail()}
          <div class="center">
            <div class="card composer">
              <div class="top">
                <div class="av" ${avatarStyle((MEUSER||{}).avatar)}>${(MEUSER&&MEUSER.avatar)?'':(ME||'?')[0].toUpperCase()}</div>
                <button class="pill" onclick="openWriter()">Share something with the Republic…</button>
              </div>
              <div class="writer" id="writer">
                <input id="bTitle" placeholder="Headline" maxlength="160">
                <textarea id="bBody" placeholder="What do you want to say?" maxlength="20000"></textarea>
                <p id="bMsg" class="small" style="margin:.5rem 0 0;min-height:1em;"></p>
                <div class="actions"><button class="ghost" onclick="closeWriter()">Cancel</button>
                  <button onclick="publish()" id="bPub"><i class="fas fa-paper-plane"></i> Post</button></div>
              </div>
            </div>
            <div class="center" id="feed" style="gap:1.2rem">${feed}</div>
          </div>
          ${rightRail()}
        </div>`;
    }

    /* ---------- ARTICLE (full post) ---------- */
    async function renderArticle(id){
      document.getElementById("stage").innerHTML=`<button class="aback" onclick="goFeed()"><i class="fas fa-arrow-left"></i> Back to feed</button><p class="empty">Loading…</p>`;
      let d;
      try{ d=await api("/blog/"+id); }
      catch(e){ document.getElementById("stage").innerHTML=`<button class="aback" onclick="goFeed()"><i class="fas fa-arrow-left"></i> Back to feed</button><p class="empty">${esc(e.message)}</p>`; return; }
      const p=d.post; p.likes=d.likes; p.liked=d.liked; p.comments=(d.comments||[]).length;
      const listCache=POSTS.find(x=>x.id===id); if(listCache){ listCache.likes=p.likes; listCache.liked=p.liked; }
      document.title=(p.title||"Post")+" · Cyvathon";
      const n=esc(p.username||"?");
      const more=POSTS.filter(x=>x.id!==id).slice(0,8);
      document.getElementById("stage").innerHTML=`
        <button class="aback" onclick="goFeed()"><i class="fas fa-arrow-left"></i> Back to feed</button>
        <div class="readwrap">
          <div class="card article">
            <div class="phead">
              <a class="av" href="/profile?user=${enc(p.username)}" ${avatarStyle(p.avatar)}>${p.avatar?'':n[0].toUpperCase()}</a>
              <div class="pwho">
                <div class="nm"><a href="/profile?user=${enc(p.username)}">${n}</a></div>
                <div class="role">${esc(p.designation||"Citizen")}</div>
                <div class="dt">${ago(p.created_at)} · ${fdate(p.created_at)}</div>
              </div>
            </div>
            <h1 class="atitle">${esc(p.title)}</h1>
            <div class="abody">${esc(p.body||"")}</div>
            <div class="pcounts" id="pc${p.id}">${socialLine(p)}</div>
            ${actionBar(p)}
            <div class="comments on" id="cm${p.id}" style="margin-top:1.2rem"></div>
          </div>
          <div class="rail r-side">
            <div class="card rc"><h4>📰 More from the Republic</h4>
              ${more.length?more.map(m=>`<a class="voice" href="/blogs?b=${m.id}" onclick="event.preventDefault();openPost(${m.id})">
                <div class="av" ${avatarStyle(m.avatar)}>${m.avatar?'':esc((m.username||'?')[0].toUpperCase())}</div>
                <div><div class="vn">${esc(m.title)}</div><div class="vs">${esc(m.username)} · ${ago(m.created_at)}</div></div></a>`).join(""):`<div class="vs" style="color:var(--muted)">Nothing else yet.</div>`}
            </div>
          </div>
        </div>`;
      renderComments(id, d.comments||[]);
      window.scrollTo({top:0,behavior:"instant"});
    }

    /* ---------- routing ---------- */
    function curB(){ return new URLSearchParams(location.search).get("b"); }
    function route(){ const b=curB(); if(b && /^\d+$/.test(b)) renderArticle(+b); else renderFeed(); }
    function openPost(id){ history.pushState({},"", "/blogs?b="+id); renderArticle(id); }
    function goFeed(){ history.pushState({},"", "/blogs"); renderFeed(); window.scrollTo({top:0,behavior:"instant"}); }
    window.addEventListener("popstate", route);

    async function load(){
      document.getElementById("stage").innerHTML=`<p class="empty">Fetching the latest posts…</p>`;
      try{ const d=await api("/blogs_list"); ME=d.me; POSTS=d.posts||[]; route(); }
      catch(e){ document.getElementById("stage").innerHTML=`<p class="empty">${esc(e.message)}</p>`; }
    }

    /* ---------- composer ---------- */
    function openWriter(){ const w=document.getElementById("writer"); if(w){ w.classList.add("on"); document.getElementById("bTitle").focus(); } }
    function closeWriter(){ const w=document.getElementById("writer"); if(w){ w.classList.remove("on"); document.getElementById("bMsg").textContent=""; } }
    async function publish(){
      const title=document.getElementById("bTitle").value.trim();
      const body=document.getElementById("bBody").value.trim();
      const msg=document.getElementById("bMsg");
      if(!title||!body){ msg.style.color="var(--red)"; msg.textContent="Add a headline and some text."; return; }
      document.getElementById("bPub").disabled=true;
      try{
        await api("/blogs",{method:"POST",body:JSON.stringify({title,body})});
        await refresh(); goFeed();
      }catch(e){ msg.style.color="var(--red)"; msg.textContent=e.message; document.getElementById("bPub").disabled=false; }
    }
    async function refresh(){ try{ const d=await api("/blogs_list"); POSTS=d.posts||[]; }catch{} }

    /* ---------- like / share / comment ---------- */
    async function like(id){
      try{
        const d=await api("/blog/"+id+"/like",{method:"POST",body:"{}"});
        const btn=document.getElementById("lk"+id);
        if(btn){ btn.classList.toggle("liked", d.liked); btn.querySelector("i").className=(d.liked?"fas":"far")+" fa-heart"; }
        const p=POSTS.find(x=>x.id===id); if(p){ p.likes=d.likes; p.liked=d.liked; }
        refreshCounts(id, {likes:d.likes});
      }catch(e){ alert(e.message); }
    }
    function refreshCounts(id, over){
      const p=POSTS.find(x=>x.id===id)||{}; if(over) Object.assign(p, over);
      const el=document.getElementById("pc"+id); if(el) el.innerHTML=socialLine(p);
    }
    async function share(id){
      const url=location.origin+"/blogs?b="+id;
      const btn=document.getElementById("sh"+id);
      try{ if(navigator.share){ await navigator.share({title:"A Cyvathon blog", url}); }
        else { await navigator.clipboard.writeText(url); if(btn){ const o=btn.innerHTML; btn.innerHTML='<i class="fas fa-check"></i> Copied!'; setTimeout(()=>btn.innerHTML=o,1500); } } }catch{}
      try{ const d=await api("/blog/"+id+"/share",{method:"POST",body:"{}"});
        if(d.shares!=null){ const p=POSTS.find(x=>x.id===id); if(p) p.shares=d.shares; refreshCounts(id,{shares:d.shares}); } }catch{}
    }
    function commentAction(id){
      if(curB()){ const inp=document.getElementById("ci"+id); if(inp) inp.focus(); return; }
      toggleC(id);
    }
    async function toggleC(id){
      const box=document.getElementById("cm"+id);
      if(box.classList.contains("on")){ box.classList.remove("on"); return; }
      box.classList.add("on"); box.innerHTML=`<p class="small muted">Loading comments…</p>`;
      try{ const d=await api("/blog/"+id); renderComments(id, d.comments||[]); }
      catch(e){ box.innerHTML=`<p class="small muted">${esc(e.message)}</p>`; }
    }
    function renderComments(id, list){
      const box=document.getElementById("cm"+id); if(!box) return;
      const u=MEUSER||{}; const mn=esc(u.username||"?");
      const items=list.map(c=>{ const n=esc(c.username||"?");
        return `<div class="cmt"><div class="av" ${avatarStyle(c.avatar)}>${c.avatar?'':n[0].toUpperCase()}</div>
          <div class="cb"><div class="cn"><a href="/profile?user=${enc(c.username)}">${n}</a><span class="cd">${ago(c.created_at)}</span></div>
          <div class="ct">${esc(c.body)}</div></div></div>`;
      }).join("") || `<p class="small muted" style="margin:0">No comments yet — start the conversation.</p>`;
      box.innerHTML = `<div class="cbox"><div class="av" ${avatarStyle(u.avatar)}>${u.avatar?'':mn[0].toUpperCase()}</div>
        <input id="ci${id}" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')sendC(${id})">
        <button onclick="sendC(${id})">Comment</button></div>` + items;
      const p=POSTS.find(x=>x.id===id); if(p){ p.comments=list.length; refreshCounts(id); }
    }
    async function sendC(id){
      const inp=document.getElementById("ci"+id); const body=inp.value.trim(); if(!body) return;
      inp.disabled=true;
      try{ await api("/blog/"+id+"/comment",{method:"POST",body:JSON.stringify({body})});
        const d=await api("/blog/"+id); renderComments(id, d.comments||[]); inp.value="";
      }catch(e){ alert(e.message); } finally{ inp.disabled=false; inp.focus(); }
    }

    document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeWriter(); });

    (async function(){
      const user=await requireAuth(); if(!user) return;
      ME=user.username; MEUSER=user; renderNav("/blogs", user);
      load();
    })();
  </script>
</body>
