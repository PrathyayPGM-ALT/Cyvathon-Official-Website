<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Registry · Cyvathon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    /* ---- paper reading-room, committed light regardless of site theme ---- */
    body{ background:#e4dbc2;
      background-image:
        radial-gradient(ellipse 120% 80% at 50% -10%, rgba(255,255,255,.35), transparent 60%),
        repeating-linear-gradient(0deg, rgba(90,74,40,.035) 0 1px, transparent 1px 4px); }

    :root{ --pp-sheet:#f4efdf; --pp-sheet2:#ebe2c9; --pp-ink:#26221a; --pp-mut:#726a54; --pp-line:#c2b591; --pp-tab:#d7cba8;
      --slab:'Rockwell','Roboto Slab',Georgia,'Times New Roman',serif; --type:'Courier New',ui-monospace,monospace; }
    .reg{ max-width:980px; margin:2.4rem auto 4rem; color:var(--pp-ink); font-family:var(--type); font-size:15px; line-height:1.6; }
    .reg *{ box-sizing:border-box; }

    /* letterhead */
    .rhead{ display:flex; align-items:flex-start; gap:1.4rem; padding:0 .3rem 1.7rem; }
    .seal{ width:62px; height:62px; border-radius:50%; border:2px solid var(--pp-ink); display:flex; align-items:center; justify-content:center; font-size:1.85rem; flex-shrink:0; background:var(--pp-sheet); }
    .rht{ flex:1; min-width:0; }
    .rkick{ font-size:.68rem; letter-spacing:4px; text-transform:uppercase; color:var(--pp-mut); }
    .rtitle{ font-family:var(--slab); font-size:2.4rem; font-weight:800; letter-spacing:4px; line-height:1.05; margin:.35rem 0 .4rem; }
    .rsub{ font-size:.82rem; color:var(--pp-mut); letter-spacing:.4px; }
    .rsub .rd{ display:inline-block; height:.85em; width:3.2em; background:var(--pp-ink); border-radius:1px; vertical-align:baseline; }
    .clearbox{ border:1px solid var(--pp-ink); padding:.4rem .7rem; text-align:center; flex-shrink:0; }
    .clearbox b{ display:block; font-size:.9rem; letter-spacing:1px; } .clearbox span{ font-size:.56rem; letter-spacing:1.5px; color:var(--pp-mut); text-transform:uppercase; }

    /* folder tabs */
    .tabs{ display:flex; align-items:flex-end; gap:.4rem; border-bottom:2px solid var(--pp-ink); padding:0 .2rem; flex-wrap:wrap; }
    .tab{ font-family:var(--type); font-size:.76rem; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; color:var(--pp-mut);
      background:var(--pp-tab); border:1px solid var(--pp-line); border-bottom:none; border-radius:7px 7px 0 0; padding:.65rem 1.15rem; margin:0; cursor:pointer;
      box-shadow:none; transform:translateY(1px); width:auto; }
    .tab:hover{ color:var(--pp-ink); transform:translateY(1px); }
    .tab.on{ background:var(--pp-sheet); color:var(--pp-ink); border-color:var(--pp-ink); border-bottom:2px solid var(--pp-sheet); position:relative; z-index:1; }
    .tab.right{ margin-left:auto; background:none; border:1px solid var(--pp-ink); border-radius:3px; transform:none; cursor:default; color:var(--pp-ink); }

    /* the sheet */
    .sheet{ background:var(--pp-sheet); border:1px solid var(--pp-line); border-top:none; padding:2.6rem 3rem 3rem;
      box-shadow:0 16px 34px rgba(60,48,20,.16); min-height:380px; }
    .ptitle{ font-family:var(--slab); font-size:2.15rem; font-weight:800; letter-spacing:.5px; margin:0; line-height:1.15; }
    .psub{ color:var(--pp-mut); font-size:.9rem; margin:.5rem 0 0; line-height:1.5; }
    .prule{ border:none; border-top:1px solid var(--pp-ink); margin:1.3rem 0 2rem; }
    .phead-row{ display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .empty{ text-align:center; color:var(--pp-mut); padding:3rem 1rem; font-style:italic; }

    /* rubber stamp (classification / priority) */
    .stamp{ display:inline-block; font-family:var(--type); font-size:.6rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
      color:var(--cc,#26221a); border:2px solid var(--cc,#26221a); padding:.12rem .45rem; border-radius:2px; transform:rotate(-1.5deg); white-space:nowrap; }
    .stamp.big{ font-size:.82rem; letter-spacing:2.5px; padding:.25rem .8rem; }

    /* memorandum */
    .memo{ font-size:.95rem; line-height:1.9; }
    .memo .mh{ font-family:var(--slab); font-weight:800; letter-spacing:3px; font-size:.95rem; margin-bottom:.7rem; }
    .memo .mrow{ color:var(--pp-mut); } .memo .mrow b{ color:var(--pp-ink); }
    .memo .mbody{ margin-top:1rem; text-align:justify; }
    .flag{ border:1px dashed #b3261e; color:#8f1d17; background:rgba(179,38,30,.05); padding:.8rem 1rem; margin-top:1.4rem; font-size:.88rem; }

    /* dossier rows */
    .filt{ display:flex; gap:.45rem; flex-wrap:wrap; margin-bottom:1.5rem; }
    .fchip{ font-family:var(--type); font-size:.72rem; letter-spacing:.5px; text-transform:uppercase; padding:.4rem .8rem; border:1px solid var(--pp-line); background:var(--pp-sheet2); color:var(--pp-mut); cursor:pointer; border-radius:2px; }
    .fchip.on{ border-color:var(--pp-ink); color:var(--pp-ink); background:var(--pp-sheet); font-weight:700; }
    .dfile{ display:flex; align-items:center; gap:1.3rem; background:var(--pp-sheet2); border:1px solid var(--pp-line); border-left:5px solid var(--cc,#8a7d55);
      padding:1.15rem 1.4rem; margin-bottom:1rem; cursor:pointer; transition:.14s; position:relative; }
    .dfile:hover{ transform:translateX(3px); box-shadow:-3px 4px 12px rgba(60,48,20,.14); }
    .dfile .idx{ font-family:var(--type); font-size:.74rem; color:var(--pp-mut); flex-shrink:0; }
    .dfile .fmid{ flex:1; min-width:0; }
    .dfile .ft{ font-family:var(--slab); font-weight:700; font-size:1.14rem; letter-spacing:.3px; line-height:1.3; }
    .dfile .fmeta{ font-size:.72rem; color:var(--pp-mut); text-transform:uppercase; letter-spacing:.5px; margin-top:.35rem; }

    /* bulletin item */
    .bitem{ padding:1.6rem 0 1.7rem; border-bottom:1px dashed var(--pp-line); }
    .bitem:first-child{ padding-top:.3rem; }
    .bitem:last-child{ border-bottom:none; }
    .bhead{ display:flex; align-items:center; gap:1rem; }
    .bhead h4{ font-family:var(--slab); font-size:1.2rem; font-weight:700; margin:0; }
    .bbody{ margin-top:.8rem; line-height:1.9; text-align:justify; font-size:.93rem; white-space:pre-wrap; }
    .bmeta{ font-size:.7rem; color:var(--pp-mut); text-transform:uppercase; letter-spacing:.6px; margin-top:.8rem; }

    /* directorates */
    .drow{ display:flex; align-items:center; gap:1.2rem; padding:1.15rem 0; border-bottom:1px dashed var(--pp-line); cursor:pointer; }
    .drow:last-child{ border-bottom:none; } .drow:hover .dname{ text-decoration:underline; }
    .dseal{ width:30px; text-align:center; font-size:1.15rem; } .dname{ font-family:var(--slab); font-weight:700; font-size:1.12rem; flex:1; }
    .dcount{ font-family:var(--type); font-size:.8rem; color:var(--pp-mut); }

    /* officers / requests */
    .orow{ display:flex; align-items:center; gap:1rem; padding:.9rem 0; border-bottom:1px dashed var(--pp-line); }
    .orow:last-child{ border-bottom:none; }
    .oav{ width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--pp-sheet); background:var(--pp-ink); font-family:var(--slab); }
    .ogr{ font-family:var(--type); font-size:.6rem; font-weight:700; letter-spacing:1px; border:1px solid var(--pp-ink); padding:.05rem .4rem; border-radius:2px; }
    .grantbox{ border:1px solid var(--pp-line); background:var(--pp-sheet2); padding:.9rem; margin-bottom:1.1rem; }
    .btn{ font-family:var(--type); text-transform:uppercase; letter-spacing:1px; font-size:.74rem; font-weight:700; background:var(--pp-ink); color:var(--pp-sheet);
      border:1px solid var(--pp-ink); padding:.5rem .9rem; border-radius:2px; cursor:pointer; width:auto; margin:0; box-shadow:none; }
    .btn:hover{ transform:none; opacity:.88; }
    .btn.ghost{ background:none; color:var(--pp-ink); } .btn.danger{ background:none; color:#8f1d17; border-color:#8f1d17; }
    .btn.sm{ padding:.35rem .7rem; font-size:.68rem; }
    .reg input, .reg textarea, .reg select{ font-family:var(--type); background:#fbf8ef; border:1px solid var(--pp-line); color:var(--pp-ink); border-radius:2px; }
    .reg input:focus, .reg textarea:focus, .reg select:focus{ border-color:var(--pp-ink); outline:none; }
    .lbl{ font-family:var(--type); font-size:.66rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--pp-mut); font-weight:700; margin:.7rem 0 .3rem; }

    /* modal */
    .modal-bg{ position:fixed; inset:0; background:rgba(22,16,6,.72); backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:center; z-index:250; padding:3.2rem 1rem 3.5rem; overflow-y:auto; }
    .modal-bg.on{ display:flex; }
    .modal{ position:relative; background:var(--pp-sheet); color:var(--pp-ink); font-family:var(--type); border:1px solid var(--pp-ink); width:100%; max-width:640px; box-shadow:0 30px 70px rgba(20,14,4,.5); }
    .cband{ text-align:center; font-family:var(--type); font-weight:700; letter-spacing:4px; padding:.5rem; color:#fff; background:var(--cc,#26221a); font-size:.85rem; }
    .mpad{ padding:1.9rem 2.2rem 2.1rem; position:relative; }

    /* ---- the dossier reader is a physical file lying on the desk ---- */
    #fileBox{ background:none; border:none; box-shadow:none; max-width:664px; }
    .folder{ position:relative; margin-top:18px; }
    .folder::before, .folder::after{ content:""; position:absolute; inset:0; background:#ece2c8; border:1px solid #cbbf9c; border-radius:3px; z-index:-1; box-shadow:0 14px 30px rgba(15,10,2,.35); }
    .folder::before{ transform:rotate(-1.5deg) translateY(6px); }
    .folder::after{ transform:rotate(1.2deg) translateY(3px); background:#e6dbbf; }
    .paper{ position:relative; background:#f8f3e5; border:1px solid #cbbf9c; border-radius:3px; padding:2.5rem 2.5rem 2.1rem;
      box-shadow:0 26px 58px rgba(12,8,2,.5);
      background-image:
        radial-gradient(135% 75% at 50% 0%, rgba(255,255,255,.6), transparent 55%),
        repeating-linear-gradient(0deg, rgba(120,100,50,.03) 0 1px, transparent 1px 5px); }
    .clip{ position:absolute; top:-20px; left:52px; width:32px; height:86px; z-index:5; filter:drop-shadow(0 3px 3px rgba(0,0,0,.4)); }
    .ftab{ position:absolute; top:-17px; right:40px; z-index:4; font-family:var(--type); font-weight:700; letter-spacing:2.5px; font-size:.72rem;
      color:#fff; background:var(--cc,#26221a); padding:.6rem 1.05rem .5rem; border-radius:6px 6px 0 0; box-shadow:0 -3px 8px rgba(0,0,0,.16); }
    .rubber{ font-family:var(--slab); font-weight:800; letter-spacing:2.5px; font-size:1rem; color:var(--cc,#b3261e); background:rgba(255,255,255,.15);
      border:3px double var(--cc,#b3261e); padding:.22rem .65rem; border-radius:4px; transform:rotate(-9deg); display:inline-block; opacity:.82; white-space:nowrap; }
    .filed{ display:flex; justify-content:space-between; align-items:center; gap:1.2rem; flex-wrap:wrap; }
    .mx{ position:absolute; cursor:pointer; font-size:1.75rem; line-height:1; z-index:6; }
    #fileBox .mx{ top:-42px; right:0; color:#efe7d2; }
    #editBox .mx{ top:.7rem; right:1rem; color:var(--pp-mut); }
    .watermark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; overflow:hidden; }
    .watermark span{ font-family:var(--slab); font-weight:800; font-size:3.7rem; letter-spacing:8px; color:var(--cc,#26221a); opacity:.055; transform:rotate(-16deg); white-space:nowrap; }
    .dbody{ white-space:pre-wrap; line-height:1.95; text-align:justify; margin-top:1.4rem; font-size:.95rem; position:relative; z-index:1; }
    .seg{ display:flex; gap:.35rem; flex-wrap:wrap; }
    .seg button{ flex:1; min-width:90px; font-family:var(--type); text-transform:uppercase; letter-spacing:.8px; font-size:.7rem; font-weight:700; margin:0; padding:.5rem; background:var(--pp-sheet2); color:var(--pp-mut); border:1px solid var(--pp-line); box-shadow:none; border-radius:2px; }
    .seg button.on{ background:var(--pp-ink); color:var(--pp-sheet); border-color:var(--pp-ink); }
    .picker{ max-height:170px; overflow-y:auto; border:1px solid var(--pp-line); background:#fbf8ef; padding:.3rem; }
    .prow{ display:flex; align-items:center; gap:.6rem; padding:.35rem .5rem; cursor:pointer; }
    .prow:hover{ background:var(--pp-sheet2); } .prow.sel{ background:var(--pp-tab); }
    .avm{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; color:var(--pp-sheet); background:var(--pp-ink); }
    .small{ font-size:.78rem; }
    @media(max-width:620px){ .rtitle{ font-size:1.6rem; } .sheet{ padding:1.1rem 1rem 1.5rem; } }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap">
    <div class="reg" id="reg"><p class="empty">Accessing the Registry…</p></div>
  </div>

  <div class="modal-bg" id="fileModal" onclick="if(event.target===this)closeFile()"><div class="modal" id="fileBox"></div></div>
  <div class="modal-bg" id="editModal" onclick="if(event.target===this)closeEdit()"><div class="modal" id="editBox"></div></div>

  <script src="/static/app.js"></script>
  <script>
    let ME=null, D=null, CITIZENS=[], filterDir="all", section="desk";
    const esc=(s)=>(s||"").replace(/</g,"&lt;");
    const enc=encodeURIComponent;
    // classification ink colours, tuned for parchment
    const CLASS_COLOR={ "UNCLASSIFIED":"#2e7d4f","RESTRICTED":"#2f6fb0","CONFIDENTIAL":"#a9791a","SECRET":"#c25a00","EYES ONLY":"#b3261e" };
    const cc=(c)=>CLASS_COLOR[c]||"#8a7d55";

    async function boot(){
      const user=await requireAuth(); if(!user) return;
      ME=user.username; renderNav("/registry", user);
      try{ CITIZENS=(await api("/citizens/list")).citizens||[]; }catch{}
      await load();
    }
    async function load(){
      try{ D=await api("/registry/data"); ME=D.me; render(); }
      catch(e){ document.getElementById("reg").innerHTML=`<p class="empty">${esc(e.message)}</p>`; }
    }

    function render(){
      const grade=D.grade||null;
      const tabs=[["desk","Front Desk"],["files","Dossiers"],["bulletins","Bulletins"],["directorates","Directorates"]];
      if(D.can_manage) tabs.push(["officers","Officers"]);
      if(!D.is_officer && !D.is_president) tabs.push(["recruit","Recruitment"]);

      document.getElementById("reg").innerHTML=`
        <div class="rhead">
          <div class="seal">🦉</div>
          <div class="rht">
            <div class="rkick">Republic of Cyvathon · Reading Room</div>
            <div class="rtitle">THE&nbsp;REGISTRY</div>
            <div class="rsub">Athena, Office of Records — the archive of the Republic <span class="rd"></span></div>
          </div>
          <div class="clearbox"><b>${grade?esc(grade):'UNCLEARED'}</b><span>${grade?'Your clearance':'Visitor'}</span></div>
        </div>
        <div class="tabs">
          ${tabs.map(([k,t])=>`<button class="tab ${k===section?'on':''}" data-k="${k}" onclick="go('${k}')">${t}</button>`).join("")}
          <span class="tab right">🦉 ${esc(ME)}</span>
        </div>
        <div class="sheet" id="page"></div>`;
      go(section);
    }

    const HEAD={
      desk:["The Front Desk","What the Republic keeps — and what your clearance lets you read."],
      files:["The Dossiers","Files circulated to your clearance and below."],
      bulletins:["The Bulletin Board","Wire traffic circulated to your grade. Read newest first; act oldest first."],
      directorates:["The Directorates","The offices of the Registry and the files they hold."],
      officers:["Cleared Officers","Those sworn to the Registry."],
      recruit:["Recruitment","Petition the Office of Records for clearance."],
    };
    function go(s){ section=s;
      document.querySelectorAll(".tab[data-k]").forEach(b=>b.classList.toggle("on", b.dataset.k===s));
      const [t,sub]=HEAD[s]||["",""];
      const manage=D.can_manage, tools = s==="files"&&manage?`<button class="btn sm" onclick="openEdit('file')">+ New file</button>`
                 : s==="bulletins"&&manage?`<button class="btn sm" onclick="openEdit('bulletin')">+ New bulletin</button>`:"";
      const body={ desk:viewDesk, files:viewFiles, bulletins:viewBulletins, directorates:viewDirectorates, officers:viewOfficers, recruit:viewRecruit }[s]();
      document.getElementById("page").innerHTML=`
        <div class="phead-row"><div><h2 class="ptitle">${t}</h2><p class="psub">${sub}</p></div>${tools}</div>
        <hr class="prule">${body}`;
    }

    function viewDesk(){
      const g=D.grade||"UNCLEARED"; const latest=D.bulletins.slice(0,3);
      return `<div class="memo">
        <div class="mh">MEMORANDUM</div>
        <div class="mrow">FROM: &nbsp;<b>Office of Records · Directorate Athena</b></div>
        <div class="mrow">TO: &nbsp;&nbsp;&nbsp;<b>${esc(ME)}</b> — clearance <b>${esc(g)}</b></div>
        <div class="mrow">RE: &nbsp;&nbsp;&nbsp;Terms of access</div>
        <div class="mbody">The Cyvathon Registry is the archive of the Athena intelligence directorate — dossiers on citizens, foreign powers, and the affairs of state. This reading room shows only what your clearance permits. Everything else remains sealed, and the fact of its sealing is itself a matter of record.</div>
        ${D.hidden>0?`<div class="flag">⛔ ${D.hidden} file${D.hidden===1?'':'s'} on the Registry ${D.hidden===1?'is':'are'} classified above your clearance and withheld from this desk.</div>`:''}
      </div>
      <h3 class="ptitle" style="font-size:1.25rem;margin:1.8rem 0 .2rem;">Latest bulletins</h3><hr class="prule" style="margin:.6rem 0 1rem;">
      ${latest.length?latest.map(bul).join(""):`<p class="empty">No bulletins at your grade.</p>`}`;
    }

    function viewFiles(){
      const dirs=["all",...D.directorates];
      const list=D.files.filter(f=>filterDir==="all"||f.directorate===filterDir);
      return `<div class="filt">${dirs.map(dr=>`<span class="fchip ${dr===filterDir?'on':''}" onclick="setDir('${enc(dr)}')">${dr==='all'?'All directorates':esc(dr)}</span>`).join("")}</div>
        ${list.length?list.map((f,i)=>fileRow(f,i)).join(""):`<p class="empty">No files here you're cleared to read.</p>`}`;
    }
    function fileRow(f,i){
      return `<div class="dfile" style="--cc:${cc(f.classification)}" onclick="openFile(${f.id})">
        <span class="idx">№ ${String(f.id).padStart(3,'0')}</span>
        <div class="fmid"><div class="ft">${esc(f.title)}</div>
          <div class="fmeta">${f.subject?'Subj: '+esc(f.subject)+' · ':''}${esc(f.directorate||'—')}</div></div>
        <span class="stamp">${esc(f.classification||'')}</span></div>`;
    }

    function viewBulletins(){
      return D.bulletins.length?D.bulletins.map(bul).join(""):`<p class="empty">No bulletins at your grade.</p>`;
    }
    function bul(b){
      const pri=b.priority||'ROUTINE'; const col=pri==='IMMEDIATE'?'#b3261e':'#26221a';
      return `<div class="bitem"><div class="bhead"><span class="stamp" style="--cc:${col}">${esc(pri)}</span><h4>${esc(b.title)}</h4></div>
        <div class="bbody">${renderRich(b.body||'')}</div>
        <div class="bmeta">${b.created_at?new Date(b.created_at).toLocaleString():''} · filed by ${esc(b.author||'Registry')}</div></div>`;
    }

    function viewDirectorates(){
      return D.directorates.map(dr=>{
        const n=D.files.filter(f=>f.directorate===dr).length;
        return `<div class="drow" onclick="filterDir='${enc(dr)}';setDir('${enc(dr)}')">
          <div class="dseal">🗂️</div><div class="dname">${esc(dr)}</div>
          <div class="dcount">${n} file${n===1?'':'s'} on your desk</div></div>`;
      }).join("") + `<p class="psub" style="margin-top:1rem;">Counts reflect only files at or below your clearance.</p>`;
    }

    function viewOfficers(){
      const canP=D.is_president;
      return `${canP?`<div class="grantbox"><div class="lbl">Grant clearance</div>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;">
          <input id="ofUser" placeholder="Citizen username" style="flex:1;min-width:140px;margin:0;">
          <select id="ofGrade" style="width:auto;margin:0;">${D.grades.map(g=>`<option>${g}</option>`).join("")}</select>
          <input id="ofRole" placeholder="Role (e.g. Analyst)" style="width:auto;margin:0;">
          <button class="btn" onclick="grantOfficer()">Swear in</button></div></div>`:''}
        ${D.officers.length?D.officers.map(o=>`<div class="orow">
          <div class="oav">${esc((o.username||'?')[0].toUpperCase())}</div>
          <div style="flex:1"><b>${esc(o.username)}</b> <span class="ogr">${esc(o.grade||'')}</span>
            <div style="font-size:.74rem;color:var(--pp-mut)">${esc(o.role||'Officer')}</div></div>
          ${canP&&o.username!==ME?`<button class="btn danger sm" onclick="revokeOfficer('${enc(o.username)}')">Revoke</button>`:''}
        </div>`).join(""):`<p class="empty">No officers sworn yet.</p>`}
        ${canP&&D.requests.length?`<h3 class="ptitle" style="font-size:1.2rem;margin:1.6rem 0 .2rem;">Clearance petitions</h3><hr class="prule" style="margin:.6rem 0 1rem;">
          ${D.requests.map(r=>`<div class="orow"><div class="oav">${esc((r.username||'?')[0].toUpperCase())}</div>
            <div style="flex:1"><b>${esc(r.username)}</b><div style="font-size:.74rem;color:var(--pp-mut)">${esc(r.note||'(no note)')}</div></div>
            <button class="btn sm" onclick="grantOfficer('${enc(r.username)}')">Approve</button>
            <button class="btn danger sm" onclick="denyReq('${enc(r.username)}')">Deny</button></div>`).join("")}`:''}`;
    }

    function viewRecruit(){
      const st=D.my_request;
      return `<div class="memo"><div class="mbody">The Registry admits sworn officers only. Petition the Office of Records and the President will review your file. Cleared officers may read classified dossiers and file their own.</div></div>
        ${st==='pending'?`<div class="flag" style="border-color:#a9791a;color:#7a5810;background:rgba(169,121,26,.06)">⏳ Your petition is under review.</div>`
          :st==='denied'?`<p class="psub" style="margin:1rem 0 .6rem;">A previous petition was declined. You may petition again.</p><button class="btn" onclick="apply()">Petition again</button>`
          :`<div class="lbl">Statement (optional)</div><textarea id="applyNote" placeholder="Why should you be cleared?" maxlength="400" style="width:100%;min-height:84px;"></textarea>
            <div style="margin-top:.7rem;"><button class="btn" onclick="apply()">Submit petition</button></div>`}
        <p id="applyMsg" class="small" style="min-height:1em;margin-top:.6rem;"></p>`;
    }

    function setDir(d){ filterDir=decodeURIComponent(d); go("files"); }

    /* ---- dossier reader (a physical file on the desk) ---- */
    const CLIP_SVG=`<svg class="clip" viewBox="0 0 40 96" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#d3d8dd"/><stop offset=".5" stop-color="#9aa0a8"/><stop offset="1" stop-color="#767c85"/></linearGradient></defs>
      <path d="M8 17 V70 a12 12 0 0 0 24 0 V25 a8 8 0 0 0 -16 0 V64" fill="none" stroke="url(#cg)" stroke-width="4.5" stroke-linecap="round"/></svg>`;
    async function openFile(id){
      try{
        const d=await api("/registry/file/"+id); const f=d.file; const col=cc(f.classification); const manage=d.can_manage;
        const cls=esc(f.classification||'CLASSIFIED'); const num=String(f.id).padStart(3,'0');
        const filed=`Filed by ${esc(f.author||'Registry')} · ${f.created_at?new Date(f.created_at).toLocaleString():''}${manage?` · circulation: ${esc(f.visibility)}${f.allowed&&f.allowed.length?' ('+f.allowed.map(esc).join(', ')+')':''}`:''}`;
        document.getElementById("fileBox").innerHTML=`
          <span class="mx" onclick="closeFile()" title="Close">&times;</span>
          <div class="folder" style="--cc:${col}">
            ${CLIP_SVG}
            <div class="ftab">${cls}</div>
            <div class="paper">
              <div class="watermark"><span>${cls}</span></div>
              <div class="lbl" style="margin:0">Dossier № ${num} · ${esc(f.directorate||'')}</div>
              <h2 class="ptitle" style="margin:.3rem 0 .45rem;position:relative;z-index:1;">${esc(f.title)}</h2>
              ${f.subject?`<div style="position:relative;z-index:1;"><b>Subject:</b> ${esc(f.subject)}</div>`:''}
              <div class="dbody">${renderRich(f.body||'')}</div>
              <hr class="prule" style="margin:1.7rem 0 1.1rem;">
              <div class="filed">
                <div class="lbl" style="margin:0;flex:1;min-width:180px;">${filed}</div>
                <span class="rubber">${cls}</span>
              </div>
              ${manage&&(f.author===ME||D.is_president)?`<div style="margin-top:1.3rem;"><button class="btn danger" onclick="delFile(${f.id})">Destroy file</button></div>`:''}
            </div>
          </div>`;
        document.getElementById("fileModal").classList.add("on");
      }catch(e){ alert(e.message); }
    }
    function closeFile(){ document.getElementById("fileModal").classList.remove("on"); }
    async function delFile(id){ if(!confirm("Destroy this file permanently?")) return;
      try{ await api("/registry/file/"+id+"/delete",{method:"POST",body:"{}"}); closeFile(); load(); }catch(e){ alert(e.message); } }

    /* ---- create ---- */
    let SEL=new Set(), EKIND="file";
    function openEdit(kind){ EKIND=kind; SEL=new Set(); window._pr="ROUTINE"; window._vis="cleared";
      const box=document.getElementById("editBox"); box.style.setProperty("--cc","#26221a");
      if(kind==="bulletin"){
        box.innerHTML=`<div class="cband">NEW BULLETIN</div><div class="mpad"><span class="mx" onclick="closeEdit()">&times;</span>
          <div class="lbl">Priority</div><div class="seg" id="segPr"><button class="on" data-v="ROUTINE" onclick="segp(this)">Routine</button><button data-v="IMMEDIATE" onclick="segp(this)">Immediate</button></div>
          <div class="lbl">Circulate to</div><div class="seg" id="segVis"><button class="on" data-v="cleared" onclick="segv(this)">Cleared officers</button><button data-v="public" onclick="segv(this)">All citizens</button></div>
          <div class="lbl">Headline</div><input id="eTitle" maxlength="160" style="width:100%">
          <div class="lbl">Wire text</div><textarea id="eBody" maxlength="6000" style="width:100%;min-height:120px"></textarea>
          <div style="margin-top:.9rem;"><button class="btn" onclick="submitEdit()" id="eBtn">Post bulletin</button></div>
          <p id="eMsg" class="small" style="min-height:1em;margin-top:.5rem;"></p></div>`;
      } else {
        box.innerHTML=`<div class="cband">NEW DOSSIER</div><div class="mpad"><span class="mx" onclick="closeEdit()">&times;</span>
          <div class="lbl">Title</div><input id="eTitle" maxlength="160" placeholder="e.g. Assessment: Aquilithia" style="width:100%">
          <div class="lbl">Subject</div><input id="eSubj" maxlength="120" placeholder="A citizen, a nation, a topic…" style="width:100%">
          <div style="display:flex;gap:.7rem;flex-wrap:wrap;">
            <div style="flex:1;min-width:150px"><div class="lbl">Directorate</div><select id="eDir" style="width:100%">${D.directorates.map(x=>`<option>${x}</option>`).join("")}</select></div>
            <div style="flex:1;min-width:150px"><div class="lbl">Classification</div><select id="eCls" style="width:100%">${D.classifications.map(x=>`<option ${x==='CONFIDENTIAL'?'selected':''}>${x}</option>`).join("")}</select></div>
          </div>
          <div class="lbl">Who may read it</div>
          <div class="seg" id="segVis"><button data-v="public" onclick="segv(this)">All citizens</button><button class="on" data-v="cleared" onclick="segv(this)">Cleared officers</button><button data-v="named" onclick="segv(this)">Named only</button></div>
          <div id="namedWrap" style="display:none;margin-top:.6rem;">
            <input id="pSearch" placeholder="Search citizens…" oninput="renderPicker()" style="width:100%;margin:0 0 .4rem;">
            <div class="picker" id="picker"></div></div>
          <div class="lbl">Contents</div><textarea id="eBody" maxlength="20000" style="width:100%;min-height:150px" placeholder="The dossier…"></textarea>
          <div style="margin-top:.9rem;"><button class="btn" onclick="submitEdit()" id="eBtn">File it</button></div>
          <p id="eMsg" class="small" style="min-height:1em;margin-top:.5rem;"></p></div>`;
      }
      document.getElementById("editModal").classList.add("on");
    }
    function closeEdit(){ document.getElementById("editModal").classList.remove("on"); }
    function segp(b){ document.querySelectorAll("#segPr button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); window._pr=b.dataset.v; }
    function segv(b){ document.querySelectorAll("#segVis button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); window._vis=b.dataset.v;
      const nw=document.getElementById("namedWrap"); if(nw) nw.style.display=b.dataset.v==="named"?"block":"none"; }
    function renderPicker(){ const q=(document.getElementById("pSearch").value||"").toLowerCase();
      document.getElementById("picker").innerHTML=CITIZENS.filter(c=>c.username!==ME&&c.username.toLowerCase().includes(q)).map(c=>
        `<div class="prow ${SEL.has(c.username)?'sel':''}" onclick="togP('${enc(c.username)}')"><div class="avm">${esc(c.username[0].toUpperCase())}</div>${esc(c.username)}</div>`).join(""); }
    function togP(u){ u=decodeURIComponent(u); SEL.has(u)?SEL.delete(u):SEL.add(u); renderPicker(); }

    async function submitEdit(){
      const msg=document.getElementById("eMsg"); const title=document.getElementById("eTitle").value.trim(); const body=document.getElementById("eBody").value.trim();
      if(!title||!body){ msg.style.color="#b3261e"; msg.textContent="Title and body are required."; return; }
      document.getElementById("eBtn").disabled=true;
      try{
        if(EKIND==="bulletin"){
          await api("/registry/bulletin",{method:"POST",body:JSON.stringify({title,body,priority:window._pr,visibility:window._vis})});
        } else {
          const payload={title,body,subject:document.getElementById("eSubj").value.trim(),directorate:document.getElementById("eDir").value,classification:document.getElementById("eCls").value,visibility:window._vis};
          if(window._vis==="named") payload.allowed=[...SEL];
          await api("/registry/file",{method:"POST",body:JSON.stringify(payload)});
        }
        closeEdit(); load();
      }catch(e){ msg.style.color="#b3261e"; msg.textContent=e.message; }
      finally{ const b=document.getElementById("eBtn"); if(b) b.disabled=false; }
    }

    /* ---- officers / recruitment ---- */
    async function grantOfficer(u){ const un=u?decodeURIComponent(u):document.getElementById("ofUser").value.trim();
      if(!un) return; const grade=u?"C-2":document.getElementById("ofGrade").value; const role=u?"Officer":(document.getElementById("ofRole").value.trim()||"Officer");
      try{ await api("/registry/officer",{method:"POST",body:JSON.stringify({username:un,grade,role,action:"grant"})}); load(); }catch(e){ alert(e.message); } }
    async function revokeOfficer(u){ if(!confirm("Revoke clearance?")) return;
      try{ await api("/registry/officer",{method:"POST",body:JSON.stringify({username:decodeURIComponent(u),action:"revoke"})}); load(); }catch(e){ alert(e.message); } }
    async function denyReq(u){ try{ await api("/registry/request/deny",{method:"POST",body:JSON.stringify({username:decodeURIComponent(u)})}); load(); }catch(e){ alert(e.message); } }
    async function apply(){ const note=(document.getElementById("applyNote")||{}).value||""; const msg=document.getElementById("applyMsg");
      try{ await api("/registry/apply",{method:"POST",body:JSON.stringify({note})}); msg.style.color="#2e7d4f"; msg.textContent="Petition submitted."; load(); }
      catch(e){ msg.style.color="#b3261e"; msg.textContent=e.message; } }

    document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeFile(); closeEdit(); } });
    boot();
  </script>
</body>
</html>
