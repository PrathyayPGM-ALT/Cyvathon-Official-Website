<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATHENA · Classified</title>
  <!-- social / SEO metadata -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="ATHENA — Cyvathon counter-intelligence. Classified." />
  <link rel="canonical" href="https://cyvathon.onrender.com/athena" />
  <meta name="theme-color" content="#58c4ff" />
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cyvathon" />
  <meta property="og:title" content="ATHENA · Classified" />
  <meta property="og:description" content="ATHENA — Cyvathon counter-intelligence. Classified." />
  <meta property="og:url" content="https://cyvathon.onrender.com/athena" />
  <meta property="og:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ATHENA · Classified" />
  <meta name="twitter:description" content="ATHENA — Cyvathon counter-intelligence. Classified." />
  <meta name="twitter:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    :root{ --amber:#ffce56; }
    .crest{ text-align:center; margin-bottom:.4rem; }
    .crest .owl{ font-size:3rem; }
    .classified{ display:inline-block; border:2px solid var(--red); color:var(--red);
      font-weight:800; letter-spacing:3px; padding:.2rem 1rem; border-radius:6px;
      transform:rotate(-3deg); font-size:.8rem; margin-bottom:1rem; }
    .agcy{ text-align:center; }
    .agcy h2{ letter-spacing:4px; background:linear-gradient(90deg,var(--amber),#fff0c0);
      -webkit-background-clip:text; background-clip:text; color:transparent; }
    .agent{ display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap;
      padding:.6rem .9rem; background:var(--panel); border:1px solid var(--panel-border);
      border-radius:10px; margin-bottom:.5rem; }
    .rank{ font-size:.7rem; padding:.18rem .6rem; border-radius:20px; background:rgba(255,206,86,.15); color:var(--amber); }
    .ag-av{ display:inline-flex; width:28px; height:28px; border-radius:50%; align-items:center; justify-content:center;
      font-weight:700; font-size:.78rem; color:#06223a; background:linear-gradient(135deg,var(--amber),#ffe08a);
      vertical-align:middle; margin-right:.45rem; }
    .case{ padding:1.1rem 1.3rem; margin-bottom:1.1rem; background:var(--panel);
      border:1px solid var(--panel-border); border-radius:14px; border-left:3px solid var(--amber); }
    .st{ font-size:.7rem; padding:.18rem .6rem; border-radius:20px; text-transform:uppercase; letter-spacing:.5px; }
    .st-filed{ background:rgba(148,162,180,.18); color:var(--muted); }
    .st-investigating{ background:rgba(255,206,86,.15); color:var(--amber); }
    .st-escalated{ background:rgba(88,196,255,.15); color:var(--accent); }
    .st-closed{ background:rgba(0,214,160,.15); color:var(--green); }
    .ev{ padding:.4rem .7rem; border-left:3px solid var(--accent); border-radius:0 7px 7px 0;
      background:var(--bg-soft); margin-bottom:.4rem; font-size:.84rem; }
    .note{ border-left-color:var(--red); }
    .ev .a{ font-size:.7rem; color:var(--muted); }
    .ops{ display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.7rem; }
    .ops input{ width:auto; flex:1; min-width:120px; margin:0; padding:.45rem .7rem; }
    .ops button{ width:auto; margin:0; padding:.45rem .9rem; font-size:.82rem; }
    .opgrid{ display:grid; gap:.8rem; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); margin-top:.6rem; }
    .opcard{ background:var(--bg-soft); border:1px solid var(--panel-border); border-radius:12px;
      padding:.9rem 1rem; display:flex; flex-direction:column; gap:.35rem; }
    .opcard b{ color:var(--amber); }
    .opcard .m{ font-size:.78rem; color:var(--accent); }
    .opcard button{ margin:.4rem 0 0; width:100%; padding:.45rem; font-size:.82rem; }
    .opcard button:disabled{ opacity:.4; cursor:not-allowed; filter:grayscale(1); }
    .threat{ background:var(--bg-soft); border-left:3px solid var(--red); border-radius:0 8px 8px 0;
      padding:.5rem .8rem; margin-bottom:.45rem; }
    .threat .p{ font-family:"Courier New",monospace; font-size:.8rem; color:var(--amber); word-break:break-all; }
    .starget{ background:var(--bg-soft); border:1px solid var(--panel-border); border-radius:12px; padding:1rem 1.2rem; }
    .shead{ display:flex; align-items:center; gap:.6rem; }
    .sb{ font-size:.72rem; font-weight:700; padding:.15rem .6rem; border-radius:20px; }
    .sb.up{ background:rgba(31,214,166,.15); color:var(--green); }
    .sb.down{ background:rgba(255,93,108,.15); color:var(--red); }
    .statgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem; margin:.7rem 0; }
    .statgrid .k{ font-size:.64rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
    .statgrid .v{ font-size:1.05rem; font-weight:700; color:var(--amber); }
    .techbadge{ display:inline-block; font-size:.72rem; padding:.15rem .6rem; border-radius:20px;
      background:var(--panel-2); border:1px solid var(--panel-border); margin:0 .3rem .3rem 0; }
    .rchip2{ display:inline-block; font-size:.76rem; font-family:"Courier New",monospace; padding:.15rem .55rem;
      border-radius:6px; background:var(--panel-2); margin:.15rem .2rem 0 0; color:var(--accent); }
    .spark{ display:flex; align-items:flex-end; gap:2px; height:44px; margin-top:.3rem; }
    .spark .bar{ flex:1; min-width:3px; background:var(--accent); border-radius:2px 2px 0 0; opacity:.8; }
    .spark .bar.d{ background:var(--red); opacity:.5; height:100%; }
    .deny{ text-align:center; padding:5rem 1rem; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="wrap" style="max-width:820px;"><div id="view"></div></div>

  <script src="/static/app.js"></script>
  <script>
    let ME=null, DIR=false, cdTimer=null;
    const AV={};
    const esc=(s)=>(s||"").replace(/</g,"&lt;");
    const ul=(n)=> !n ? '<span class="muted">unknown</span>' : `<a class="link" href="/profile?user=${encodeURIComponent(n)}">${esc(n)}</a>`;
    const avSeat=(n)=>`<span class="ag-av" ${avatarStyle(AV[n])}>${AV[n]?'':esc((n||'?')[0].toUpperCase())}</span>`;

    async function load(){
      let d;
      try{ d = await api("/athena/data"); }
      catch(e){
        document.getElementById("view").innerHTML = `<div class="deny">
          <div class="owl" style="font-size:3rem;">🦉</div>
          <h2 style="letter-spacing:3px;">CLASSIFIED</h2>
          <p class="muted">${esc(e.message)}</p>
          <a class="link" href="/">← Return to civilian life</a></div>`;
        return;
      }
      ME=d.me; DIR=d.is_director;

      let html=`<div class="agcy">
        <div class="crest"><span class="owl" style="font-size:3rem;">🦉</span></div>
        <span class="classified">TOP SECRET · CLEARANCE: ${esc(d.my_rank)}</span>
        <h2 class="section-title">ATHENA</h2>
        <p class="section-sub">Cyvathon Intelligence Agency · "We see what others cannot."</p>
      </div>`;

      // Roster
      html+=`<div class="panel" style="margin-bottom:1.6rem;"><h3><i class="fas fa-user-secret"></i> Agents (${d.roster.length})</h3>`;
      html+=d.roster.map(a=>`<div class="agent">
        <div>${avSeat(a.username)}${ul(a.username)} <span class="rank">${esc(a.rank)}</span></div>
        ${DIR?`<button class="danger" onclick="dismiss('${encodeURIComponent(a.username)}')">Dismiss</button>`:''}
      </div>`).join("");
      if(DIR){
        html+=`<div class="ops" style="margin-top:.8rem;">
          <input id="recU" placeholder="Recruit citizen…">
          <select id="recR" style="width:auto;flex:0 0 130px;margin:0;padding:.45rem">${d.ranks.map(r=>`<option>${r}</option>`).join("")}</select>
          <button onclick="recruit()">Recruit</button></div>
          <p id="recMsg" class="small"></p>`;
      }
      html+=`</div>`;

      // Field operations (espionage)
      html+=`<div class="panel" style="margin-bottom:1.6rem;">
        <h3><i class="fas fa-crosshairs"></i> Field Operations</h3>
        <p class="small">Run covert operations against foreign intelligence. Success is paid in <b>Cybits</b>; agents must lie low between operations. Higher rank = bigger payouts.</p>
        <p id="opMsg" class="small" style="min-height:1.1em;font-weight:600;"></p>
        <p id="opCd" class="small" style="color:var(--amber);"></p>
        <div class="opgrid">${(d.ops||[]).map(o=>`<div class="opcard">
          <b>${esc(o.name)}</b>
          <div class="small muted">${esc(o.desc)}</div>
          <div class="m">Payout ${o.min}–${o.max} CBT · ${Math.round(o.success*100)}% success</div>
          <button class="launchbtn" onclick="runOp('${o.key}')"><i class="fas fa-user-secret"></i> Launch</button>
        </div>`).join("")}</div>
      </div>`;

      // Foreign surveillance (public-site monitor)
      html+=`<div class="panel" style="margin-bottom:1.6rem;">
        <h3><i class="fas fa-satellite-dish"></i> Foreign Surveillance
          <button class="ghost" style="width:auto;margin:0 0 0 .5rem;padding:.28rem .8rem;font-size:.78rem;" onclick="pingSurveil()"><i class="fas fa-satellite"></i> Ping now</button></h3>
        <p class="small">Passive monitoring of rival nations' <b>public</b> sites — uptime, latency, tech stack, and changes. Auto-refreshes; version bumps &amp; new routes auto-file to the dossier.</p>
        <div id="surveilBox"><p class="small muted">Establishing uplink…</p></div>
      </div>`;

      // Foreign intrusion feed (counter-intelligence)
      html+=`<div class="panel" style="margin-bottom:1.6rem;">
        <h3><i class="fas fa-triangle-exclamation"></i> Foreign Intrusion Feed</h3>
        <p class="small">Firewall-flagged probes against Cyvathon — likely AIA reconnaissance.</p>
        ${(d.threats||[]).length ? d.threats.map(t=>`<div class="threat">
            <b>${esc(t.ip)}</b> <span class="small muted">· ${t.ago}s ago</span>
            <div class="p">${esc(t.path)}</div>
            ${t.ua?`<div class="small muted">UA: ${esc(t.ua)}</div>`:''}</div>`).join("")
          : `<p class="small muted"><i class="fas fa-shield-halved" style="color:var(--green)"></i> No hostile probes detected. All quiet on the wire.</p>`}
      </div>`;

      // Intel dossier
      html+=`<div class="panel" style="margin-bottom:1.6rem;">
        <h3><i class="fas fa-file-shield"></i> Intel Dossier</h3>
        <div class="ops"><input id="repT" placeholder="Report title…"><button onclick="fileReport()">File Report</button></div>
        <textarea id="repD" rows="2" placeholder="Details (optional)…" style="margin-top:.5rem;"></textarea>
        <div style="margin-top:.8rem;">${(d.intel||[]).length ? d.intel.map(i=>`<div class="ev ${i.reward>0?'':'note'}">
            <b>${esc(i.title)}</b> ${i.reward>0?`<span class="rank">+${i.reward} CBT</span>`:''}
            ${i.detail?`<div class="small muted">${esc(i.detail)}</div>`:''}
            <div class="a">— ${ul(i.agent)} · ${i.created_at?new Date(i.created_at).toLocaleString():''}</div></div>`).join("")
          : `<p class="small muted">No intel on file. Run an operation or file a report.</p>`}</div>
      </div>`;

      // Case files
      html+=`<h3 style="margin-bottom:1rem;"><i class="fas fa-folder-open"></i> Case Files (${d.firs.length})</h3>`;
      if(!d.firs.length) html+=`<p class="muted">No reports filed.</p>`;
      else html+=d.firs.map(f=>{
        const ev=(f.log||[]).filter(x=>x.kind==='evidence');
        const notes=(f.log||[]).filter(x=>x.kind==='note');
        return `<div class="case">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:.6rem;">
            <b>#${f.id} · ${esc(f.title)}</b><span class="st st-${f.status}">${f.status}</span></div>
          <p class="small">Complainant: ${ul(f.complainant)} · Accused: ${ul(f.accused)} ${f.assigned_to?`· Agent: ${ul(f.assigned_to)}`:''}</p>
          ${f.description?`<p class="muted" style="font-size:.88rem;">${esc(f.description)}</p>`:''}
          <p class="small" style="margin-top:.5rem;color:var(--accent)">Evidence (${ev.length})</p>
          ${ev.map(e=>`<div class="ev">${esc(e.entry)}<div class="a">— ${esc(e.author)}</div></div>`).join("")||'<p class="small muted">None on file.</p>'}
          ${notes.length?`<p class="small" style="margin-top:.4rem;color:var(--red)">Classified Notes (${notes.length})</p>`+notes.map(n=>`<div class="ev note">${esc(n.entry)}<div class="a">— ${esc(n.author)}</div></div>`).join(""):''}
          ${f.status!=='escalated'?`<div class="ops">
            ${f.status!=='investigating'?`<button onclick="op(${f.id},'assign')">Take Case</button>`:''}
            <input id="nt${f.id}" placeholder="Add classified note…"><button class="ghost" onclick="addNote(${f.id})">Note</button>
            <button onclick="op(${f.id},'status','closed')">Close</button>
            <button class="danger" onclick="escalate(${f.id})">Escalate to Court</button>
          </div>`:`<p class="small" style="margin-top:.5rem;"><a class="link" href="/court?case=${f.court_case_id}">In the Courts →</a></p>`}
        </div>`;
      }).join("");

      document.getElementById("view").innerHTML=html;
      applyCooldown(d.op_cooldown||0);
      renderSurveil(d.surveil);
    }

    function renderSurveil(surveil){
      const box=document.getElementById("surveilBox"); if(!box||!surveil) return;
      box.innerHTML = Object.keys(surveil).map(k=>{
        const t=surveil[k], s=t.state;
        const name=(s&&s.title)?s.title.split("|")[0].trim():(k.charAt(0).toUpperCase()+k.slice(1));
        if(!s) return `<div class="starget"><b>${esc(name)}</b> <span class="small muted">— never checked. Hit “Ping now”.</span></div>`;
        const badge=s.up?`<span class="sb up">● ONLINE</span>`:`<span class="sb down">● OFFLINE</span>`;
        const routes=(s.links||[]).length?(s.links.map(l=>`<span class="rchip2">${esc(l)}</span>`).join("")):'<span class="small muted">none advertised</span>';
        const bars=(t.log||[]).slice().reverse();
        const max=Math.max(1,...bars.map(b=>b.up?b.ms:0));
        const spark=bars.map(b=>`<span class="bar ${b.up?'':'d'}" title="${b.up?b.ms+'ms':'down'}" style="${b.up?'height:'+Math.max(8,Math.round(b.ms/max*100))+'%':''}"></span>`).join("")||'<span class="small muted">no history yet</span>';
        const sec=s.sec||{};
        const secItem=(ok,label)=>`<span class="techbadge" style="color:${ok?'var(--green)':'var(--red)'};border-color:${ok?'rgba(31,214,166,.4)':'rgba(255,93,108,.4)'}"><i class="fas fa-${ok?'shield-halved':'triangle-exclamation'}"></i> ${label}</span>`;
        const secRow=Object.keys(sec).length
          ? secItem(sec.hsts,"HSTS")+secItem(sec.csp,"CSP")+secItem(sec.xfo,"X-Frame")+secItem(sec.nosniff,"No-Sniff")+secItem(sec.referrer,"Referrer")
          : '<span class="small muted">unknown</span>';
        const stats=Object.entries(s.stats||{}).map(([k,v])=>`<span class="rchip2" style="color:var(--gold)">${esc(v)} ${esc(k.trim())}</span>`).join("")||'<span class="small muted">none found</span>';
        const feats=(s.features||[]).map(f=>`<span class="rchip2" style="color:var(--green)">${esc(f)}</span>`).join("")||'<span class="small muted">none detected</span>';
        const recon=(t.recon||[]).length?(t.recon.map(r=>`<span class="rchip2">${esc(r)}</span>`).join("")):'<span class="small muted">run Deep Recon to map robots.txt / sitemap</span>';
        return `<div class="starget">
          <div class="shead"><b>${esc(name)}</b> ${badge}
            <button class="ghost" style="width:auto;margin:0 0 0 auto;padding:.25rem .7rem;font-size:.76rem;" onclick="reconTarget('${k}')"><i class="fas fa-magnifying-glass"></i> Deep Recon</button></div>
          <div class="small muted" style="margin-bottom:.3rem;">${esc(t.target)} · checked ${s.ago}s ago${s.err?` · <span style="color:var(--red)">${esc(s.err)}</span>`:''}</div>
          <div class="statgrid">
            <div><div class="k">Latency</div><div class="v">${s.up?s.ms+" ms":"—"}</div></div>
            <div><div class="k">Uptime</div><div class="v">${t.uptime!=null?t.uptime+"%":"—"}</div></div>
            <div><div class="k">Avg</div><div class="v">${t.avg_ms!=null?t.avg_ms+" ms":"—"}</div></div>
            <div><div class="k">Version</div><div class="v">${s.version?"v"+esc(s.version):"?"}</div></div>
          </div>
          <div style="margin:.3rem 0;">
            ${s.cloudflare?'<span class="techbadge"><i class="fas fa-cloud"></i> Cloudflare</span>':''}
            ${s.server?`<span class="techbadge">${esc(s.server)}</span>`:''}
            ${s.powered?`<span class="techbadge">${esc(s.powered)}</span>`:''}
          </div>
          <div class="small muted">Defensive posture (${s.sec_score||0}/5 security headers):</div>
          <div style="margin:.3rem 0 .5rem;">${secRow}</div>
          <div class="small muted">Their advertised stats:</div><div style="margin:.3rem 0 .5rem;">${stats}</div>
          <div class="small muted">Detected features:</div><div style="margin:.3rem 0 .5rem;">${feats}</div>
          <div class="small muted">Advertised routes:</div><div style="margin:.3rem 0 .3rem;">${routes}</div>
          <div class="small muted">Deep-recon routes (robots/sitemap):</div><div style="margin:.3rem 0 .5rem;">${recon}</div>
          <div class="small muted">Latency history:</div>
          <div class="spark">${spark}</div>
        </div>`;
      }).join("");
    }
    async function pingSurveil(){
      try{ const d=await api("/athena/surveil",{method:"POST",body:JSON.stringify({target:"aquilithia"})}); renderSurveil(d.surveil); }catch(e){}
    }
    async function refreshSurveil(){
      try{ const d=await api("/athena/surveil"); renderSurveil(d.surveil); }catch(e){}
    }
    async function reconTarget(key){
      try{ const d=await api("/athena/recon",{method:"POST",body:JSON.stringify({target:key})}); renderSurveil(d.surveil); }
      catch(e){ alert(e.message); }
    }

    function applyCooldown(secs){
      if(cdTimer) clearInterval(cdTimer);
      const set=(s)=>{
        document.querySelectorAll(".launchbtn").forEach(b=>b.disabled=s>0);
        const el=document.getElementById("opCd"); if(el) el.textContent = s>0 ? `⏱ Next operation available in ${s}s` : "";
      };
      let s=secs; set(s);
      if(s>0){ cdTimer=setInterval(()=>{ s--; set(s); if(s<=0) clearInterval(cdTimer); },1000); }
    }

    async function runOp(key){
      try{
        const r=await api("/athena/op",{method:"POST",body:JSON.stringify({op:key})});
        await load();
        const m=document.getElementById("opMsg");
        if(m){ m.style.color=r.op_success?"var(--green)":"var(--red)";
          m.textContent = r.op_success ? `✔ ${r.detail}  (+${r.reward} Cybits)` : `✘ ${r.detail}`; }
      }catch(e){
        const m=document.getElementById("opMsg");
        if(m){ m.style.color="var(--red)"; m.textContent=e.message; } else alert(e.message);
      }
    }
    async function fileReport(){
      const title=document.getElementById("repT").value.trim();
      const detail=document.getElementById("repD").value.trim();
      if(!title) return;
      try{ await api("/athena/report",{method:"POST",body:JSON.stringify({title,detail})}); load(); }
      catch(e){ alert(e.message); }
    }

    async function recruit(){
      const username=document.getElementById("recU").value.trim();
      const rank=document.getElementById("recR").value;
      const m=document.getElementById("recMsg");
      try{ await api("/athena/recruit",{method:"POST",body:JSON.stringify({username,rank})});
        m.style.color="var(--green)"; m.textContent="Recruited."; load();
      }catch(e){ m.style.color="var(--red)"; m.textContent=e.message; }
    }
    async function dismiss(u){ try{ await api("/athena/dismiss",{method:"POST",body:JSON.stringify({username:decodeURIComponent(u)})}); load(); }catch(e){ alert(e.message); } }
    async function op(id,action,status){ try{ await api("/athena/case",{method:"POST",body:JSON.stringify({fir_id:id,action,status})}); load(); }catch(e){ alert(e.message); } }
    async function addNote(id){ const i=document.getElementById("nt"+id); const note=i.value.trim(); if(!note) return;
      try{ await api("/athena/case",{method:"POST",body:JSON.stringify({fir_id:id,action:'note',note})}); i.value=""; load(); }catch(e){ alert(e.message); } }
    async function escalate(id){ try{ await api("/athena/escalate",{method:"POST",body:JSON.stringify({fir_id:id})}); load(); }catch(e){ alert(e.message); } }

    (async function(){
      const user=await requireAuth(); if(!user) return;
      renderNav("/athena", user);
      try{ const cz=await api("/citizens/list"); (cz.citizens||[]).forEach(c=>{ if(c.avatar) AV[c.username]=c.avatar; }); }catch{}
      await load();
      pingSurveil();                               // first surveillance sweep
      setInterval(refreshSurveil, 20000);          // keep the uplink warm
    })();
  </script>
</body>
</html>
