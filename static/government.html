<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyvathon Government</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .gov-card{ text-align:center; }
    .gov-card .seat{ font-size:2.3rem; color:var(--accent); margin-bottom:.6rem;
      filter:drop-shadow(0 0 12px rgba(88,196,255,.35)); }
    .gov-card .pos{ color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-size:.78rem; }
    .gov-card .holder{ font-size:1.35rem; font-weight:700; color:var(--text); margin-top:.3rem; }
    .gov-card .holder a{ color:var(--text); }
    .gov-card .holder a:hover{ color:var(--accent); }
    .president{ grid-column:1/-1; background:linear-gradient(135deg,rgba(88,196,255,.12),rgba(255,255,255,.02)); }
    .min-card .seat{ font-size:1.9rem; }
    .min-card .mandate{ color:var(--muted); font-size:.85rem; margin-top:.5rem; }
    .min-card .budget{ font-size:.78rem; color:var(--accent); margin-top:.4rem; }
    .gav-lg{ width:66px; height:66px; border-radius:50%; margin:0 auto .6rem; display:flex; align-items:center;
      justify-content:center; font-weight:800; font-size:1.5rem; color:#06223a;
      background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap">
    <h2 class="section-title"><i class="fas fa-landmark"></i> Government of Cyvathon</h2>
    <p class="section-sub">A ceremonial republic. The President leads the state; the people elect the Prime Minister and the Judge.</p>

    <h3 class="section-title" style="font-size:1.4rem;margin-bottom:1.2rem;">Offices of State</h3>
    <div class="grid" id="cabinet"></div>

    <h3 class="section-title" style="font-size:1.4rem;margin:3rem 0 1.2rem;">The Ministries</h3>
    <p class="section-sub" style="margin-bottom:1.6rem;">The executive departments and the Ministers who lead them.</p>
    <div class="grid" id="ministries"></div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    const esc=(s)=>(s||"").replace(/</g,"&lt;");
    const ICON = {
      "President":"fa-crown", "Prime Minister":"fa-user-tie", "Judge":"fa-gavel",
      "Security Minister":"fa-shield-halved", "Head of Coding":"fa-code",
      "Head of Hacking":"fa-user-secret", "CEO / Co-Founder":"fa-briefcase"
    };
    const holder=(n)=> (!n || n==='Vacant')
      ? '<span class="muted">Vacant</span>'
      : `<a href="/profile?user=${encodeURIComponent(n)}">${esc(n)}</a>`;
    const AV = {};
    function seatFor(name, iconClass){
      if(!name || name==='Vacant') return `<div class="seat"><i class="fas ${iconClass}"></i></div>`;
      return `<div class="gav-lg" ${avatarStyle(AV[name])}>${AV[name]?'':esc((name||'?')[0].toUpperCase())}</div>`;
    }

    (async function(){
      renderNav("/government", await currentUser());
      try{ const cz=await api("/citizens/list"); (cz.citizens||[]).forEach(c=>{ if(c.avatar) AV[c.username]=c.avatar; }); }catch{}

      const g = await api("/gov");
      document.getElementById("cabinet").innerHTML = g.government.map(o=>`
        <div class="card gov-card ${o.position==='President'?'president':''}">
          ${seatFor(o.holder, ICON[o.position]||'fa-user')}
          <div class="pos">${esc(o.position)}</div>
          <div class="holder">${holder(o.holder)}</div>
        </div>`).join("");

      try{
        const m = await api("/ministries/list");
        const host = document.getElementById("ministries");
        if(!m.ministries.length){ host.innerHTML = `<p class="muted">No ministries established.</p>`; return; }
        host.innerHTML = m.ministries.map(x=>`
          <div class="card gov-card min-card">
            ${seatFor(x.minister, esc(x.icon)||'fa-landmark')}
            <div class="pos">${esc(x.name)}</div>
            <div class="holder">${holder(x.minister)}</div>
            ${x.mandate?`<div class="mandate">${esc(x.mandate)}</div>`:''}
            <div class="budget"><i class="fas fa-coins"></i> Budget: ${fmt(x.budget)} CB</div>
          </div>`).join("");
      }catch{
        document.getElementById("ministries").innerHTML = `<p class="muted">Ministries unavailable.</p>`;
      }
    })();
  </script>
</body>
</html>
