<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizens · Cyvathon</title>
  <!-- social / SEO metadata -->
  <meta name="description" content="Every citizen of Cyvathon — browse the national register." />
  <link rel="canonical" href="https://cyvathon.onrender.com/citizens" />
  <meta name="theme-color" content="#58c4ff" />
  <link rel="icon" href="/static/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cyvathon" />
  <meta property="og:title" content="Citizens · Cyvathon" />
  <meta property="og:description" content="Every citizen of Cyvathon — browse the national register." />
  <meta property="og:url" content="https://cyvathon.onrender.com/citizens" />
  <meta property="og:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Citizens · Cyvathon" />
  <meta name="twitter:description" content="Every citizen of Cyvathon — browse the national register." />
  <meta name="twitter:image" content="https://cyvathon.onrender.com/static/og-image.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .search{ max-width:420px; margin:0 auto 2rem; display:block; }
    .cz-grid{ display:grid; gap:1.1rem; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
    .cz{ background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:1.1rem 1.2rem;
      display:flex; flex-direction:column; gap:.7rem; transition:.2s; }
    .cz:hover{ transform:translateY(-4px); border-color:rgba(88,196,255,.35); box-shadow:0 10px 26px rgba(0,0,0,.3); }
    .cz .head{ display:flex; align-items:center; gap:.8rem; }
    .cz .av{ width:46px; height:46px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:1.1rem; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .cz .nm{ font-weight:700; font-size:1.05rem; }
    .cz .nm a{ color:var(--text); text-decoration:none; } .cz .nm a:hover{ color:var(--accent); }
    .cz .role{ font-size:.8rem; color:var(--muted); }
    .cz .role .tag{ margin-right:.3rem; }
    .cz .actions{ display:flex; gap:.5rem; margin-top:auto; }
    .cz .actions a,.cz .actions button{ flex:1; margin:0; padding:.5rem; font-size:.85rem; text-align:center; text-decoration:none; border-radius:10px; }
    .cz .view{ background:var(--panel-2); color:var(--text); border:1px solid var(--panel-border); display:flex; align-items:center; justify-content:center; gap:.4rem; }
    .cz .view:hover{ border-color:var(--accent); color:var(--accent); }
    .cz .dm{ background:linear-gradient(135deg,#5ec5ff,#3aa0ee); color:#04223b; border:none; display:flex; align-items:center; justify-content:center; gap:.4rem; cursor:pointer; }
    .badge-you{ font-size:.68rem; color:var(--accent); font-weight:600; }
    .natflag{ font-size:.64rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:#032018;
      background:linear-gradient(135deg,#26e0a8,#12a37c); padding:.08rem .4rem; border-radius:5px; margin-left:.35rem; vertical-align:middle; }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap">
    <h2 class="section-title"><i class="fas fa-users"></i> Citizens of Cyvathon</h2>
    <p class="section-sub">Every citizen and what they do. Click a name to view their ID card, or hit DM to start a conversation.</p>
    <input class="search" id="search" placeholder="Search citizens…" oninput="render()">
    <div class="cz-grid" id="grid"></div>
    <p id="count" class="small" style="text-align:center;margin-top:1.5rem;"></p>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let ME=null, ALL=[];
    const esc=(s)=>(s||"").replace(/</g,"&lt;");
    const enc=encodeURIComponent;

    function card(c){
      const you=c.username===ME;
      const role = c.company
        ? `<span class="tag">${esc(c.designation||'Citizen')}</span> ${esc(c.company)}`
        : `<span class="tag">${esc(c.designation||'Citizen')}</span>`;
      const actions = you
        ? `<a class="view" href="/profile"><i class="fas fa-id-card"></i> My ID Card</a>`
        : `<a class="view" href="/profile?user=${enc(c.username)}"><i class="fas fa-id-card"></i> Profile</a>
           <button class="dm" onclick="location.href='/chat?dm=${enc(c.username)}'"><i class="fas fa-comment"></i> DM</button>`;
      return `<div class="cz">
        <div class="head">
          <div class="av" ${avatarStyle(c.avatar)}>${c.avatar?'':esc(c.username[0].toUpperCase())}</div>
          <div><div class="nm"><a href="${you?'/profile':'/profile?user='+enc(c.username)}">${esc(c.username)}</a>
            ${c.account_type==='micronation'?' <span class="natflag">🏳️ Nation</span>':''}
            ${you?' <span class="badge-you">(you)</span>':''}</div>
            <div class="role">${role}</div></div>
        </div>
        <div class="actions">${actions}</div>
      </div>`;
    }

    function render(){
      const q=(document.getElementById("search").value||"").toLowerCase();
      const list=ALL.filter(c=>c.username.toLowerCase().includes(q) || (c.company||"").toLowerCase().includes(q) || (c.designation||"").toLowerCase().includes(q));
      document.getElementById("grid").innerHTML = list.map(card).join("") || `<p class="muted">No citizens match.</p>`;
      document.getElementById("count").textContent = `${ALL.length} citizen${ALL.length===1?"":"s"} of the Republic`;
    }

    (async function(){
      const user=await requireAuth(); if(!user) return;
      ME=user.username; renderNav("/citizens", user);
      document.getElementById("grid").innerHTML=spinner("Gathering the citizens…");
      try{ const d=await api("/citizens/list"); ME=d.me; ALL=d.citizens||[]; render(); }
      catch(e){ document.getElementById("grid").innerHTML=`<p class="muted">${e.message}</p>`; }
    })();
  </script>
</body>
</html>
