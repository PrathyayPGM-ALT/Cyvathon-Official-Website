  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    /* The Constitution keeps the national livery, with the founding gold of
       the National Timeline for its headings — this is the country's own
       document, not a service with a brand. */
    .c-hero{ text-align:center; margin-bottom:2.2rem; }
    .c-hero .seal{ font-size:1.6rem; color:var(--gold); margin-bottom:.4rem; }
    .c-hero .adopted{ display:inline-flex; align-items:center; gap:.55rem; padding:.45rem 1.1rem;
      border-radius:30px; font-size:.85rem; font-weight:600; margin-top:.8rem;
      background:rgba(255,206,86,.12); border:1px solid rgba(255,206,86,.35); color:var(--gold); }
    .c-actions{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; margin-top:1.2rem; }
    .c-actions a{ text-decoration:none; }
    .c-actions button{ width:auto; padding:.7rem 1.5rem; }
    .c-actions button.ghost{ background:transparent; border:1px solid var(--panel-border-2);
      color:var(--text); box-shadow:none; }

    /* preamble */
    .preamble{ max-width:760px; margin:0 auto 2.4rem; padding:1.6rem 1.8rem; border-radius:18px;
      background:linear-gradient(165deg, rgba(255,206,86,.10), rgba(120,170,255,.03));
      border:1px solid rgba(255,206,86,.28); font-style:italic; font-size:1.02rem;
      line-height:1.8; color:var(--text-dim); }
    .preamble b{ display:block; font-style:normal; font-size:.74rem; letter-spacing:1.6px;
      text-transform:uppercase; color:var(--gold); margin-bottom:.6rem; }

    /* contents strip */
    .toc{ display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; max-width:900px;
      margin:0 auto 2.4rem; }
    .toc a{ font-size:.82rem; font-weight:600; padding:.45rem .85rem; border-radius:20px;
      text-decoration:none; color:var(--muted); background:var(--panel);
      border:1px solid var(--panel-border); transition:.18s; }
    .toc a:hover{ color:var(--text); border-color:rgba(255,206,86,.5); background:rgba(255,206,86,.08); }
    .toc a b{ color:var(--gold); margin-right:.35rem; }

    /* articles */
    .articles{ max-width:820px; margin:0 auto; }
    .art{ margin-bottom:2rem; scroll-margin-top:90px; }
    .art > h3{ display:flex; align-items:baseline; gap:.7rem; font-size:1.25rem; margin-bottom:.9rem; }
    .art > h3 .n{ font-size:.78rem; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
      color:var(--gold); white-space:nowrap; }
    .art > h3::after{ content:""; flex:1; height:1px; background:var(--panel-border); margin-left:.4rem; }
    .sec{ padding:1rem 1.2rem; margin-bottom:.7rem; border-left:3px solid var(--gold);
      background:var(--panel); border-radius:0 12px 12px 0; }
    .sec h4{ color:var(--text); margin:0 0 .3rem; font-size:.98rem; }
    .sec h4 span{ color:var(--gold); font-weight:800; margin-right:.4rem; }
    .sec p{ margin:0; color:var(--muted); font-size:.92rem; line-height:1.7; }
    .sec p i{ color:var(--text-dim); }

    .closing{ max-width:760px; margin:2.4rem auto 0; text-align:center; color:var(--muted);
      font-style:italic; font-size:.92rem; line-height:1.7; padding-top:1.4rem;
      border-top:1px solid var(--panel-border); }
    .closing .small{ font-style:normal; margin-top:1rem; }
    .loading{ color:var(--muted); text-align:center; padding:2rem; }
    @media(max-width:600px){ .preamble{ padding:1.2rem 1.1rem; } .art > h3{ font-size:1.1rem; } }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap">
    <div class="c-hero">
      <div class="seal"><i class="fas fa-diamond"></i></div>
      <h2 class="section-title" style="margin-bottom:.4rem;">The Constitution</h2>
      <p class="section-sub" style="margin-bottom:0;">of the Republic of Cyvathon. A nation is its
        people, not its ruler.</p>
      <div id="adopted"></div>
      <div class="c-actions">
        <a href="/static/cyvathon-constitution.pdf" target="_blank" rel="noopener">
          <button><i class="fas fa-file-pdf"></i> &nbsp;Read as a PDF</button></a>
        <a href="/rules"><button class="ghost"><i class="fas fa-scroll"></i> &nbsp;The Lawbook &amp; rules</button></a>
        <a href="/legislature"><button class="ghost"><i class="fas fa-scale-balanced"></i> &nbsp;Propose an amendment</button></a>
      </div>
    </div>

    <div id="doc"><p class="loading"><i class="fas fa-circle-notch fa-spin"></i> Opening the record…</p></div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    /* The text is not written here. build_constitution.py writes the PDF and
       static/constitution.json from one source, and this page renders the JSON,
       so what you read on screen is exactly what is in the PDF. */
    const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
    // the articles use only <i> for emphasis and a few entities; allow exactly that
    const rich = s => esc(s).replace(/&lt;(\/?)i&gt;/g, "<$1i>")
                            .replace(/&amp;(amp|mdash|middot|sect|nbsp);/g, "&$1;");

    async function loadConstitution(){
      let d;
      try{
        const r = await fetch("/static/constitution.json", {cache:"no-cache"});
        if(!r.ok) throw new Error(r.status);
        d = await r.json();
      }catch(e){
        document.getElementById("doc").innerHTML =
          `<p class="loading">The Constitution could not be loaded. <a class="link" href="/static/cyvathon-constitution.pdf">Open the PDF instead →</a></p>`;
        return;
      }
      document.getElementById("adopted").innerHTML =
        `<span class="adopted"><i class="fas fa-stamp"></i> Founded ${esc(d.founded)} · Adopted ${esc(d.adopted)}</span>`;

      const toc = d.articles.map(a =>
        `<a href="#art-${esc(a.num)}"><b>${esc(a.num)}</b>${esc(a.title)}</a>`).join("");
      const arts = d.articles.map(a => `
        <section class="art" id="art-${esc(a.num)}" aria-labelledby="h-${esc(a.num)}">
          <h3 id="h-${esc(a.num)}"><span class="n">Article ${esc(a.num)}</span> ${esc(a.title)}</h3>
          ${a.sections.map((s,i) => `
            <div class="sec">
              <h4><span>§${i+1}.</span>${esc(s.head)}</h4>
              <p>${rich(s.text)}</p>
            </div>`).join("")}
        </section>`).join("");

      document.getElementById("doc").innerHTML = `
        <div class="preamble"><b>Preamble</b>${rich(d.preamble)}</div>
        <nav class="toc" aria-label="Articles">${toc}</nav>
        <div class="articles">${arts}</div>
        <div class="closing">${rich(d.closing)}
          <p class="small">${esc(d.disclaimer)}</p></div>`;
    }

    (async function(){
      renderNav("/constitution", await currentUser());
      loadConstitution();
    })();
  </script>
</body>
</html>
