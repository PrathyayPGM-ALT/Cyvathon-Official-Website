<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070c18">
  <title>Offline · Cyvathon</title>
  <!-- Shown by the app when there's no connection. Everything it needs is in
       this file, because nothing else can be fetched. -->
  <style>
    *{ box-sizing:border-box; margin:0; }
    html,body{ height:100%; }
    body{ display:grid; place-items:center; padding:2rem 1.4rem; text-align:center;
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; color:#eaf2fb;
      background:radial-gradient(600px 400px at 50% 20%,rgba(88,196,255,.22),transparent 70%),#070c18; }
    .card{ max-width:380px; }
    img{ width:96px; height:96px; border-radius:24px; box-shadow:0 18px 40px rgba(34,211,238,.3); }
    h1{ margin:1.4rem 0 .6rem; font-size:1.7rem; font-weight:800; letter-spacing:-.5px; }
    p{ color:#9db0c6; line-height:1.6; }
    button{ margin-top:1.6rem; padding:.9rem 2rem; border:none; border-radius:40px; cursor:pointer;
      font:800 1rem inherit; color:#041b33; background:linear-gradient(135deg,#58c4ff,#22d3ee);
      box-shadow:0 12px 30px rgba(34,211,238,.35); }
    small{ display:block; margin-top:1.2rem; color:#6b7d94; font-size:.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/icons/icon-192.png" alt="Cyvathon">
    <h1>You're offline</h1>
    <p>Cyvathon needs a connection so your money, chats and votes are always up to date.
       It'll pick up where you left off as soon as you're back.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small id="auto">Checking again automatically…</small>
  </div>
  <script>
    // Back online: carry on without making them press anything.
    addEventListener("online", () => location.reload());
  </script>
</body>
</html>
