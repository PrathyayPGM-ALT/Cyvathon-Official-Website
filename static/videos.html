<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos · Cyvathon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .vtop{ max-width:1180px; margin:0 auto 1.6rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; }
    .vtop h2{ font-size:1.65rem; margin:0; display:flex; align-items:center; gap:.6rem; }
    .vtop p{ color:var(--muted); margin:.28rem 0 0; font-size:.92rem; }
    .create-btn{ width:auto; margin:0; white-space:nowrap; padding:.72rem 1.35rem; flex-shrink:0;
      background:linear-gradient(135deg,#ff7a8a,#ff5d6c); color:#2a0410; box-shadow:0 8px 22px rgba(255,93,108,.35); }
    .create-btn:hover{ box-shadow:0 12px 30px rgba(255,93,108,.5); }
    @media(max-width:560px){ .vtop{ flex-direction:column; align-items:stretch; } .create-btn{ width:100%; justify-content:center; } }

    .stage{ max-width:1180px; margin:0 auto; }
    .rowhead{ display:flex; align-items:center; gap:.6rem; font-size:1.05rem; font-weight:800; margin:0 0 1rem; }
    .rowhead .sub{ font-weight:600; color:var(--muted); font-size:.85rem; }

    /* thumbnail + shared card bits */
    .thumb{ position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:14px; overflow:hidden; }
    .thumbimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; border:0; }
    .thumb .play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at center, rgba(0,0,0,.15), rgba(0,0,0,.42)); opacity:0; transition:.18s; }
    .thumb .play i{ font-size:2.6rem; color:#fff; filter:drop-shadow(0 2px 10px rgba(0,0,0,.6)); }
    .card:hover .thumb .play{ opacity:1; }
    .vbadge{ position:absolute; left:.55rem; top:.55rem; background:linear-gradient(135deg,#ff7a8a,#ff5d6c); color:#2a0410;
      font-weight:800; font-size:.72rem; padding:.2rem .55rem; border-radius:999px; box-shadow:0 3px 10px rgba(0,0,0,.35); }
    .vdur{ position:absolute; right:.5rem; bottom:.5rem; background:rgba(0,0,0,.82); color:#fff; font-size:.72rem; font-weight:700; padding:.1rem .4rem; border-radius:6px; }

    /* featured (top 3) + grid */
    .featured{ display:grid; grid-template-columns:repeat(3,1fr); gap:1.3rem; margin-bottom:2.4rem; }
    .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:1.3rem 1.1rem; }
    .card{ cursor:pointer; }
    .card .meta{ display:flex; gap:.7rem; margin-top:.7rem; }
    .card .av{ width:36px; height:36px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:.9rem; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .card .mt{ min-width:0; }
    .card .ct{ font-weight:700; font-size:1rem; line-height:1.32; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card .cm{ font-size:.83rem; color:var(--muted); margin-top:.25rem; }
    .card .cm a{ color:var(--muted); text-decoration:none; } .card:hover .ct{ color:var(--accent); }
    @media(max-width:820px){ .featured{ grid-template-columns:1fr; } }

    /* ---------- watch view ---------- */
    .watch{ display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:1.6rem; align-items:start; }
    .back{ width:auto; background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:.92rem; font-weight:600; padding:.35rem 0; margin:0 0 1.1rem; box-shadow:none; display:inline-flex; align-items:center; gap:.5rem; }
    .back:hover{ color:var(--accent); transform:none; }
    .player{ position:relative; width:100%; padding-top:56.25%; background:#000; border-radius:16px; overflow:hidden; }
    .player iframe,.player video{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
    .wtitle{ font-size:1.4rem; font-weight:800; margin:1rem 0 .5rem; line-height:1.3; }
    .wsubrow{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .wviews{ color:var(--muted); font-size:.9rem; }
    .vshare{ width:auto; margin:0; padding:.5rem 1rem; border-radius:999px; font-size:.86rem; font-weight:600;
      background:var(--panel-2); color:var(--text); border:1px solid var(--panel-border); box-shadow:none; display:inline-flex; align-items:center; gap:.5rem; }
    .vshare:hover{ border-color:var(--accent); color:var(--accent); transform:none; }
    .wchannel{ display:flex; align-items:center; gap:.7rem; margin:1rem 0; padding:.85rem 0; border-top:1px solid var(--panel-border); border-bottom:1px solid var(--panel-border); }
    .wchannel .av{ width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .wchannel a{ color:var(--text); text-decoration:none; font-weight:700; } .wchannel a:hover{ color:var(--accent); }
    .wdesc{ background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:.9rem 1.1rem; color:#cdd6e0;
      font-size:.92rem; white-space:pre-wrap; line-height:1.55; }
    .wempty-desc{ display:none; }

    .cwrap{ margin-top:1.7rem; }
    .cwrap h3{ font-size:1.05rem; margin:0 0 1rem; }
    .cbox{ display:flex; gap:.6rem; margin-bottom:1.3rem; }
    .cbox .av{ width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .cbox input{ margin:0; }
    .cbox button{ margin:0; width:auto; padding:.55rem 1.1rem; white-space:nowrap; }
    .cmt{ display:flex; gap:.7rem; align-items:flex-start; margin-bottom:1rem; }
    .cmt .av{ width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.9rem; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .cmt .cn{ font-weight:700; font-size:.86rem; } .cmt .cn a{ color:var(--text); text-decoration:none; } .cmt .cn a:hover{ color:var(--accent); }
    .cmt .cn .cd{ color:var(--muted); font-weight:500; font-size:.78rem; margin-left:.4rem; }
    .cmt .ct{ font-size:.93rem; color:#e6ecf3; white-space:pre-wrap; margin-top:.15rem; line-height:1.5; }

    /* recommended sidebar */
    .side h3{ font-size:1rem; margin:0 0 1rem; }
    .rcard{ display:flex; gap:.7rem; cursor:pointer; margin-bottom:.9rem; }
    .rthumb{ position:relative; width:168px; flex-shrink:0; padding-top:94.5px; background:#000; border-radius:10px; overflow:hidden; }
    .rthumb .thumbimg{ border-radius:10px; }
    .rcard .ri{ min-width:0; }
    .rcard .rt{ font-weight:700; font-size:.9rem; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .rcard:hover .rt{ color:var(--accent); }
    .rcard .rm{ font-size:.78rem; color:var(--muted); margin-top:.3rem; }
    @media(max-width:960px){ .watch{ grid-template-columns:1fr; } .rthumb{ width:160px; padding-top:90px; } }

    .empty{ text-align:center; color:var(--muted); padding:2.5rem 1rem; }

    /* create modal */
    .modal-bg{ position:fixed; inset:0; background:rgba(2,8,18,.72); backdrop-filter:blur(4px);
      display:none; align-items:center; justify-content:center; z-index:1000; padding:1rem; }
    .modal-bg.on{ display:flex; }
    .modal{ background:var(--panel); border:1px solid var(--panel-border); border-radius:18px; padding:1.4rem 1.5rem;
      width:100%; max-width:480px; box-shadow:0 24px 60px rgba(0,0,0,.55); animation:mpop .2s ease; }
    @keyframes mpop{ from{ transform:translateY(12px) scale(.98); opacity:0; } to{ transform:none; opacity:1; } }
    .mhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    .mhead b{ font-size:1.2rem; }
    .mx{ cursor:pointer; color:var(--muted); font-size:1.6rem; line-height:1; }
    .mx:hover{ color:var(--text); }
    .mtabs{ display:flex; gap:.4rem; background:var(--panel-2); border:1px solid var(--panel-border); border-radius:12px; padding:.3rem; margin-bottom:1rem; }
    .mtabs button{ flex:1; margin:0; padding:.55rem; border:none; background:transparent; color:var(--muted); box-shadow:none; font-weight:600; border-radius:9px; font-size:.88rem; }
    .mtabs button:hover{ transform:none; color:var(--text); }
    .mtabs button.on{ background:linear-gradient(135deg,#ff7a8a,#ff5d6c); color:#2a0410; }
    .drop{ border:2px dashed var(--panel-border); border-radius:14px; padding:1.7rem 1rem; text-align:center; cursor:pointer;
      color:var(--muted); transition:.15s; margin-bottom:.4rem; }
    .drop:hover{ border-color:var(--accent); color:var(--text); }
    .drop.has{ border-color:var(--green); color:var(--text); }
    .drop i{ font-size:1.9rem; display:block; margin-bottom:.55rem; color:var(--accent); }
    .hint{ font-size:.78rem; color:var(--muted); margin:.1rem 0 .5rem .2rem; }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="wrap">
    <div class="vtop">
      <div>
        <h2><i class="fas fa-video" style="color:#ff5d6c"></i> Cyvathon Videos</h2>
        <p>Watch what citizens are sharing.</p>
      </div>
      <button class="create-btn" onclick="openModal()"><i class="fas fa-plus"></i> Post a video</button>
    </div>

    <div class="stage" id="stage"></div>
  </div>

  <!-- create modal -->
  <div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="mhead"><b>Post a video</b><span class="mx" onclick="closeModal()">&times;</span></div>
      <div class="mtabs">
        <button id="tabUpload" class="on" onclick="setTab('upload')"><i class="fas fa-upload"></i> From your computer</button>
        <button id="tabLink" onclick="setTab('link')"><i class="fas fa-link"></i> Paste a link</button>
      </div>
      <input id="vTitle" placeholder="Video title" maxlength="140">
      <div id="paneUpload">
        <div class="drop" id="drop" onclick="document.getElementById('vFile').click()">
          <i class="fas fa-cloud-arrow-up"></i>
          <div id="dropLabel">Click to choose a video<br><span style="font-size:.8rem;">mp4 or webm · up to 48 MB</span></div>
        </div>
        <input type="file" id="vFile" accept="video/mp4,video/webm,video/ogg" style="display:none" onchange="fileChosen()">
      </div>
      <div id="paneLink" style="display:none;">
        <input id="vUrl" placeholder="YouTube link or .mp4 / .webm URL">
        <div class="hint">e.g. https://youtube.com/watch?v=… &nbsp;·&nbsp; or a direct https://….mp4 link</div>
      </div>
      <textarea id="vDesc" placeholder="Say something about it (optional)" maxlength="1000" style="min-height:64px;resize:vertical;"></textarea>
      <button onclick="submitVideo()" id="vPostBtn"><i class="fas fa-paper-plane"></i> Post video</button>
      <p id="vMsg" class="small" style="text-align:center;margin-top:.5rem;min-height:1em;"></p>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let ME=null, MODE="upload", DATA={videos:[],top:[]};
    const $=(id)=>document.getElementById(id);
    const esc=(s)=>(s||"").replace(/</g,"&lt;");
    const enc=encodeURIComponent;

    /* ---------- helpers ---------- */
    function ytId(url){ const m=(url||"").match(/embed\/([A-Za-z0-9_-]+)/); return m?m[1]:""; }
    function thumb(v){
      if(v.kind==="youtube"){ const id=ytId(v.url);
        return `<img class="thumbimg" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" loading="lazy" decoding="async" alt="">`; }
      return `<video class="thumbimg" src="${esc(v.url)}#t=0.5" preload="metadata" muted playsinline></video>`;
    }
    function fmtViews(n){ n=+n||0;
      if(n>=1e6) return (n/1e6).toFixed(n%1e6?1:0).replace(/\.0$/,'')+"M views";
      if(n>=1e3) return (n/1e3).toFixed(n%1e3?1:0).replace(/\.0$/,'')+"K views";
      return n===1?"1 view":n+" views"; }
    function ago(d){ const s=(Date.now()-new Date(d).getTime())/1000;
      const u=[["yr",31536000],["mo",2592000],["d",86400],["h",3600],["min",60]];
      for(const [l,n] of u){ const k=Math.floor(s/n); if(k>=1) return k+" "+l+(k>1&&l!=="min"?"s":(l==="min"&&k>1?"s":""))+" ago"; }
      return "just now"; }

    /* ---------- home ---------- */
    function homeCard(v, featured){
      const name=esc(v.username||"Someone");
      return `<div class="card" onclick="openWatch(${v.id})">
        <div class="thumb">${thumb(v)}<div class="play"><i class="fas fa-play"></i></div>
          ${featured?`<span class="vbadge">🔥 #${featured} most viewed</span>`:''}</div>
        <div class="meta">
          <div class="av" ${avatarStyle(v.avatar)}>${v.avatar?'':name[0].toUpperCase()}</div>
          <div class="mt">
            <div class="ct">${esc(v.title)}</div>
            <div class="cm"><a href="/profile?user=${enc(v.username)}" onclick="event.stopPropagation()">${name}</a>
              · ${fmtViews(v.views)} · ${ago(v.created_at)}</div>
          </div>
        </div>
      </div>`;
    }
    function renderHome(){
      const vids=DATA.videos||[];
      if(!vids.length){ $("stage").innerHTML=`<p class="empty">No videos yet — hit <b>Post a video</b> to share the first! 🎬</p>`; return; }
      const hasTop=(DATA.top||[]).length>0;
      const feat=hasTop?DATA.top:vids.slice(0,3);
      const featIds=new Set(feat.map(v=>v.id));
      const rest=vids.filter(v=>!featIds.has(v.id));
      const featHtml=feat.map((v,i)=>homeCard(v, hasTop?i+1:0)).join("");
      $("stage").innerHTML=`
        <div class="rowhead">${hasTop?'🔥 Most watched':'🎬 Latest'} <span class="sub">${hasTop?'the three most-viewed on Cyvathon':'freshly posted'}</span></div>
        <div class="featured">${featHtml}</div>
        ${rest.length?`<div class="rowhead">📺 More videos</div><div class="grid">${rest.map(v=>homeCard(v,0)).join("")}</div>`:''}`;
    }

    /* ---------- watch ---------- */
    function playerEmbed(v){
      if(v.kind==="file") return `<video src="${esc(v.url)}" controls autoplay playsinline></video>`;
      const sep=v.url.includes("?")?"&":"?";
      return `<iframe src="${esc(v.url)}${sep}autoplay=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    }
    function recCard(v){
      const name=esc(v.username||"Someone");
      return `<div class="rcard" onclick="openWatch(${v.id})">
        <div class="rthumb">${thumb(v)}</div>
        <div class="ri"><div class="rt">${esc(v.title)}</div>
          <div class="rm">${name}<br>${fmtViews(v.views)} · ${ago(v.created_at)}</div></div>
      </div>`;
    }
    async function renderWatch(id){
      $("stage").innerHTML=`<button class="back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back to videos</button>
        <p class="empty">Loading…</p>`;
      let v, comments=[];
      try{ const d=await api("/video/"+id); v=d.video; comments=d.comments||[]; }
      catch(e){ $("stage").innerHTML=`<button class="back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back to videos</button><p class="empty">${esc(e.message)}</p>`; return; }
      countView(id);
      const name=esc(v.username||"Someone");
      const recs=(DATA.videos||[]).filter(x=>x.id!==v.id).slice(0,12);
      $("stage").innerHTML=`
        <button class="back" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back to videos</button>
        <div class="watch">
          <div class="main">
            <div class="player">${playerEmbed(v)}</div>
            <h1 class="wtitle">${esc(v.title)}</h1>
            <div class="wsubrow"><div class="wviews">${fmtViews(v.views)} · ${ago(v.created_at)}</div>
              <button class="vshare" id="vShare" onclick="shareVideo(${v.id})"><i class="fas fa-share"></i> Share${v.shares?` · ${v.shares}`:''}</button></div>
            <div class="wchannel">
              <div class="av" ${avatarStyle(v.avatar)}>${v.avatar?'':name[0].toUpperCase()}</div>
              <div><a href="/profile?user=${enc(v.username)}">${name}</a></div>
            </div>
            ${v.description?`<div class="wdesc">${esc(v.description)}</div>`:''}
            <div class="cwrap">
              <h3><span id="cCount">${comments.length}</span> Comments</h3>
              <div class="cbox">
                <div class="av" ${avatarStyle(window.__meAvatar)}>${(ME||'?')[0].toUpperCase()}</div>
                <input id="cInput" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')sendC(${v.id})">
                <button onclick="sendC(${v.id})">Comment</button>
              </div>
              <div id="cList"></div>
            </div>
          </div>
          <div class="side">
            <h3>Up next</h3>
            <div class="rec">${recs.length?recs.map(recCard).join(""):'<p class="empty" style="padding:1rem">Nothing else yet.</p>'}</div>
          </div>
        </div>`;
      renderComments(comments);
      window.scrollTo({top:0,behavior:"instant"});
    }
    function renderComments(list){
      const box=$("cList"); if(!box) return;
      box.innerHTML = list.length ? list.map(c=>{
        const n=esc(c.username||"?");
        return `<div class="cmt"><div class="av" ${avatarStyle(c.avatar)}>${c.avatar?'':n[0].toUpperCase()}</div>
          <div><div class="cn"><a href="/profile?user=${enc(c.username)}">${n}</a><span class="cd">${ago(c.created_at)}</span></div>
          <div class="ct">${esc(c.body)}</div></div></div>`;
      }).join("") : `<p class="empty" style="text-align:left;padding:.5rem 0">No comments yet — say something.</p>`;
      const cc=$("cCount"); if(cc) cc.textContent=list.length;
    }
    async function sendC(id){
      const inp=$("cInput"); const body=inp.value.trim(); if(!body) return;
      inp.disabled=true;
      try{ await api("/video/"+id+"/comment",{method:"POST",body:JSON.stringify({body})});
        const d=await api("/video/"+id); renderComments(d.comments||[]); inp.value="";
      }catch(e){ alert(e.message); }
      finally{ inp.disabled=false; inp.focus(); }
    }

    async function shareVideo(id){
      const url=location.origin+"/videos?v="+id;
      const btn=$("vShare");
      try{ if(navigator.share){ await navigator.share({title:"A Cyvathon video", url}); }
        else { await navigator.clipboard.writeText(url); if(btn){ const o=btn.innerHTML; btn.innerHTML='<i class="fas fa-check"></i> Copied!'; setTimeout(()=>btn.innerHTML=o,1500); } } }catch{}
      try{ const d=await api("/video/"+id+"/share",{method:"POST",body:"{}"});
        if(d.shares!=null){ const v=(DATA.videos||[]).find(x=>x.id===id); if(v) v.shares=d.shares; } }catch{}
    }
    async function countView(id){
      try{
        const k="vw_"+id;
        if(sessionStorage.getItem(k)) return;         // one view per session per video
        sessionStorage.setItem(k,"1");
        await api("/video/"+id+"/view",{method:"POST",body:"{}"});
        const bump=(arr)=>{ const x=(arr||[]).find(v=>v.id===id); if(x) x.views=(+x.views||0)+1; };
        bump(DATA.videos); bump(DATA.top);
      }catch{}
    }

    /* ---------- routing ---------- */
    function currentV(){ return new URLSearchParams(location.search).get("v"); }
    function route(){ const v=currentV(); if(v && v!=="new" && /^\d+$/.test(v)) renderWatch(+v); else renderHome(); }
    function openWatch(id){ history.pushState({},"", "/videos?v="+id); route(); }
    function goHome(){ history.pushState({},"", "/videos"); renderHome(); window.scrollTo({top:0,behavior:"instant"}); }
    window.addEventListener("popstate", route);

    async function load(){
      $("stage").innerHTML=`<p class="empty">Cueing up the reels…</p>`;
      try{
        const d=await api("/videos_list"); ME=d.me; DATA={videos:d.videos||[], top:d.top||[]};
        route();
      }catch(e){ $("stage").innerHTML=`<p class="empty">${esc(e.message)}</p>`; }
    }

    /* ---------- create modal ---------- */
    function openModal(){ $("modal").classList.add("on"); $("vTitle").focus(); }
    function closeModal(){ $("modal").classList.remove("on"); }
    function setTab(m){
      MODE=m;
      $("tabUpload").classList.toggle("on", m==="upload");
      $("tabLink").classList.toggle("on", m==="link");
      $("paneUpload").style.display = m==="upload" ? "block" : "none";
      $("paneLink").style.display = m==="link" ? "block" : "none";
    }
    function fileChosen(){
      const f=$("vFile").files[0]; if(!f) return;
      const mb=(f.size/1048576).toFixed(1);
      $("drop").classList.add("has");
      $("dropLabel").innerHTML = `<b>${esc(f.name)}</b><br><span style="font-size:.8rem;">${mb} MB — ready to post</span>`;
      if(!$("vTitle").value.trim()) $("vTitle").value = f.name.replace(/\.[^.]+$/,"");
    }
    function resetForm(){
      $("vTitle").value=""; $("vUrl").value=""; $("vDesc").value=""; $("vFile").value="";
      $("drop").classList.remove("has");
      $("dropLabel").innerHTML = `Click to choose a video<br><span style="font-size:.8rem;">mp4 or webm · up to 48 MB</span>`;
      $("vMsg").textContent="";
    }
    async function submitVideo(){
      const title=$("vTitle").value.trim();
      const description=$("vDesc").value.trim();
      const msg=$("vMsg");
      const fail=(m)=>{ msg.style.color="var(--red)"; msg.textContent=m; };
      if(!title){ fail("Add a title."); return; }
      $("vPostBtn").disabled=true;
      try{
        if(MODE==="upload"){
          const f=$("vFile").files[0];
          if(!f){ fail("Choose a video file."); $("vPostBtn").disabled=false; return; }
          msg.style.color="var(--muted)"; msg.textContent="Uploading… this can take a moment.";
          const fd=new FormData(); fd.append("file",f); fd.append("title",title); fd.append("description",description);
          const r=await fetch("/video/upload",{method:"POST",credentials:"include",body:fd});
          let d; try{ d=await r.json(); }catch{ throw new Error(r.status===413?"That file is too large (max 48 MB).":"Upload failed ("+r.status+")."); }
          if(!r.ok||d.success===false) throw new Error(d.error||"Upload failed");
        }else{
          const url=$("vUrl").value.trim();
          if(!url){ fail("Paste a video link."); $("vPostBtn").disabled=false; return; }
          await api("/videos",{method:"POST",body:JSON.stringify({title,url,description})});
        }
        closeModal(); resetForm(); goHome(); load();
      }catch(e){ fail(e.message); }
      finally{ $("vPostBtn").disabled=false; }
    }

    document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

    (async function(){
      const user=await requireAuth(); if(!user) return;
      ME=user.username; window.__meAvatar=user.avatar; renderNav("/videos", user);
      await load();
      if(currentV()==="new") openModal();
    })();
  </script>
</body>
</html>
