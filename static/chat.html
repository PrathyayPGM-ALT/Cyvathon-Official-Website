<!DOCTYPE html>
<html>
<head>
    <title>Cyvathon Chat</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;

            /* Make body take 100% height */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        #header {
            padding: 15px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            background: #050505;
            box-shadow: 0 0 15px rgba(0, 140, 255, 0.5);
        }

        /* CHAT AREA – takes ALL free space */
        #chat-section {
            flex: 1; /* expand to full height */
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            background: #111;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            font-size: 18px;
        }

        #message-bar {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        #msg {
            flex: 1;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #444;
            background: #222;
            color: white;
            border-radius: 8px;
        }

        button {
            padding: 14px 20px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            background: #3b82f6;
            color: white;
            cursor: pointer;
        }

        /* LOGIN PAGE */
        #login-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #login-section input {
            padding: 14px;
            width: 300px;
            font-size: 18px;
            border-radius: 8px;
            background: #222;
            border: 1px solid #444;
            color: white;
        }
    </style>
</head>
<body>

<div id="header">Cyvathon Chat</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <button onclick="chatLogin()">Login</button>
    <button onclick="chatRegister()">Register</button>

    <p id="login-status"></p>
</div>

<!-- CHAT -->
<div id="chat-section" style="display:none;">
    <button onclick="chatLogout()" style="align-self:flex-start; margin-bottom:10px;">Logout</button>

    <div id="chat-box"></div>

    <div id="message-bar">
        <input id="msg" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>


<script>
function el(id) {
    return document.getElementById(id);
}

async function chatLogin() {
    let user = el("login-username").value;
    let pass = el("login-password").value;

    let res = await fetch("/chat_login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({username:user, password:pass})
    });

    let data = await res.json();
    if (data.success) {
        el("login-section").style.display="none";
        el("chat-section").style.display="flex";
        loadMessages();
    } else {
        el("login-status").textContent = data.error;
    }
}

async function chatRegister() {
    let user = el("login-username").value;
    let pass = el("login-password").value;

    let res = await fetch("/chat_register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({username:user, password:pass})
    });

    let data = await res.json();
    if (data.success) {
        el("login-section").style.display="none";
        el("chat-section").style.display="flex";
        loadMessages();
    } else {
        el("login-status").textContent = data.error;
    }
}

async function chatLogout() {
    await fetch("/chat_logout", { method:"POST", credentials:"include" });

    el("chat-section").style.display="none";
    el("login-section").style.display="flex";
}

async function sendMessage() {
    let text = el("msg").value.trim();
    if (!text) return;

    await fetch("/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({content:text})
    });

    el("msg").value="";
    loadMessages();
}

async function loadMessages() {
    let res = await fetch("/messages", { credentials:"include" });
    let data = await res.json();
    if (!data.success) return;

    let box = el("chat-box");
    box.innerHTML="";

    data.messages.forEach(m => {
        let div = document.createElement("div");
        div.textContent = `${m.sender}: ${m.content}`;
        div.style.marginBottom = "8px";
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

setInterval(loadMessages, 1500);
</script>

</body>
</html>
