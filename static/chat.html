<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyvathon Chat</title>
    <style>

body {
    margin: 0;
    padding: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;

    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#header {
    padding: 15px;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    background: #050505;
    box-shadow: 0 0 15px rgba(0, 140, 255, 0.4);
}

#login-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

#login-section input {
    padding: 14px;
    width: 300px;
    font-size: 18px;
    border-radius: 8px;
    background: #222;
    border: 1px solid #444;
    color: white;
}

.button-row {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.button-row button {
    width: 130px;
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    border: none;
    cursor: pointer;
}

/* CHAT LAYOUT */
#chat-container {
    flex: 1;
    display: none;
    flex-direction: row;
    overflow: hidden;
}

/* LEFT SIDEBAR */
#sidebar {
    width: 220px;
    background: #0c0c0c;
    border-right: 1px solid #222;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
}

#sidebar button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
}

#sidebar button:hover {
    background: #3b82f6;
}

/* CHAT SECTION */
#chat-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow: hidden;
}

#chat-box {
    flex: 1;
    overflow-y: auto;
    background: #111;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #333;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
}

/* DM CHAT BOX */
#dm-box {
    flex: 1;
    overflow-y: auto;
    background: #111;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #333;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    display: none;
}

#message-bar {
    margin-top: 12px;
    display: flex;
    gap: 10px;
}

#msg, #dm-msg {
    flex: 1;
    padding: 14px;
    font-size: 18px;
    background: #222;
    color: white;
    border-radius: 8px;
    border: 1px solid #444;
}

button {
    padding: 14px 20px;
    font-size: 18px;
    border-radius: 8px;
    background: #3b82f6;
    border: none;
    color: white;
    cursor: pointer;
}

    </style>
</head>
<body>

<div id="header">Cyvathon Chat</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <div class="button-row">
        <button onclick="chatLogin()">Login</button>
        <button onclick="chatRegister()">Register</button>
    </div>

    <p id="login-status"></p>
</div>


<!-- CHAT MAIN CONTAINER -->
<div id="chat-container">
    
    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
        <button onclick="openPublicChat()">🌐 Public Chat</button>
        <hr style="border:1px solid #222; width:100%;">
        <div id="dm-users">
            <p style="opacity:0.6;">DMs:</p>
        </div>
        <button onclick="chatLogout()" style="margin-top:auto; background:#b91c1c;">Logout</button>
    </div>

    <!-- RIGHT CHAT AREA -->
    <div id="chat-section">

        <!-- Public Chat -->
        <div id="chat-box"></div>

        <!-- DM Chat -->
        <div id="dm-box"></div>

        <!-- Input -->
        <div id="message-bar">
            <input id="msg" placeholder="Type message...">
            <input id="dm-msg" placeholder="Send DM..." style="display:none;">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>
</div>


<script>
let messageInterval = null;
let dmInterval = null;
let currentDM = null;

function el(id) { return document.getElementById(id); }

// ------------------------- LOGIN -------------------------
async function chatLogin() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({username:user, password:pass})
    });

    let data = await res.json();
    if (data.success) {
        el("login-section").style.display = "none";
        el("chat-container").style.display = "flex";
        loadDMUsers();
        openPublicChat();
    } else {
        el("login-status").textContent = data.error;
    }
}

// ------------------------- REGISTER -------------------------
async function chatRegister() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({username:user, password:pass})
    });

    let data = await res.json();
    if (data.success) {
        el("login-section").style.display = "none";
        el("chat-container").style.display = "flex";
        loadDMUsers();
        openPublicChat();
    } else {
        el("login-status").textContent = data.error;
    }
}

// ------------------------- LOGOUT -------------------------
async function chatLogout() {
    await fetch("/chat_logout", { method:"POST", credentials:"include" });
    el("chat-container").style.display = "none";
    el("login-section").style.display = "flex";

    clearInterval(messageInterval);
    clearInterval(dmInterval);
}

// ------------------------- PUBLIC CHAT -------------------------
async function sendPublicMessage(text) {
    await fetch("/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        credentials:"include",
        body:JSON.stringify({content:text})
    });
}

async function loadPublic() {
    let res = await fetch("/messages", {credentials:"include"});
    let data = await res.json();
    let box = el("chat-box");
    box.innerHTML = "";
    data.messages.forEach(m => {
        let div = document.createElement("div");
        div.textContent = `${m.sender}: ${m.content}`;
        div.style.marginBottom = "8px";
        box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
}

function openPublicChat() {
    currentDM = null;
    el("chat-box").style.display = "block";
    el("dm-box").style.display = "none";
    el("msg").style.display = "block";
    el("dm-msg").style.display = "none";

    sendMessage = sendPublic; // override

    clearInterval(dmInterval);
    messageInterval = setInterval(loadPublic, 1000);
    loadPublic();
}

function sendPublic() {
    let text = el("msg").value.trim();
    if (!text) return;
    sendPublicMessage(text);
    el("msg").value = "";
}

// ------------------------- DMs -------------------------
async function loadDMUsers() {
    let res = await fetch("/dm_users", {credentials:"include"});
    let data = await res.json();

    let container = el("dm-users");
    container.innerHTML = "<p style='opacity:0.6;'>DMs:</p>";

    data.users.forEach(u => {
        let btn = document.createElement("button");
        btn.textContent = u;
        btn.onclick = () => openDM(u);
        container.appendChild(btn);
    });
}

async function loadDM() {
    if (!currentDM) return;

    let res = await fetch(`/dm_get?user=${currentDM}`, {credentials:"include"});
    let data = await res.json();

    let box = el("dm-box");
    box.innerHTML = "";

    data.messages.forEach(m => {
        let div = document.createElement("div");
        div.style.marginBottom = "8px";

        if (m.sender === currentDM) {
            div.style.color = "#3b82f6";
        }

        div.textContent = `${m.sender}: ${m.content}`;
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

function openDM(username) {
    currentDM = username;

    el("chat-box").style.display = "none";
    el("dm-box").style.display = "block";
    el("msg").style.display = "none";
    el("dm-msg").style.display = "block";

    sendMessage = sendDM;

    clearInterval(messageInterval);
    dmInterval = setInterval(loadDM, 1000);
    loadDM();
}

async function sendDM() {
    let text = el("dm-msg").value.trim();
    if (!text) return;

    await fetch("/dm_send", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        credentials:"include",
        body:JSON.stringify({recipient: currentDM, content: text})
    });

    el("dm-msg").value="";
    loadDM();
}

</script>

</body>
</html>
