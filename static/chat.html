<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat · Cyvathon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    html,body{ height:100%; }
    body{ display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
    .mode-tabs{ display:flex; justify-content:center; gap:.35rem; padding:.5rem; background:var(--bg-soft);
      border-bottom:1px solid var(--panel-border); flex-shrink:0; }
    .mode-tabs a{ display:inline-flex; align-items:center; gap:.45rem; text-decoration:none; padding:.4rem 1.15rem;
      border-radius:999px; color:var(--muted); font-weight:600; font-size:.9rem; transition:.15s; }
    .mode-tabs a:hover{ color:var(--text); }
    .mode-tabs a.on{ background:linear-gradient(135deg,#5ec5ff,#3aa0ee); color:#04223b; }
    .mail-badge{ min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:var(--red); color:#fff;
      font-size:.66rem; font-weight:800; display:none; align-items:center; justify-content:center; }
    .mail-badge.show{ display:inline-flex; }
    .shell{ flex:1; display:grid; grid-template-columns:290px 1fr; min-height:0; }

    /* sidebar */
    .side{ border-right:1px solid var(--panel-border); display:flex; flex-direction:column; min-height:0; background:var(--bg-soft); }
    .side .top{ padding:.9rem .9rem .5rem; }
    .side .srch{ margin:0; padding:.6rem .9rem; border-radius:22px; }
    .side .scroll{ overflow-y:auto; flex:1; padding:.3rem .5rem 1rem; }
    .side h4{ color:var(--muted); font-size:.66rem; text-transform:uppercase; letter-spacing:1.3px; margin:1rem .6rem .3rem; display:flex; justify-content:space-between; align-items:center; }
    .side h4 .add{ cursor:pointer; color:var(--accent); }
    .row{ display:flex; align-items:center; gap:.65rem; padding:.5rem .6rem; border-radius:10px; cursor:pointer; transition:.12s; }
    .row:hover{ background:rgba(88,196,255,.08); }
    .row.active{ background:rgba(88,196,255,.15); }
    .av{ width:36px; height:36px; min-width:36px; aspect-ratio:1/1; border-radius:50%; flex:0 0 36px;
      display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:.85rem; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .av.g{ background:linear-gradient(135deg,#3a5772,#26384a); color:#dbe6f2; }
    .row .nm{ font-weight:600; font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row .rl{ font-size:.72rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row .txt{ min-width:0; }

    /* conversation */
    .main{ display:flex; flex-direction:column; min-height:0; }
    .chead{ display:flex; align-items:center; gap:.7rem; padding:.8rem 1.1rem; border-bottom:1px solid var(--panel-border); background:var(--bg-soft); }
    .chead .back{ display:none; background:none; border:none; color:var(--accent); width:auto; padding:0; margin:0; font-size:1.1rem; }
    .chead h3{ margin:0; font-size:1.05rem; } .chead .sub{ font-size:.76rem; color:var(--muted); }
    .chead .spacer{ flex:1; }
    .chead .act{ width:auto; margin:0; padding:.4rem .8rem; font-size:.8rem; }

    .feed{ flex:1; overflow-y:auto; padding:1.1rem 1.2rem; display:flex; flex-direction:column; gap:.8rem; }
    .empty{ margin:auto; text-align:center; color:var(--muted); }
    .empty i{ font-size:2.4rem; color:var(--accent); opacity:.6; }

    .grp{ display:flex; gap:.6rem; align-items:flex-start; max-width:78%; }
    .grp.me{ flex-direction:row-reverse; align-self:flex-end; }
    .grp .gav{ width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:.8rem; color:#dbe6f2; background:linear-gradient(135deg,#3a5772,#26384a); }
    .grp.me .gav{ color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .grp .body{ display:flex; flex-direction:column; gap:.18rem; min-width:0; }
    .grp.me .body{ align-items:flex-end; }
    .meta{ font-size:.72rem; color:var(--muted); padding:0 .3rem; }
    .meta a{ color:var(--accent); font-weight:600; } .meta .t{ margin-left:.35rem; opacity:.7; }
    .bubble{ background:#1b232e; border:1px solid #2a3340; padding:.5rem .8rem; border-radius:15px;
      word-wrap:break-word; overflow-wrap:anywhere; max-width:100%; line-height:1.45; animation:pop .19s cubic-bezier(.2,.9,.3,1.3) both; }
    .grp.me .bubble{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#06223a; border:none; }
    .grp.me .bubble .mention{ background:rgba(4,34,59,.16); color:#053b5e; }
    html[data-theme="light"] .bubble{ background:#eef2f8; border-color:#d8e0ec; color:#12243d; }
    .mention-pop{ padding:.3rem; max-height:230px; overflow-y:auto; }
    .mrow{ display:flex; align-items:center; gap:.6rem; padding:.42rem .5rem; border-radius:8px; cursor:pointer; }
    .mrow.sel,.mrow:hover{ background:rgba(88,196,255,.14); }
    .mrow .mav{ width:28px; height:28px; min-width:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:.72rem; color:#06223a; background:linear-gradient(135deg,var(--accent),var(--accent2)); }
    .mrow .mn{ font-weight:600; font-size:.9rem; } .mrow .mr{ font-size:.72rem; color:var(--muted); }
    @keyframes pop{ from{ transform:translateY(8px) scale(.94); opacity:0; } to{ transform:none; opacity:1; } }
    .chat-img{ max-width:250px; max-height:250px; border-radius:10px; display:block; }
    .status{ font-size:.64rem; margin-left:.4rem; opacity:.75; }
    .status .fail{ color:var(--red); cursor:pointer; }
    .bubble.sending{ opacity:.72; }

    /* composer */
    .comp-wrap{ padding:.55rem .9rem .8rem; border-top:1px solid var(--panel-border); position:relative; background:var(--bg-soft); }
    .pop-panel{ position:absolute; bottom:100%; left:.9rem; right:.9rem; margin-bottom:.4rem; background:#0e1320;
      border:1px solid var(--panel-border); border-radius:14px; box-shadow:var(--shadow); display:none; z-index:40; }
    .pop-panel.open{ display:block; }
    .emoji-pop{ flex-wrap:wrap; gap:.1rem; padding:.5rem; max-height:180px; overflow-y:auto; }
    .emoji-pop.open{ display:flex; }
    .emoji-pop span{ cursor:pointer; font-size:1.35rem; padding:.15rem .3rem; border-radius:7px; }
    .emoji-pop span:hover{ background:rgba(88,196,255,.15); }
    .gif-pop{ padding:.6rem; }
    .gif-pop input{ margin:0 0 .5rem; }
    .gif-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:.35rem; max-height:260px; overflow-y:auto; }
    .gif-grid img{ width:100%; height:90px; object-fit:cover; border-radius:8px; cursor:pointer; background:#0a0d14; }
    .gif-grid img:hover{ outline:2px solid var(--accent); }
    .tools{ display:flex; gap:.25rem; margin-bottom:.45rem; align-items:center; }
    .tools button{ width:34px; height:34px; padding:0; margin:0; border-radius:8px; font-size:.9rem;
      background:var(--panel); color:var(--muted); border:1px solid var(--panel-border); box-shadow:none; }
    .tools button:hover{ border-color:var(--accent); color:var(--accent); transform:none; }
    .composer{ display:flex; gap:.5rem; align-items:flex-end; }
    .composer textarea{ flex:1; margin:0; border-radius:20px; padding:.65rem 1.05rem; resize:none; max-height:130px; min-height:44px; line-height:1.4; }
    .composer .send{ width:46px; height:46px; flex-shrink:0; border-radius:50%; margin:0; padding:0; }
    .uploading{ font-size:.75rem; color:var(--accent); padding:.2rem .3rem; }

    /* reply / quote */
    .bubble{ position:relative; }
    .replybtn{ position:absolute; top:-9px; right:-9px; width:24px; height:24px; border-radius:50%; display:none;
      align-items:center; justify-content:center; background:var(--bg-soft); border:1px solid var(--panel-border);
      color:var(--muted); cursor:pointer; font-size:.68rem; z-index:2; }
    .grp.me .replybtn{ right:auto; left:-9px; }
    .bubble:hover .replybtn{ display:flex; }
    .replybtn:hover{ color:var(--accent); border-color:var(--accent); }
    .quote{ border-left:3px solid var(--accent); background:rgba(88,196,255,.09); padding:.28rem .55rem;
      border-radius:0 7px 7px 0; margin-bottom:.4rem; font-size:.82rem; cursor:pointer; }
    .grp.me .quote{ background:rgba(4,34,59,.14); border-left-color:#053b5e; }
    .quote b{ display:block; font-size:.72rem; opacity:.95; }
    .quote .qt{ opacity:.75; }
    .bubble.flash{ outline:2px solid var(--accent); outline-offset:1px; }
    .reply-bar{ display:none; align-items:center; gap:.55rem; padding:.4rem .7rem; margin-bottom:.45rem;
      background:var(--panel); border:1px solid var(--panel-border); border-left:3px solid var(--accent);
      border-radius:8px; font-size:.82rem; }
    .reply-bar.open{ display:flex; }
    .reply-bar span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .reply-bar .x{ margin-left:auto; cursor:pointer; color:var(--muted); flex-shrink:0; }
    .reply-bar .x:hover{ color:var(--red); }

    /* presence + typing */
    .pdot{ width:9px; height:9px; border-radius:50%; background:transparent; margin-left:auto; flex-shrink:0; }
    .pdot.on{ background:var(--green); box-shadow:0 0 6px rgba(31,214,166,.7); }
    .hdot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); margin-right:.4rem; vertical-align:middle; }
    .hdot.on{ background:var(--green); box-shadow:0 0 6px rgba(31,214,166,.7); }
    .typing-row{ height:0; overflow:hidden; transition:height .12s; font-size:.78rem; color:var(--muted);
      font-style:italic; padding:0 1.2rem; }
    .typing-row.show{ height:20px; padding:.05rem 1.2rem; }

    /* voice messages */
    .voice-msg{ height:40px; max-width:min(260px,100%); vertical-align:middle; margin:.15rem 0; }
    .rec-bar{ display:none; align-items:center; gap:.7rem; padding:.55rem 1rem; }
    .rec-bar.show{ display:flex; }
    .rec-dot{ width:11px; height:11px; border-radius:50%; background:var(--red); animation:recPulse 1s infinite; flex-shrink:0; }
    @keyframes recPulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.35; transform:scale(.85); } }
    #recTime{ font-variant-numeric:tabular-nums; color:var(--text); font-weight:700; }
    .rec-hint{ font-size:.78rem; color:var(--muted); }
    .rec-bar button{ margin:0; width:auto; padding:.42rem .8rem; border-radius:10px; }
    .rec-cancel{ background:var(--panel-2); color:var(--red); border:1px solid var(--panel-border); }
    .rec-send{ background:linear-gradient(135deg,#5ec5ff,#3aa0ee); color:#04223b; border:none; margin-left:auto; }
    #micBtn.recording{ color:var(--red); }

    /* reactions */
    .reactbtn{ position:absolute; top:-9px; right:22px; width:24px; height:24px; border-radius:50%; display:none;
      align-items:center; justify-content:center; background:var(--bg-soft); border:1px solid var(--panel-border);
      color:var(--muted); cursor:pointer; font-size:.68rem; z-index:2; }
    .grp.me .reactbtn{ right:auto; left:22px; }
    .bubble:hover .reactbtn{ display:flex; }
    .reactbtn:hover{ color:var(--gold); border-color:var(--gold); }
    .reacts{ display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.4rem; }
    .reacts:empty{ display:none; }
    .chip{ font-size:.78rem; background:var(--panel-2); border:1px solid var(--panel-border); border-radius:20px;
      padding:.05rem .55rem; cursor:pointer; user-select:none; transition:.12s; }
    .chip:hover{ border-color:var(--accent); }
    .chip.mine{ background:rgba(88,196,255,.2); border-color:rgba(88,196,255,.55); color:var(--accent); }
    .grp.me .chip{ background:rgba(4,34,59,.18); color:#04314f; border-color:rgba(4,34,59,.25); }
    .grp.me .chip.mine{ background:rgba(4,34,59,.32); }
    .react-picker{ position:fixed; display:none; gap:.15rem; background:#0e1320; border:1px solid var(--panel-border);
      border-radius:24px; padding:.3rem .5rem; box-shadow:var(--shadow); z-index:9998; }
    .react-picker.open{ display:flex; }
    .react-picker span{ cursor:pointer; font-size:1.3rem; padding:.1rem .28rem; border-radius:8px; transition:.1s; }
    .react-picker span:hover{ background:rgba(88,196,255,.15); transform:scale(1.2); }

    /* modal */
    .modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:200; }
    .modal.open{ display:flex; }
    .modal .box{ width:min(420px,92vw); max-height:80vh; overflow-y:auto; background:var(--bg-soft);
      border:1px solid var(--panel-border); border-radius:16px; padding:1.4rem; }
    .pick{ display:flex; align-items:center; gap:.6rem; padding:.4rem .5rem; border-radius:8px; cursor:pointer; }
    .pick:hover{ background:rgba(88,196,255,.08); }
    .pick input{ width:auto; margin:0; }

    @media(max-width:760px){
      .shell{ grid-template-columns:1fr; }
      .side{ display:flex; } .shell.showmain .side{ display:none; }
      .main{ display:none; } .shell.showmain .main{ display:flex; }
      .chead .back{ display:inline-block; }
    }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="mode-tabs">
    <a href="/chat" class="on"><i class="fas fa-comments"></i> Chat</a>
    <a href="/mail"><i class="fas fa-envelope"></i> Mail <span class="mail-badge" id="mailBadge"></span></a>
  </div>

  <div class="shell" id="shell">
    <div class="side">
      <div class="top"><input class="srch" id="search" placeholder="Search people…" oninput="renderSide()"></div>
      <div class="scroll" id="sideList"></div>
    </div>

    <div class="main">
      <div class="chead">
        <button class="back" onclick="showList()"><i class="fas fa-arrow-left"></i></button>
        <div class="av" id="cIcon"><i class="fa-solid fa-landmark"></i></div>
        <div class="txt"><h3 id="cTitle">Public Square</h3><div class="sub" id="cSub">Everyone in Cyvathon</div></div>
        <div class="spacer"></div>
        <span id="cAct"></span>
      </div>

      <div class="feed" id="feed"></div>
      <div class="typing-row" id="typingRow"></div>

      <div class="comp-wrap">
        <div class="reply-bar" id="replyBar"></div>
        <div class="pop-panel mention-pop" id="mentionPop"></div>
        <div class="pop-panel emoji-pop" id="emojiPop"></div>
        <div class="pop-panel gif-pop" id="gifPop">
          <input id="gifSearch" placeholder="Search GIFs…" oninput="gifSearchDebounced()">
          <div class="gif-grid" id="gifGrid"></div>
          <div style="display:flex;gap:.4rem;margin-top:.5rem;">
            <input id="gifUrl" placeholder="…or paste a GIF / image URL" style="margin:0;flex:1;">
            <button style="width:auto;margin:0;padding:.5rem .9rem;" onclick="sendGifUrl()">Add</button>
          </div>
        </div>
        <div class="tools">
          <button title="Bold" onclick="wrap('**','**')"><b>B</b></button>
          <button title="Italic" onclick="wrap('*','*')"><i>I</i></button>
          <button title="Underline" onclick="wrap('__','__')"><u>U</u></button>
          <button title="Emoji" onclick="togglePanel('emojiPop')">😀</button>
          <button title="GIF" onclick="togglePanel('gifPop')"><b style="font-size:.7rem">GIF</b></button>
          <button title="Upload image" onclick="document.getElementById('fileIn').click()"><i class="fas fa-image"></i></button>
          <button title="Voice message" id="micBtn" onclick="toggleRecord()"><i class="fas fa-microphone"></i></button>
          <span class="uploading" id="upStatus"></span>
          <input type="file" id="fileIn" accept="image/*" style="display:none" onchange="onFile(this)">
        </div>
        <div class="rec-bar" id="recBar">
          <span class="rec-dot"></span><span id="recTime">0:00</span>
          <span class="rec-hint">Recording…</span>
          <button class="rec-cancel" onclick="cancelRecord()" title="Discard"><i class="fas fa-trash"></i></button>
          <button class="rec-send" onclick="stopAndSend()" title="Send"><i class="fas fa-paper-plane"></i> Send</button>
        </div>
        <div class="composer">
          <textarea id="msg" rows="1" placeholder="Write a message…  (Shift+Enter for new line)"></textarea>
          <button class="send" onclick="sendInput()" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
  </div>

  <!-- member picker modal -->
  <div class="modal" id="modal">
    <div class="box">
      <h3 id="modalTitle" style="margin-bottom:.6rem;">New Group</h3>
      <input id="grpName" placeholder="Group name" style="margin-bottom:.4rem;">
      <p class="small" style="margin:.2rem 0;">Choose who to add:</p>
      <div id="pickList" style="max-height:40vh;overflow-y:auto;"></div>
      <div class="row" style="gap:.6rem;margin-top:1rem;padding:0;">
        <button onclick="submitModal()" id="modalOk">Create</button>
        <button class="ghost" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let ME=null, ADMIN=false, channel={type:"public"}, groups=[], citizens=[];
    let lastId=0, poll=null, _lastSender=null, _lastBody=null, pending=[], tmpc=0;
    let mention={open:false,start:0,items:[],idx:0};
    let replyTo=null, onlineSet=new Set(), lastTyping=0, AVATARS={};
    const esc=(s)=>(s||"").replace(/</g,"&lt;");
    const tm=(iso)=>{ try{ return iso?new Date(iso).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):""; }catch{ return ""; } };
    const EMOJIS="😀 😂 😍 😎 😭 😡 👍 👎 🙏 🔥 🎉 💀 🤖 👑 ⚖️ 💰 🦉 🚀 ❤️ ✅ ❌ 🤔 😱 🫡 🐐 🎂 🍕 ⚽ 🎮 💡 😅 🥳 😴 🤝 ✨ 🫶 😤 🤯 🙌 💯".split(" ");

    /* ---------------- SIDEBAR ---------------- */
    function renderSide(){
      const q=(document.getElementById("search").value||"").toLowerCase();
      const el=document.getElementById("sideList");
      const active=(t,id)=> (channel.type===t && (id===undefined||channel.id===id||channel.name===id)) ? "active":"";
      let html=`<div class="row ${active('public')}" onclick="openPublic()">
        <div class="av g"><i class="fa-solid fa-landmark"></i></div>
        <div class="txt"><div class="nm">Public Square</div><div class="rl">Everyone in Cyvathon</div></div></div>`;

      html+=`<h4>Groups & Channels <span class="add" title="New group" onclick="openGroupModal(event)"><i class="fas fa-plus"></i></span></h4>`;
      const gs=groups.filter(g=>g.name.toLowerCase().includes(q));
      html+= gs.length ? gs.map(g=>`<div class="row ${active('group',g.id)}" onclick="openGroup(${g.id})">
        <div class="av g">${esc(g.name[0].toUpperCase())}</div>
        <div class="txt"><div class="nm">${esc(g.name)}</div><div class="rl">${g.members.length} member${g.members.length===1?"":"s"}</div></div></div>`).join("")
        : `<p class="small muted" style="padding:.2rem .6rem;">No groups yet.</p>`;

      html+=`<h4>Direct Messages</h4>`;
      const cs=citizens.filter(c=>c.username!==ME && c.username.toLowerCase().includes(q));
      html+= cs.length ? cs.map(c=>`<div class="row ${active('dm',c.username)}" onclick="openDM('${encodeURIComponent(c.username)}')">
        <div class="av" ${avatarStyle(c.avatar)}>${c.avatar?'':esc(c.username[0].toUpperCase())}</div>
        <div class="txt"><div class="nm">${esc(c.username)}</div><div class="rl">${esc(c.company||c.designation||'Citizen')}</div></div>
        <span class="pdot" data-u="${esc(c.username)}"></span></div>`).join("")
        : `<p class="small muted" style="padding:.2rem .6rem;">No citizens found.</p>`;
      el.innerHTML=html;
      applyPresence();
    }
    function applyPresence(){
      document.querySelectorAll(".pdot").forEach(d=>d.classList.toggle("on", onlineSet.has(d.dataset.u)));
      updateHeaderPresence();
    }
    function updateHeaderPresence(){
      if(!channel || channel.type!=="dm") return;
      const on=onlineSet.has(channel.name);
      const sub=document.getElementById("cSub");
      if(sub) sub.innerHTML=`<span class="hdot ${on?'on':''}"></span>${on?'Online':'Offline'}`;
    }

    /* ---------------- CHANNEL SWITCHING ---------------- */
    function setHeader(iconHtml,iconGray,title,sub,actHtml){
      const ic=document.getElementById("cIcon");
      ic.className="av"+(iconGray?" g":""); ic.innerHTML=iconHtml;
      document.getElementById("cTitle").textContent=title;
      document.getElementById("cSub").textContent=sub;
      document.getElementById("cAct").innerHTML=actHtml||"";
    }
    function switchTo(ch){
      channel=ch; lastId=0; _lastSender=null; _lastBody=null; pending=[]; cancelReply();
      document.getElementById("feed").innerHTML="";
      document.getElementById("typingRow").classList.remove("show");
      document.getElementById("shell").classList.add("showmain");
      closePanels(); renderSide(); loadNew(true).then(refreshReactions); refreshTyping();
      if(poll) clearInterval(poll); poll=setInterval(()=>{ loadNew(false); refreshTyping(); refreshReactions(); },2500);
    }
    function showList(){ document.getElementById("shell").classList.remove("showmain"); }

    function openPublic(){
      const act = ADMIN ? `<button class="danger act" onclick="purge()"><i class="fas fa-trash"></i> Clear all</button>` : "";
      setHeader('<i class="fa-solid fa-landmark"></i>', true, "Public Square", "Everyone in Cyvathon", act);
      switchTo({type:"public"});
    }
    function openGroup(id){
      const g=groups.find(x=>x.id===id); if(!g) return;
      setHeader(esc(g.name[0].toUpperCase()), true, g.name, `${g.members.length} member${g.members.length===1?"":"s"}`,
        `<button class="ghost act" onclick="openAddModal(${id})"><i class="fas fa-user-plus"></i> Add</button>`);
      switchTo({type:"group",id});
    }
    function openDM(enc){
      const name=decodeURIComponent(enc); if(name===ME){ location.href="/profile"; return; }
      setHeader(esc(name[0].toUpperCase()), false, name, "Direct message",
        `<a class="link act" href="/profile?user=${encodeURIComponent(name)}"><i class="fas fa-id-card"></i> View profile</a>`);
      switchTo({type:"dm",name});
      updateHeaderPresence();
    }

    /* ---------------- FEED ---------------- */
    function getUrl(since){
      let base = channel.type==="public" ? "/messages"
        : channel.type==="group" ? `/groups/${channel.id}/messages`
        : `/dm/${encodeURIComponent(channel.name)}`;
      return base + (since?`?since_id=${since}`:"");
    }
    function bubbleBlock(sender){
      const box=document.getElementById("feed");
      const ph=box.querySelector(".empty"); if(ph) ph.remove();
      const mine=sender===ME;
      if(sender!==_lastSender || !_lastBody){
        const grp=document.createElement("div");
        grp.className="grp"+(mine?" me":"");
        grp.innerHTML=`<div class="gav" ${avatarStyle(AVATARS[sender])}>${AVATARS[sender]?'':esc((sender||"?")[0].toUpperCase())}</div><div class="body">
          <div class="meta">${mine?"You":userLink(sender)}</div></div>`;
        box.appendChild(grp);
        _lastBody=grp.querySelector(".body"); _lastSender=sender;
      }
      return _lastBody;
    }
    function addBubble(m,opts){
      opts=opts||{};
      const body=bubbleBlock(m.sender);
      const b=document.createElement("div");
      b.className="bubble"+(opts.pending?" sending":"");
      b.dataset.mid=m.id||"";
      b._msg={id:m.id, sender:m.sender, text:m.content};
      const quote = m.reply_to
        ? `<div class="quote" onclick="jumpTo(${m.reply_to})"><b>${esc(m.reply_sender||'')}</b><span class="qt">${esc((m.reply_text||'').slice(0,120))}</span></div>` : "";
      const status = m.sender===ME
        ? `<span class="status">${opts.pending?'<i class="fas fa-clock"></i>':'<i class="fas fa-check"></i>'}</span>` : "";
      b.innerHTML=quote+renderRich(m.content)+status
        +`<div class="reacts"></div>`
        +`<span class="replybtn" title="Reply" onclick="startReplyEl(this)"><i class="fas fa-reply"></i></span>`
        +`<span class="reactbtn" title="React" onclick="openReactPicker(this)"><i class="fas fa-face-smile"></i></span>`;
      body.appendChild(b);
      scrollDown(true);
      return b;
    }
    function jumpTo(id){
      const b=document.querySelector('.bubble[data-mid="'+id+'"]');
      if(b){ b.scrollIntoView({behavior:"smooth",block:"center"}); b.classList.add("flash"); setTimeout(()=>b.classList.remove("flash"),1200); }
    }
    function scrollDown(force){
      const box=document.getElementById("feed");
      if(force || box.scrollHeight-box.scrollTop-box.clientHeight<150) box.scrollTop=box.scrollHeight;
    }

    async function loadNew(full){
      const box=document.getElementById("feed");
      if(full){ box.innerHTML=""; lastId=0; _lastSender=null; _lastBody=null; }
      try{
        const d=await api(getUrl(lastId));
        let added=false;
        (d.messages||[]).forEach(m=>{
          if(m.id<=lastId) return;
          lastId=Math.max(lastId,m.id);
          // reconcile my own optimistic bubble if it matches
          if(m.sender===ME){
            const i=pending.findIndex(p=>p.content===m.content);
            if(i>=0){ markSent(pending[i].el,m); pending.splice(i,1); added=true; return; }
          }
          addBubble(m); added=true;
        });
        if(full && !added) box.innerHTML=`<div class="empty"><i class="fa-regular fa-comments"></i><p style="margin-top:.6rem;">No messages yet — say hi! 👋</p></div>`;
      }catch(e){ if(/not in this group|logged in/i.test(e.message)) openPublic(); }
    }

    /* ---------------- SENDING (optimistic) ---------------- */
    function markSent(el,m){
      el.classList.remove("sending");
      const s=el.querySelector(".status"); if(s) s.innerHTML='<i class="fas fa-check"></i>';
      if(m&&m.id){ lastId=Math.max(lastId,m.id); el.dataset.mid=m.id; if(el._msg) el._msg.id=m.id; }
    }
    function markFail(el,content){
      el.classList.remove("sending");
      const s=el.querySelector(".status");
      if(s) s.innerHTML=`<span class="fail" title="Retry" onclick="retry(this,'${btoa(unescape(encodeURIComponent(content)))}')"><i class="fas fa-triangle-exclamation"></i></span>`;
    }
    window.retry=function(elp,b64){ const c=decodeURIComponent(escape(atob(b64))); elp.closest(".bubble").remove(); doSend(c); };

    function postMessage(content,r){
      const body={content};
      if(r){ body.reply_to=r.id; body.reply_sender=r.sender; body.reply_text=r.text; }
      if(channel.type==="public") return api("/messages",{method:"POST",body:JSON.stringify(body)});
      if(channel.type==="group") return api(`/groups/${channel.id}/messages`,{method:"POST",body:JSON.stringify(body)});
      body.to=channel.name; return api("/dm",{method:"POST",body:JSON.stringify(body)});
    }
    function doSend(content){
      const r=replyTo; cancelReply();
      const m={sender:ME,content};
      if(r){ m.reply_to=r.id; m.reply_sender=r.sender; m.reply_text=r.text; }
      const el=addBubble(m,{pending:true});   // show instantly
      const rec={content,el}; pending.push(rec);
      postMessage(content,r).then(res=>{
        const i=pending.indexOf(rec); if(i>=0) pending.splice(i,1);
        markSent(el,res&&res.message);
      }).catch(err=>{
        const i=pending.indexOf(rec); if(i>=0) pending.splice(i,1);
        markFail(el,content);
      });
    }
    function sendInput(){
      const t=document.getElementById("msg"); const v=t.value.trim(); if(!v) return;
      t.value=""; autogrow(t); closePanels(); closeMention(); doSend(v);
    }

    /* ---------------- REPLY / QUOTE ---------------- */
    function startReplyEl(btn){ const b=btn.closest(".bubble"); if(b && b._msg) startReply(b._msg); }
    function startReply(m){
      replyTo={ id:m.id, sender:m.sender, text:(m.text||"").replace(/\s+/g," ").trim().slice(0,120) };
      const bar=document.getElementById("replyBar");
      bar.innerHTML=`<i class="fas fa-reply" style="color:var(--accent)"></i>
        <span>Replying to <b>${esc(m.sender)}</b>${replyTo.text?": "+esc(replyTo.text):""}</span>
        <span class="x" onclick="cancelReply()"><i class="fas fa-xmark"></i></span>`;
      bar.classList.add("open");
      document.getElementById("msg").focus();
    }
    function cancelReply(){ replyTo=null; const b=document.getElementById("replyBar"); if(b) b.classList.remove("open"); }

    /* ---------------- REACTIONS ---------------- */
    const REACT_SET=["👍","❤️","😂","🔥","🎉","😮","😢","👀"];
    function renderReacts(el, list){
      if(!el) return;
      el.innerHTML=(list||[]).map(r=>`<span class="chip ${r.mine?'mine':''}" onclick="reactChip(this,'${r.emoji}')">${r.emoji} ${r.count}</span>`).join("");
    }
    function reactChip(el, emoji){ const b=el.closest(".bubble"); if(b&&b.dataset.mid) react(b.dataset.mid, emoji); }
    async function react(mid, emoji){
      try{
        const d=await api(`/messages/${mid}/react`,{method:"POST",body:JSON.stringify({emoji})});
        const b=document.querySelector(`#feed .bubble[data-mid="${mid}"]`);
        if(b) renderReacts(b.querySelector(".reacts"), d.reactions);
      }catch(e){}
    }
    function openReactPicker(btn){
      const b=btn.closest(".bubble"); if(!b||!b.dataset.mid) return;
      let p=document.getElementById("reactPicker");
      if(!p){ p=document.createElement("div"); p.id="reactPicker"; p.className="react-picker"; document.body.appendChild(p); }
      p.innerHTML=REACT_SET.map(e=>`<span onclick="pickReact('${e}')">${e}</span>`).join("");
      p._mid=b.dataset.mid;
      const r=btn.getBoundingClientRect();
      p.style.left=Math.max(8,Math.min(r.left-70, window.innerWidth-230))+"px";
      p.style.top=Math.max(8,r.top-46)+"px";
      p.classList.add("open");
    }
    function pickReact(e){ const p=document.getElementById("reactPicker"); const mid=p&&p._mid; if(p) p.classList.remove("open"); if(mid) react(mid,e); }
    document.addEventListener("click",e=>{ const p=document.getElementById("reactPicker");
      if(p&&p.classList.contains("open")&&!p.contains(e.target)&&!e.target.closest(".reactbtn")) p.classList.remove("open"); });
    async function refreshReactions(){
      const bubbles=[...document.querySelectorAll('#feed .bubble[data-mid]')].filter(b=>b.dataset.mid);
      if(!bubbles.length) return;
      const ids=bubbles.map(b=>b.dataset.mid);
      try{ const d=await api("/reactions?ids="+ids.join(","));
        const r=d.reactions||{};
        bubbles.forEach(b=>renderReacts(b.querySelector(".reacts"), r[b.dataset.mid]||[]));
      }catch(e){}
    }

    /* ---------------- PRESENCE + TYPING ---------------- */
    function convoKey(){
      if(channel.type==="public") return "public";
      if(channel.type==="group") return "group:"+channel.id;
      return "dm:"+[ME,channel.name].sort().join("|");
    }
    async function refreshPresence(){
      try{ const d=await api("/presence",{method:"POST",body:"{}"}); onlineSet=new Set(d.online||[]); applyPresence(); }catch{}
    }
    function sendTyping(){
      const now=Date.now(); if(now-lastTyping<2500) return; lastTyping=now;
      api("/typing",{method:"POST",body:JSON.stringify({convo:convoKey()})}).catch(()=>{});
    }
    async function refreshTyping(){
      try{ const d=await api("/typing?convo="+encodeURIComponent(convoKey())); renderTyping(d.typing||[]); }catch{}
    }
    function renderTyping(list){
      const el=document.getElementById("typingRow");
      const names=(list||[]).filter(u=>u!==ME);
      if(!names.length){ el.classList.remove("show"); el.textContent=""; return; }
      el.textContent = names.length===1 ? `${names[0]} is typing…`
        : names.length===2 ? `${names[0]} and ${names[1]} are typing…`
        : "Several people are typing…";
      el.classList.add("show");
    }

    /* ---------------- MENTIONS (@ping) ---------------- */
    function closeMention(){ mention.open=false; document.getElementById("mentionPop").classList.remove("open"); }
    function updateMention(){
      const t=document.getElementById("msg"); const caret=t.selectionStart;
      const m=/(?:^|[\s(])@([A-Za-z0-9_.\-]*)$/.exec(t.value.slice(0,caret));
      if(!m){ closeMention(); return; }
      const q=m[1].toLowerCase();
      mention.start=caret-m[1].length-1;
      const items=citizens.filter(c=>c.username!==ME && c.username.toLowerCase().includes(q)).slice(0,6);
      if(!items.length){ closeMention(); return; }
      mention.items=items; mention.idx=0; mention.open=true; renderMention();
    }
    function renderMention(){
      const p=document.getElementById("mentionPop");
      p.innerHTML=mention.items.map((c,i)=>`<div class="mrow ${i===mention.idx?'sel':''}" onmousedown="event.preventDefault()" onclick="pickMention(${i})">
        <div class="mav">${esc(c.username[0].toUpperCase())}</div>
        <div><div class="mn">${esc(c.username)}</div><div class="mr">${esc(c.company||c.designation||'Citizen')}</div></div></div>`).join("");
      p.classList.add("open");
    }
    function pickMention(i){
      const t=document.getElementById("msg"); const name=mention.items[i].username;
      const before=t.value.slice(0,mention.start), after=t.value.slice(t.selectionStart), insert="@"+name+" ";
      t.value=before+insert+after; const pos=(before+insert).length;
      t.focus(); t.selectionStart=t.selectionEnd=pos; closeMention(); autogrow(t);
    }

    /* ---------------- COMPOSER TOOLS ---------------- */
    function autogrow(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,130)+"px"; }
    function wrap(a,b){ const t=document.getElementById("msg"); const s=t.selectionStart,e=t.selectionEnd,v=t.value;
      t.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e); t.focus(); t.selectionStart=t.selectionEnd=e+a.length+b.length; autogrow(t); }
    function ins(x){ const t=document.getElementById("msg"); t.value+=x; t.focus(); autogrow(t); }
    function closePanels(){ document.querySelectorAll(".emoji-pop,.gif-pop").forEach(p=>p.classList.remove("open")); }
    function togglePanel(id){
      const p=document.getElementById(id); const wasOpen=p.classList.contains("open"); closePanels();
      if(wasOpen) return;
      p.classList.add("open");
      if(id==="emojiPop" && !p.innerHTML) p.innerHTML=EMOJIS.map(x=>`<span onclick="ins('${x}')">${x}</span>`).join("");
      if(id==="gifPop") loadGifs("");
    }

    /* ---- GIFs (Tenor) ---- */
    let gifTimer=null;
    function gifSearchDebounced(){ clearTimeout(gifTimer); gifTimer=setTimeout(()=>loadGifs(document.getElementById("gifSearch").value.trim()),350); }
    async function loadGifs(q){
      const grid=document.getElementById("gifGrid"); grid.innerHTML=`<p class="small muted" style="grid-column:1/-1">Loading…</p>`;
      try{
        const d=await api("/gif/search"+(q?`?q=${encodeURIComponent(q)}`:""));
        if(!d.gifs.length){
          grid.innerHTML=`<p class="small muted" style="grid-column:1/-1">${d.error?"GIF search isn't set up yet — paste a URL below for now.":"No GIFs found."}</p>`; return;
        }
        grid.innerHTML=d.gifs.map(g=>`<img loading="lazy" src="${g.preview}" onclick="sendGif('${g.url}')">`).join("");
      }catch(e){ grid.innerHTML=`<p class="small muted" style="grid-column:1/-1">${e.message}</p>`; }
    }
    function sendGif(url){ closePanels(); doSend(url); }
    function sendGifUrl(){
      const inp=document.getElementById("gifUrl"); const u=(inp.value||"").trim();
      if(!/^https?:\/\//i.test(u)) return alert("Paste a valid image or GIF URL (https://…)");
      inp.value=""; closePanels(); doSend(u);
    }

    /* ---- Voice messages (record → upload → send URL) ---- */
    let mediaRec=null, recChunks=[], recStream=null, recTimer=null, recStart=0, recCancelled=false;
    async function toggleRecord(){
      if(mediaRec && mediaRec.state==="recording"){ stopAndSend(); return; }
      if(!navigator.mediaDevices || !window.MediaRecorder){ alert("Voice messages aren't supported on this browser."); return; }
      let stream;
      try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
      catch(e){ alert("Microphone access was blocked. Allow the mic to send a voice message."); return; }
      recStream=stream; recChunks=[]; recCancelled=false;
      const mime = window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
      try{ mediaRec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
      catch(e){ mediaRec = new MediaRecorder(stream); }
      mediaRec.ondataavailable=e=>{ if(e.data && e.data.size) recChunks.push(e.data); };
      mediaRec.onstop=onRecStop;
      mediaRec.start();
      recStart=Date.now();
      document.getElementById("recBar").classList.add("show");
      document.getElementById("micBtn").classList.add("recording");
      recTimer=setInterval(updateRecTime,250);
    }
    function updateRecTime(){
      const s=Math.floor((Date.now()-recStart)/1000);
      document.getElementById("recTime").textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
      if(s>=120) stopAndSend();   // hard cap: 2 minutes
    }
    function stopAndSend(){ recCancelled=false; finishRec(); }
    function cancelRecord(){ recCancelled=true; finishRec(); }
    function finishRec(){
      if(recTimer){ clearInterval(recTimer); recTimer=null; }
      document.getElementById("recBar").classList.remove("show");
      document.getElementById("micBtn").classList.remove("recording");
      if(mediaRec && mediaRec.state!=="inactive"){ try{ mediaRec.stop(); }catch(e){} }
    }
    async function onRecStop(){
      if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream=null; }
      const type=(mediaRec && mediaRec.mimeType) || "audio/webm";
      const blob=new Blob(recChunks,{type});
      mediaRec=null;
      if(recCancelled){ recCancelled=false; return; }
      if(blob.size<800){ return; }   // too short / empty
      const up=document.getElementById("upStatus"); up.textContent="Sending voice…";
      try{
        const ext = type.indexOf("ogg")>=0 ? "ogg" : "webm";
        const fd=new FormData(); fd.append("file", blob, "voice."+ext);
        const res=await fetch("/voice/upload",{method:"POST",credentials:"include",body:fd});
        const d=await res.json();
        if(!res.ok||d.success===false) throw new Error(d.error||"Upload failed");
        up.textContent=""; doSend(d.url);
      }catch(e){ up.textContent=""; alert(e.message); }
    }

    /* ---- Image upload from device ---- */
    function onFile(inp){ const f=inp.files&&inp.files[0]; inp.value=""; if(f) uploadImage(f); }
    async function uploadImage(file){
      const up=document.getElementById("upStatus"); up.textContent="Uploading…";
      try{
        const blob = file.type==="image/gif" ? file : await compress(file);
        const fd=new FormData(); fd.append("file", blob, file.name||"image."+(file.type==="image/gif"?"gif":"jpg"));
        const res=await fetch("/chat/upload",{method:"POST",credentials:"include",body:fd});
        const d=await res.json();
        if(!res.ok||d.success===false) throw new Error(d.error||"Upload failed");
        up.textContent=""; doSend(d.url);
      }catch(e){ up.textContent=""; alert(e.message); }
    }
    function compress(file){
      return new Promise((resolve,reject)=>{
        const img=new Image(); const rd=new FileReader();
        rd.onload=()=>{ img.onload=()=>{
          const max=1280; let{width:w,height:h}=img;
          if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
          const c=document.createElement("canvas"); c.width=w; c.height=h;
          c.getContext("2d").drawImage(img,0,0,w,h);
          c.toBlob(b=>b?resolve(b):reject(new Error("Compress failed")),"image/jpeg",0.85);
        }; img.onerror=()=>reject(new Error("Bad image")); img.src=rd.result; };
        rd.onerror=()=>reject(new Error("Read failed")); rd.readAsDataURL(file);
      });
    }

    /* ---------------- GROUPS: create / add members ---------------- */
    let modalMode="create", modalGroup=null;
    function pickListHtml(exclude){
      exclude=exclude||new Set();
      return citizens.filter(c=>c.username!==ME && !exclude.has(c.username)).map(c=>`
        <label class="pick"><input type="checkbox" value="${esc(c.username)}">
          <div class="av" style="width:30px;height:30px;font-size:.75rem">${esc(c.username[0].toUpperCase())}</div>
          <div><div class="nm" style="font-size:.9rem">${esc(c.username)}</div>
          <div class="rl">${esc(c.company||c.designation||'Citizen')}</div></div></label>`).join("")
        || `<p class="small muted">No other citizens yet.</p>`;
    }
    function openGroupModal(ev){ if(ev) ev.stopPropagation();
      modalMode="create"; modalGroup=null;
      document.getElementById("modalTitle").textContent="New Group";
      document.getElementById("grpName").style.display="";
      document.getElementById("grpName").value="";
      document.getElementById("modalOk").textContent="Create";
      document.getElementById("pickList").innerHTML=pickListHtml();
      document.getElementById("modal").classList.add("open");
    }
    function openAddModal(id){
      const g=groups.find(x=>x.id===id); if(!g) return;
      modalMode="add"; modalGroup=id;
      document.getElementById("modalTitle").textContent="Add to "+g.name;
      document.getElementById("grpName").style.display="none";
      document.getElementById("modalOk").textContent="Add";
      document.getElementById("pickList").innerHTML=pickListHtml(new Set(g.members));
      document.getElementById("modal").classList.add("open");
    }
    function closeModal(){ document.getElementById("modal").classList.remove("open"); }
    function checkedUsers(){ return [...document.querySelectorAll("#pickList input:checked")].map(x=>x.value); }
    async function submitModal(){
      const members=checkedUsers();
      try{
        if(modalMode==="create"){
          const name=document.getElementById("grpName").value.trim();
          if(!name) return alert("Name the group");
          const d=await api("/groups",{method:"POST",body:JSON.stringify({name,members})});
          await loadGroups(); closeModal(); if(d.group) openGroup(d.group.id);
        }else{
          for(const u of members){ await api("/groups/add",{method:"POST",body:JSON.stringify({group_id:modalGroup,username:u})}); }
          await loadGroups(); closeModal(); openGroup(modalGroup);
        }
      }catch(e){ alert(e.message); }
    }

    async function loadGroups(){ try{ const d=await api("/groups"); groups=d.groups||[]; renderSide(); }catch{} }
    async function purge(){
      if(!confirm("Delete ALL chat messages for everyone? This cannot be undone.")) return;
      try{ await api("/admin/purge_chat",{method:"POST",body:"{}"}); loadNew(true); }catch(e){ alert(e.message); }
    }

    (async function(){
      const user=await requireAuth(); if(!user) return;
      ME=user.username; renderNav("/chat", user);
      try{ const me=await api("/me"); ADMIN=!!me.admin; if(me.user&&me.user.avatar) AVATARS[ME]=me.user.avatar; }catch{}
      try{ const d=await api("/citizens/list"); citizens=d.citizens||[]; citizens.forEach(c=>{ if(c.avatar) AVATARS[c.username]=c.avatar; }); }catch{}
      await loadGroups();
      const qs=new URLSearchParams(location.search);
      const dm=qs.get("dm"), gid=qs.get("group");
      if(dm) openDM(encodeURIComponent(dm));
      else if(gid) openGroup(parseInt(gid));
      else openPublic();

      const t=document.getElementById("msg");
      t.addEventListener("input",()=>{ autogrow(t); updateMention(); sendTyping(); });
      t.addEventListener("keydown",e=>{
        if(mention.open){
          if(e.key==="ArrowDown"){ e.preventDefault(); mention.idx=(mention.idx+1)%mention.items.length; renderMention(); return; }
          if(e.key==="ArrowUp"){ e.preventDefault(); mention.idx=(mention.idx-1+mention.items.length)%mention.items.length; renderMention(); return; }
          if(e.key==="Enter"||e.key==="Tab"){ e.preventDefault(); pickMention(mention.idx); return; }
          if(e.key==="Escape"){ e.preventDefault(); closeMention(); return; }
        }
        if(e.key==="Escape" && replyTo){ e.preventDefault(); cancelReply(); return; }
        if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendInput(); }
      });
      t.addEventListener("blur",()=>setTimeout(closeMention,150));
      document.getElementById("gifSearch").addEventListener("keydown",e=>e.stopPropagation());

      refreshPresence(); setInterval(refreshPresence, 12000);   // online dots
      loadMailBadge(); setInterval(loadMailBadge, 30000);
    })();

    async function loadMailBadge(){
      try{
        const d=await api("/mail/unread");
        const b=document.getElementById("mailBadge");
        if(d.unread>0){ b.textContent=d.unread>9?"9+":d.unread; b.classList.add("show"); }
        else b.classList.remove("show");
      }catch{}
    }
  </script>
