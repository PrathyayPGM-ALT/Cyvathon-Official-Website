<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyvathon Chat</title>

    <!-- Font Awesome for the terminal icon logo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* Global styling */
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(145deg, #000, #0a0a0a);
  color: #e5e5e5;
  font-family: "Inter", Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Header */
#header {
  padding: 18px;
  text-align: center;
  font-size: 34px;
  font-weight: 700;
  background: #050505;
  border-bottom: 1px solid rgba(0, 140, 255, 0.25);
  box-shadow: 0 0 20px rgba(0, 140, 255, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

/* Logo glow */
#header i {
  font-size: 32px;
  color: #3b82f6;
  filter: drop-shadow(0 0 6px rgba(0,140,255,0.6));
}
button {
  transition: 0.2s ease-in-out;
}

button:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 6px 16px rgba(59,130,246,0.5);
}

/* Login section */
#login-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
}

#login-section input {
  padding: 14px;
  width: 320px;
  font-size: 18px;
  border-radius: 10px;
  background: #1a1a1a;
  border: 1px solid #333;
  color: white;
}

#login-section input:focus {
  border-color: #3b82f6;
}

/* Button row */
.button-row {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.button-row button {
  width: 140px;
  padding: 12px;
  font-size: 18px;
  border-radius: 10px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border: none;
  color: white;
}

/* Chat UI */
#chat-container {
  flex: 1;
  display: none;
  flex-direction: row;
  overflow: hidden;
}

#chat-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px;
  overflow: hidden;
}

#chat-title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 12px;
}

/* Chat box glow */
#chat-box {
  flex: 1;
  overflow-y: auto;
  background: #111;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid rgba(0,140,255,0.35);
  box-shadow:
      inset 0 0 15px rgba(0,0,0,0.6),
      0 0 20px rgba(0,140,255,0.25),
      0 0 40px rgba(0,140,255,0.15);
}

/* Bubble wrapper */
.message-line {
  margin: 10px 0;
}

/* Bubble look — same for all */
.chat-bubble {
  background: #1f1f1f;
  padding: 12px 16px;
  border-radius: 14px;
  display: inline-block;
  max-width: 75%;
  border: 1px solid #333;
  box-shadow: 0 0 8px rgba(0,0,0,0.4);
}

/* Sender name */
.sender-label {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 3px;
}

/* Message input */
#message-bar {
  margin-top: 12px;
  display: flex;
  gap: 10px;
}

#msg {
  flex: 1;
  padding: 14px;
  background: #1a1a1a;
  border-radius: 10px;
  border: 1px solid #333;
  color: white;
  font-size: 18px;
}

button {
  padding: 14px 20px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border-radius: 10px;
  border: none;
  color: white;
}
</style>
</head>

<body>

<div id="header">
    <i class="fa-solid fa-terminal"></i>
    Cyvathon Chat
</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <div class="button-row">
        <button onclick="chatLogin()">Login</button>
        <button onclick="chatRegister()">Register</button>
    </div>

    <p id="login-status"></p>
</div>

<!-- CHAT UI -->
<div id="chat-container">
    <div id="chat-section">
        <div id="chat-title">Public Chat</div>
        <div id="chat-box"></div>

        <div id="message-bar">
            <input id="msg" placeholder="Type message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
const el = (id) => document.getElementById(id);
let messageInterval = null;

// LOGIN
async function chatLogin() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();
    if (!data.success) {
        el("login-status").textContent = data.error;
        return;
    }

    el("login-section").style.display = "none";
    el("chat-container").style.display = "flex";

    startAutoRefresh();
    loadPublicChat();
}

async function chatRegister() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();
    if (!data.success) {
        el("login-status").textContent = data.error;
        return;
    }

    el("login-section").style.display = "none";
    el("chat-container").style.display = "flex";

    startAutoRefresh();
    loadPublicChat();
}

// AUTO REFRESH
function startAutoRefresh() {
    if (!messageInterval) messageInterval = setInterval(loadPublicChat, 1000);
}

// LOAD PUBLIC CHAT
async function loadPublicChat() {
    let res = await fetch("/messages", { credentials: "include" });
    let data = await res.json();
    if (!data.success) return;

    const box = el("chat-box");
    const buffer = document.createDocumentFragment();
    box.innerHTML = "";

    data.messages.forEach(msg => {
        let wrap = document.createElement("div");
        wrap.className = "message-line";

        let label = document.createElement("div");
        label.className = "sender-label";
        label.textContent = msg.sender;

        let bubble = document.createElement("div");
        bubble.className = "chat-bubble";
        bubble.textContent = msg.content;

        wrap.appendChild(label);
        wrap.appendChild(bubble);
        buffer.appendChild(wrap);
    });

    box.appendChild(buffer);
    box.scrollTop = box.scrollHeight;
}

// SEND MESSAGE
async function sendMessage() {
    let text = el("msg").value.trim();
    if (!text) return;

    await fetch("/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ content: text })
    });

    el("msg").value = "";
    loadPublicChat();
}

// ENTER→SEND
document.addEventListener("DOMContentLoaded", () => {
    el("msg").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });
});
</script>

</body>
</html>
