<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyvathon Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .chat-shell{ max-width:820px; margin:1.5rem auto; padding:0 1rem; height:calc(100vh - 160px);
      display:flex; flex-direction:column; }
    #chat-box{ flex:1; overflow-y:auto; padding:1rem; border-radius:14px;
      background:#0f141b; border:1px solid rgba(88,196,255,.3);
      box-shadow:inset 0 0 15px rgba(0,0,0,.6), 0 0 20px rgba(88,196,255,.12); }
    .message-line{ margin:.6rem 0; }
    .sender-label{ font-size:12px; color:var(--accent); margin-bottom:3px; }
    .chat-bubble{ background:#1b222c; padding:10px 14px; border-radius:14px; display:inline-block;
      max-width:75%; border:1px solid #2a3340; }
    .mine{ text-align:right; }
    .mine .chat-bubble{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#06223a; }
    #message-bar{ display:flex; gap:10px; margin-top:.8rem; }
    #msg{ flex:1; margin:0; } #message-bar button{ width:auto; margin:0; padding:12px 22px; }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="chat-shell">
    <h2 class="section-title" style="font-size:1.5rem;margin-bottom:1rem;">
      <i class="fa-solid fa-comments"></i> Public Chat</h2>
    <div id="chat-box"></div>
    <div id="message-bar">
      <input id="msg" placeholder="Type a message...">
      <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let myName = "";

    async function loadChat(){
      try{
        const d = await api("/messages");
        const box = document.getElementById("chat-box");
        box.innerHTML = "";
        d.messages.forEach(m=>{
          const wrap = document.createElement("div");
          wrap.className = "message-line" + (m.sender===myName ? " mine" : "");
          wrap.innerHTML = `<div class="sender-label">${userLink(m.sender)}</div>
            <div class="chat-bubble"></div>`;
          wrap.querySelector(".chat-bubble").textContent = m.content;
          box.appendChild(wrap);
        });
        box.scrollTop = box.scrollHeight;
      }catch(e){ if(/logged in/i.test(e.message)) window.location.href="/"; }
    }

    async function sendMessage(){
      const input = document.getElementById("msg");
      const text = input.value.trim();
      if(!text) return;
      await api("/messages",{method:"POST",body:JSON.stringify({content:text})});
      input.value=""; loadChat();
    }

    (async function(){
      const user = await requireAuth(); if(!user) return;
      myName = user.username;
      renderNav("/chat", user);
      loadChat();
      setInterval(loadChat, 1500);
      document.getElementById("msg").addEventListener("keydown", e=>{
        if(e.key==="Enter"){ e.preventDefault(); sendMessage(); }
      });
    })();
  </script>
</body>
</html>
