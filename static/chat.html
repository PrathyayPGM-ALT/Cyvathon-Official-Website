<!DOCTYPE html>
<html>
<head>
    <title>Cyvathon Chat</title>

    <style>
        body {
            background: radial-gradient(circle at top, #0d0d0d, #050505);
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #6fb1ff;
            text-shadow: 0 0 15px #3b82f6;
        }

        /* CONTAINER */
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(20,20,20,0.9);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 153, 255, 0.3);
            backdrop-filter: blur(6px);
        }

        /* INPUTS */
        input {
            width: calc(100% - 20px);
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #111;
            color: #ddd;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
        }

        /* BUTTONS */
        button {
            padding: 12px 18px;
            margin: 6px 4px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            transition: 0.2s;
        }

        button:hover {
            background: #60a5fa;
            box-shadow: 0 0 10px #3b82f6;
        }

        /* CHAT BOX */
        #chat-box {
            height: 350px;
            overflow-y: auto;
            border: 1px solid #222;
            padding: 12px;
            background: #0b0b0b;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: inset 0 0 10px #000;
        }

        .msg {
            padding: 6px 10px;
            margin: 6px 0;
            border-radius: 6px;
            background: #1a1a1a;
            border-left: 3px solid #3b82f6;
        }

        .msg span {
            font-weight: bold;
            color: #60a5fa;
        }

        #login-status {
            color: #ff6b6b;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1>Cyvathon Chat</h1>

<div class="container">

    <!-- LOGIN -->
    <div id="login-section">
        <h2>Login to Chat</h2>

        <input id="login-username" placeholder="Username">
        <input id="login-password" placeholder="Password" type="password">

        <button onclick="chatLogin()">Login</button>
        <button onclick="chatRegister()">Register</button>

        <p id="login-status"></p>
    </div>

    <!-- CHAT -->
    <div id="chat-section" style="display:none;">
        <button onclick="chatLogout()">Logout</button>

        <div id="chat-box"></div>

        <input id="msg" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
function el(id) {
    return document.getElementById(id);
}

async function chatLogin() {
    let user = el("login-username").value;
    let pass = el("login-password").value;

    let res = await fetch("/chat_login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({username:user, password:pass})
    });

    let data = await res.json();
    if (data.success) {
        el("login-section").style.display="none";
        el("chat-section").style.display="block";
        loadMessages();
    } else {
        el("login-status").textContent = data.error;
    }
}

async function chatRegister() {
    let user = el("login-username").value;
    let pass = el("login-password").value;

    let res = await fetch("/chat_register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({username:user, password:pass})
    });

    let data = await res.json();
    if (data.success) {
        el("login-section").style.display="none";
        el("chat-section").style.display="block";
        loadMessages();
    } else {
        el("login-status").textContent = data.error;
    }
}

async function chatLogout() {
    await fetch("/chat_logout", {
        method:"POST",
        credentials:"include"
    });

    el("chat-section").style.display="none";
    el("login-section").style.display="block";
}

async function sendMessage() {
    let text = el("msg").value.trim();
    if (!text) return;

    await fetch("/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({content:text})
    });

    el("msg").value="";
    loadMessages();
}

async function loadMessages() {
    let res = await fetch("/messages", {credentials:"include"});
    let data = await res.json();
    if (!data.success) return;

    let box = el("chat-box");
    box.innerHTML="";

    data.messages.forEach(m=>{
        let div = document.createElement("div");
        div.className="msg";
        div.innerHTML = `<span>${m.sender}</span>: ${m.content}`;
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

setInterval(loadMessages, 1500);
</script>

</body>
</html>
