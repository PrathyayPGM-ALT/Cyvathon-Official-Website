<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyvathon Chat</title>

<style>
/* GLOBAL */
body {
    margin: 0;
    padding: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;

    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* HEADER */
#header {
    padding: 15px;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    background: #050505;
    box-shadow: 0 0 15px rgba(0, 140, 255, 0.4);
}

/* LOGIN PAGE */
#login-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

#login-section input {
    padding: 14px;
    width: 300px;
    font-size: 18px;
    border-radius: 8px;
    background: #222;
    border: 1px solid #444;
    color: white;
}

.button-row {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.button-row button {
    width: 130px;
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    border: none;
    cursor: pointer;
}

/* MAIN CHAT LAYOUT */
#chat-container {
    flex: 1;
    display: none;
    flex-direction: row;
    overflow: hidden;
}

/* SIDEBAR */
#sidebar {
    width: 220px;
    background: #0c0c0c;
    border-right: 1px solid #222;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
}

#sidebar button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
}

#sidebar button:hover {
    background: #3b82f6;
}

/* RIGHT SIDE CHAT */
#chat-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow: hidden;
}

#chat-title {
    font-size: 24px;
    margin-bottom: 10px;
    font-weight: bold;
    text-align: center;
}

/* MESSAGE BOX */
.chat-box {
    flex: 1;
    overflow-y: auto;
    background: #111;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #333;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
}

/* INPUT BAR */
#message-bar {
    margin-top: 12px;
    display: flex;
    gap: 10px;
}

input {
    padding: 14px;
    font-size: 18px;
    background: #222;
    color: white;
    border-radius: 8px;
    border: 1px solid #444;
    flex: 1;
}

button.send-btn {
    padding: 14px 20px;
    font-size: 18px;
    border-radius: 8px;
    background: #3b82f6;
    border: none;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="header">Cyvathon Chat</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <div class="button-row">
        <button onclick="chatLogin()">Login</button>
        <button onclick="chatRegister()">Register</button>
    </div>

    <p id="login-status"></p>
</div>

<!-- MAIN CHAT -->
<div id="chat-container">

    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
        <button onclick="openPublicChat()">🌐 Public Chat</button>

        <hr style="border:1px solid #222; width:100%;">

        <p style="opacity:0.6;">DMs:</p>
        <div id="dm-users"></div>

        <button onclick="chatLogout()" style="margin-top:auto; background:#b91c1c;">Logout</button>
    </div>

    <!-- RIGHT CHAT -->
    <div id="chat-section">
        <div id="chat-title">Public Chat</div>

        <div id="chat-box" class="chat-box"></div>

        <div id="message-bar">
            <input id="msg" placeholder="Type message...">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>
// GLOBAL STATE
let viewingPublic = true;
let activeDM = null;
let interval = null;

// UTIL
function el(id) { return document.getElementById(id); }

// ------------------ AUTH ------------------
async function chatLogin() {
    let u = el("login-username").value.trim();
    let p = el("login-password").value.trim();

    let res = await fetch("/chat_login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({username:u, password:p})
    });

    let data = await res.json();

    if (data.success) {
        el("login-section").style.display = "none";
        el("chat-container").style.display = "flex";
        loadUsers();
        openPublicChat();
        startLoop();
    } else {
        el("login-status").textContent = data.error;
    }
}

async function chatRegister() {
    let u = el("login-username").value.trim();
    let p = el("login-password").value.trim();

    let res = await fetch("/chat_register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        credentials:"include",
        body:JSON.stringify({username:u, password:p})
    });

    let data = await res.json();

    if (data.success) {
        el("login-section").style.display = "none";
        el("chat-container").style.display = "flex";
        loadUsers();
        openPublicChat();
        startLoop();
    } else {
        el("login-status").textContent = data.error;
    }
}

async function chatLogout() {
    await fetch("/chat_logout", {
        method:"POST",
        credentials:"include"
    });

    el("chat-container").style.display = "none";
    el("login-section").style.display = "flex";

    stopLoop();
}

// ----------------- AUTO REFRESH -----------------
function startLoop() {
    if (interval) return;
    interval = setInterval(() => {
        if (viewingPublic) loadPublicChat();
        else if (activeDM) loadDM(activeDM);
    }, 1000);
}

function stopLoop() {
    clearInterval(interval);
    interval = null;
}

// ------------------ USERS ------------------
async function loadUsers() {
    let res = await fetch("/chat_users", { credentials:"include" });
    let data = await res.json();

    let box = el("dm-users");
    box.innerHTML = "";

    data.users.forEach(u => {
        let btn = document.createElement("button");
        btn.textContent = u;
        btn.onclick = () => openDM(u);
        box.appendChild(btn);
    });
}

// ------------------ PUBLIC CHAT ------------------
async function openPublicChat() {
    viewingPublic = true;
    activeDM = null;

    el("chat-title").textContent = "Public Chat";

    loadPublicChat();
}

async function loadPublicChat() {
    let res = await fetch("/messages", { credentials:"include" });
    let data = await res.json();

    let box = el("chat-box");
    box.innerHTML = "";

    data.messages.forEach(m => {
        let d = document.createElement("div");
        d.textContent = `${m.sender}: ${m.content}`;
        d.style.marginBottom = "8px";
        box.appendChild(d);
    });

    box.scrollTop = box.scrollHeight;
}

// ------------------ SEND MESSAGE ------------------
async function sendMessage() {
    let txt = el("msg").value.trim();
    if (!txt) return;

    if (viewingPublic) {
        await fetch("/messages", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify({content:txt})
        });
        el("msg").value = "";
        loadPublicChat();
    } else if (activeDM) {
        await fetch("/dm_send", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify({recipient:activeDM, content:txt})
        });
        el("msg").value = "";
        loadDM(activeDM);
    }
}

// ------------------ DM SYSTEM ------------------
async function openDM(user) {
    viewingPublic = false;
    activeDM = user;

    el("chat-title").textContent = "DM with " + user;

    loadDM(user);
}

async function loadDM(user) {
    let res = await fetch(`/dm_get?user=${user}`, { credentials:"include" });
    let data = await res.json();

    let box = el("chat-box");
    box.innerHTML = "";

    data.messages.forEach(m => {
        let d = document.createElement("div");
        d.style.marginBottom = "8px";

        if (m.sender === user) {
            d.style.color = "#38bdf8";
            d.textContent = `${m.sender}: ${m.content}`;
        } else {
            d.style.color = "#a1ff8f";
            d.textContent = `You: ${m.content}`;
        }

        box.appendChild(d);
    });

    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
