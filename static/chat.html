<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyvathon Chat</title>

<style>
/* Global styling – the dark mode goth cousin */
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(145deg, #000, #0a0a0a);
  color: #e5e5e5;
  font-family: "Inter", Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  letter-spacing: 0.3px;
}

/* Header where the logo flexes its muscles */
#header {
  padding: 18px;
  text-align: center;
  font-size: 34px;
  font-weight: 700;
  background: #050505;
  border-bottom: 1px solid rgba(0, 140, 255, 0.25);
  box-shadow:
    0 0 20px rgba(0, 140, 255, 0.35),
    0 0 40px rgba(0, 140, 255, 0.15);
  flex-shrink: 0;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

#header img {
  height: 34px;
  filter: drop-shadow(0 0 6px rgba(0,140,255,0.6));
}

/* Login zone – where everyone pretends they know their password */
#login-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
}

#login-section input {
  padding: 14px;
  width: 320px;
  font-size: 18px;
  border-radius: 10px;
  background: #1a1a1a;
  border: 1px solid #333;
  color: white;
  transition: 0.2s;
}

#login-section input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 10px rgba(59,130,246,0.5);
}

/* Two button buddies */
.button-row {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.button-row button {
  width: 140px;
  padding: 12px;
  font-size: 18px;
  border-radius: 10px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border: none;
  color: white;
  cursor: pointer;
  transition: 0.2s ease;
}

.button-row button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59,130,246,0.4);
}

/* Chat container (the chaos begins here) */
#chat-container {
  flex: 1;
  display: none;
  flex-direction: row;
  overflow: hidden;
}

/* Right side – public chat */
#chat-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px;
  overflow: hidden;
}

#chat-title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 12px;
}

/* The glowing message cave */
#chat-box {
  flex: 1;
  overflow-y: auto;
  background: #111;
  padding: 16px;
  border-radius: 12px;

  border: 1px solid rgba(0,140,255,0.35);
  box-shadow:
      inset 0 0 15px rgba(0,0,0,0.6),
      0 0 20px rgba(0,140,255,0.25),
      0 0 40px rgba(0,140,255,0.15);
}

/* Message row wrapper */
.message-line {
  margin: 6px 0;
  display: flex;
  flex-direction: column;
  width: 100%;
}

/* Sender label (small and shy) */
.sender-label {
  font-size: 12px;
  opacity: 0.7;
  margin-bottom: 4px;
}

/* Left bubble – messages from other humans */
.bubble-left {
  background: #1f1f1f;
  padding: 10px 14px;
  border-radius: 14px;
  max-width: 65%;
  box-shadow: 0 0 8px rgba(0,0,0,0.4);
  border: 1px solid #333;
  color: #e5e5e5;
}

/* Right bubble – your mighty words */
.bubble-right {
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  padding: 10px 14px;
  border-radius: 14px;
  max-width: 65%;
  margin-left: auto;
  color: white;
  box-shadow: 0 0 12px rgba(59,130,246,0.4);
  border: 1px solid rgba(255,255,255,0.15);
}

/* Message bar – where procrastination becomes text */
#message-bar {
  margin-top: 12px;
  display: flex;
  gap: 10px;
}

#msg {
  flex: 1;
  padding: 14px;
  background: #1a1a1a;
  border-radius: 10px;
  border: 1px solid #333;
  color: white;
  font-size: 18px;
  transition: 0.2s;
  resize: none;        /* no manual resizing because we are fancy */
  overflow-y: hidden;  /* auto-expand magic */
  min-height: 48px;
  max-height: 200px;
}

button {
  padding: 14px 20px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border-radius: 10px;
  border: none;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59,130,246,0.4);
}
</style>
</head>

<body>

<div id="header">
    <img src="cyvathon_logo.png">
    Cyvathon Chat
</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <div class="button-row">
        <button onclick="chatLogin()">Login</button>
        <button onclick="chatRegister()">Register</button>
    </div>

    <p id="login-status"></p>
</div>

<!-- CHAT UI -->
<div id="chat-container">
    <div id="chat-section">
        <div id="chat-title">Public Chat</div>
        <div id="chat-box"></div>

        <div id="message-bar">
            <textarea id="msg" placeholder="Type message..."></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
// Utility function because typing document.getElementById is pain
const el = (id) => document.getElementById(id);

let messageInterval = null;

//================ LOGIN =================
async function chatLogin() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();
    if (!data.success) {
        el("login-status").textContent = data.error;
        return;
    }

    el("login-section").style.display = "none";
    el("chat-container").style.display = "flex";

    startAutoRefresh();
    openPublicChat();
}

async function chatRegister() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();
    if (!data.success) {
        el("login-status").textContent = data.error;
        return;
    }

    el("login-section").style.display = "none";
    el("chat-container").style.display = "flex";

    startAutoRefresh();
    openPublicChat();
}

//=============== AUTO REFRESH =================
function startAutoRefresh() {
    if (!messageInterval) messageInterval = setInterval(loadPublicChat, 1000);
}

function stopAutoRefresh() {
    clearInterval(messageInterval);
    messageInterval = null;
}

//=============== PUBLIC CHAT =================
function openPublicChat() {
    el("chat-title").textContent = "Public Chat";
    el("chat-box").innerHTML = "<p style='opacity:0.5;'>Loading...</p>";
    loadPublicChat();
}

async function loadPublicChat() {
    let res = await fetch("/messages", { credentials: "include" });
    let data = await res.json();
    if (!data.success) return;

    const box = el("chat-box");
    const buffer = document.createDocumentFragment();

    box.innerHTML = "";

    data.messages.forEach(msg => {
        let wrap = document.createElement("div");
        wrap.className = "message-line";

        let bubble = document.createElement("div");

        if (msg.isSelf) {
            bubble.className = "bubble-right";
        } else {
            bubble.className = "bubble-left";

            let label = document.createElement("div");
            label.className = "sender-label";
            label.textContent = msg.sender;
            wrap.appendChild(label);
        }

        bubble.textContent = msg.content;
        wrap.appendChild(bubble);
        buffer.appendChild(wrap);
    });

    box.appendChild(buffer);
    box.scrollTop = box.scrollHeight;
}

//=============== SEND =================
async function sendMessage() {
    let text = el("msg").value.trim();
    if (!text) return;

    await fetch("/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ content: text })
    });

    el("msg").value = "";
    el("msg").style.height = "48px"; // reset height
    loadPublicChat();
}

//=============== ENTER KEY TO SEND + AUTO-EXPAND =================
document.addEventListener("DOMContentLoaded", () => {
    const input = el("msg");

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Auto expand textarea (the magic trick)
    input.addEventListener("input", () => {
        input.style.height = "48px";
        input.style.height = input.scrollHeight + "px";
    });
});
</script>

</body>
</html>
