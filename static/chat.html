<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyvathon Chat</title>

    <style>
/* Global vibes */
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(145deg, #000, #0a0a0a);
  color: #e5e5e5;
  font-family: "Inter", Arial, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  letter-spacing: 0.3px;
}

/* The big title bar where your ego sits */
#header {
  padding: 18px;
  text-align: center;
  font-size: 34px;
  font-weight: 700;
  background: #050505;
  border-bottom: 1px solid rgba(0, 140, 255, 0.25);
  box-shadow:
    0 0 20px rgba(0, 140, 255, 0.35),
    0 0 40px rgba(0, 140, 255, 0.15);
  flex-shrink: 0;
  letter-spacing: 1px;
}

/* Login zone where users pretend to remember their password */
#login-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 14px;
}

#login-section input {
  padding: 14px;
  width: 320px;
  font-size: 18px;
  border-radius: 10px;
  background: #1a1a1a;
  border: 1px solid #333;
  color: white;
  transition: 0.2s;
}

#login-section input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 10px rgba(59,130,246,0.5);
}

/* Two buttons sitting together like best friends */
.button-row {
  display: flex;
  justify-content: center;
  gap: 15px;
}

.button-row button {
  width: 140px;
  padding: 12px;
  font-size: 18px;
  border-radius: 10px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border: none;
  color: white;
  cursor: pointer;
  transition: 0.2s ease;
}

.button-row button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59,130,246,0.4);
}

/* Main chat box where all the chaos happens */
#chat-container {
  flex: 1;
  display: none;
  flex-direction: row;
  overflow: hidden;
}

/* Sidebar – aka the place nobody clicks but looks cool */
#sidebar {
  width: 240px;
  background: #0b0b0b;
  border-right: 1px solid #222;
  display: flex;
  flex-direction: column;
  padding: 15px;
  gap: 10px;
  overflow-y: auto;
}

#sidebar button {
  width: 100%;
  padding: 12px;
  background: #1e1e1e;
  border-radius: 8px;
  border: none;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

#sidebar button:hover {
  background: #3b82f6;
}

/* Chat area – where wisdom and nonsense are typed equally */
#chat-section {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px;
  overflow: hidden;
}

#chat-title {
  text-align: center;
  font-size: 22px;
  margin-bottom: 12px;
}

#chat-box {
  flex: 1;
  overflow-y: auto;
  background: #111;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #2b2b2b;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
}

/* Message bar – where thoughts turn into pixels */
#message-bar {
  margin-top: 12px;
  display: flex;
  gap: 10px;
}

#msg {
  flex: 1;
  padding: 14px;
  background: #1a1a1a;
  border-radius: 10px;
  border: 1px solid #333;
  color: white;
  font-size: 18px;
  transition: 0.2s;
}

#msg:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 10px rgba(59,130,246,0.4);
}

/* Universal button – the hero of this story */
button {
  padding: 14px 20px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  border-radius: 10px;
  border: none;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(59,130,246,0.4);
}

    </style>
</head>

<body>

<div id="header">Cyvathon Chat</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <div class="button-row">
        <button onclick="chatLogin()">Login</button>
        <button onclick="chatRegister()">Register</button>
    </div>

    <p id="login-status"></p>
</div>


<!-- CHAT UI -->
<div id="chat-container">
    <!-- RIGHT CHAT -->
    <div id="chat-section">
        <div id="chat-title">Public Chat</div>
        <div id="chat-box"></div>

        <div id="message-bar">
            <input id="msg" placeholder="Type message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>
// ========================================
// GLOBAL
// ========================================
let messageInterval = null;

function el(id) {
    return document.getElementById(id);
}

// ========================================
// LOGIN
// ========================================
async function chatLogin() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();

    if (!data.success) {
        el("login-status").textContent = data.error;
        return;
    }

    el("login-section").style.display = "none";
    el("chat-container").style.display = "flex";

    startAutoRefresh();
    openPublicChat();
}

async function chatRegister() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();

    if (!data.success) {
        el("login-status").textContent = data.error;
        return;
    }

    el("login-section").style.display = "none";
    el("chat-container").style.display = "flex";

    startAutoRefresh();
    openPublicChat();
}

async function chatLogout() {
    await fetch("/chat_logout", {
        method: "POST",
        credentials: "include"
    });

    stopAutoRefresh();

    el("login-section").style.display = "flex";
    el("chat-container").style.display = "none";
}

// ========================================
// AUTO REFRESH
// ========================================
function startAutoRefresh() {
    if (messageInterval) return;
    messageInterval = setInterval(loadPublicChat, 1000);
}

function stopAutoRefresh() {
    if (messageInterval) {
        clearInterval(messageInterval);
        messageInterval = null;
    }
}

// ========================================
// PUBLIC CHAT ONLY
// ========================================
function openPublicChat() {
    el("chat-title").textContent = "Public Chat";
    el("chat-box").innerHTML = "<p style='opacity:0.5;'>Loading...</p>";
    loadPublicChat();
}

async function loadPublicChat() {
    let res = await fetch("/messages", { credentials: "include" });
    let data = await res.json();
    if (!data.success) return;

    const box = el("chat-box");
    const buffer = document.createDocumentFragment();

    box.innerHTML = "";

    data.messages.forEach(msg => {
        let div = document.createElement("div");
        div.className = "message-line";
        div.textContent = `${msg.sender}: ${msg.content}`;
        buffer.appendChild(div);
    });

    box.appendChild(buffer);
    box.scrollTop = box.scrollHeight;
}

// ========================================
// SEND PUBLIC MESSAGE
// ========================================
async function sendMessage() {
    let text = el("msg").value.trim();
    if (!text) return;

    await fetch("/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ content: text })
    });

    el("msg").value = "";
    loadPublicChat();
}
// Allow sending messages by pressing Enter
document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("msg");

    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();  
            sendMessage();       
        }
    });
});


</script>



</body>
</html>
