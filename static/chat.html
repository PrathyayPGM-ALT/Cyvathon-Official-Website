<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyvathon Chat</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 15px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            background: #050505;
            box-shadow: 0 0 15px rgba(0, 140, 255, 0.4);
            flex-shrink: 0;
        }

        /* LOGIN PAGE */
        #login-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        #login-section input {
            padding: 14px;
            width: 300px;
            font-size: 18px;
            border-radius: 8px;
            background: #222;
            border: 1px solid #444;
            color: white;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .button-row button {
            width: 130px;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            background: #3b82f6;
            border: none;
            color: white;
            cursor: pointer;
        }

        /* CHAT MAIN AREA */
        #chat-container {
            flex: 1;
            display: none;
            flex-direction: row;
            overflow: hidden;
        }

        /* SIDEBAR */
        #sidebar {
            width: 230px;
            background: #0a0a0a;
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
            overflow-y: auto;
        }

        #sidebar button {
            width: 100%;
            padding: 12px;
            background: #333;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        #sidebar button:hover {
            background: #3b82f6;
        }

        /* CHAT SECTION */
        #chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        #chat-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            background: #111;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }

        #message-bar {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }

        #msg {
            flex: 1;
            padding: 14px;
            background: #222;
            border-radius: 8px;
            border: 1px solid #444;
            color: white;
            font-size: 18px;
        }

        button {
            padding: 14px 20px;
            background: #3b82f6;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="header">Cyvathon Chat</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <div class="button-row">
        <button onclick="chatLogin()">Login</button>
        <button onclick="chatRegister()">Register</button>
    </div>

    <p id="login-status"></p>
</div>


<!-- CHAT UI -->
<div id="chat-container">

    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
        <button onclick="openPublicChat()">🌐 Public Chat</button>
        <hr style="border:1px solid #222; width:100%;">
        <p style="opacity:0.5;">DMs:</p>
        <div id="dm-users"></div>
        <button onclick="chatLogout()" style="margin-top:auto; background:#b91c1c;">Logout</button>
    </div>

    <!-- RIGHT CHAT -->
    <div id="chat-section">
        <div id="chat-title">Public Chat</div>
        <div id="chat-box"></div>

        <div id="message-bar">
            <input id="msg" placeholder="Type message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>
// ========================================
// GLOBALS
// ========================================
let activeDM = null;
let viewingPublic = true;
let messageInterval = null;

let dmAbortController = null; // prevents overlapping DM fetches

function el(id) {
    return document.getElementById(id);
}

// ========================================
// LOGIN
// ========================================
async function loadDMUsers() {
    let res = await fetch("/chat_users", { credentials: "include" });
    let data = await res.json();
    if (!data.success) return;

    const box = el("dm-users");
    box.innerHTML = `<p class="section-title">DMs:</p>`;

    data.users.forEach(user => {
        let btn = document.createElement("button");
        btn.className = "dm-user-btn";
        btn.textContent = user;
        btn.onclick = () => openDM(user);
        box.appendChild(btn);
    });
}

async function chatLogin() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();
    if (!data.success) {
        el("login-status").textContent = data.error;
        return;
    }

    el("login-section").style.display = "none";
    el("chat-container").style.display = "flex";

    startAutoRefresh();
    loadDMUsers();
    openPublicChat();
}

async function chatRegister() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();
    if (!data.success) {
        el("login-status").textContent = data.error;
        return;
    }

    el("login-section").style.display = "none";
    el("chat-container").style.display = "flex";

    startAutoRefresh();
    loadDMUsers();
    openPublicChat();
}

async function chatLogout() {
    await fetch("/chat_logout", {
        method: "POST",
        credentials: "include"
    });

    stopAutoRefresh();

    el("login-section").style.display = "flex";
    el("chat-container").style.display = "none";

    activeDM = null;
    viewingPublic = true;
}

// ========================================
// AUTO REFRESH
// ========================================
function startAutoRefresh() {
    if (messageInterval) return;

    messageInterval = setInterval(() => {
        if (viewingPublic) loadPublicChat();
        else if (activeDM) loadDM(activeDM);
    }, 1100);
}

function stopAutoRefresh() {
    if (messageInterval) {
        clearInterval(messageInterval);
        messageInterval = null;
    }
}

// ========================================
// PUBLIC CHAT
// ========================================
function openPublicChat() {
    viewingPublic = true;
    activeDM = null;

    el("chat-title").textContent = "Public Chat";

    el("msg").style.display = "block";
    el("dm-msg").style.display = "none";

    el("chat-box").innerHTML = "<p class='loading-text'>Loading...</p>";

    loadPublicChat();
}

async function loadPublicChat() {
    let res = await fetch("/messages", { credentials: "include" });
    let data = await res.json();
    if (!data.success) return;

    const box = el("chat-box");
    const buffer = document.createDocumentFragment(); // prevents flicker

    box.innerHTML = ""; // clear instantly

    data.messages.forEach(msg => {
        let div = document.createElement("div");
        div.className = "message-line";
        div.textContent = `${msg.sender}: ${msg.content}`;
        buffer.appendChild(div);
    });

    box.appendChild(buffer);
    box.scrollTop = box.scrollHeight;
}

// ========================================
// SEND MESSAGE
// ========================================
async function sendMessage() {
    let text = el("msg").value.trim();
    if (!text) return;

    if (viewingPublic) {
        await fetch("/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ content: text })
        });

        el("msg").value = "";
        loadPublicChat();
    } else {
        await sendDM(text);
        el("msg").value = "";
        loadDM(activeDM);
    }
}

// ========================================
// DMs
// ========================================
async function sendDM(message) {
    await fetch("/dm_send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
            recipient: activeDM,
            content: message
        })
    });
}

function openDM(user) {
    viewingPublic = false;
    activeDM = user;

    el("chat-title").textContent = "DM with " + user;

    el("msg").style.display = "block";
    el("dm-msg").style.display = "none";

    el("chat-box").innerHTML = "<p class='loading-text'>Loading...</p>";

    loadDM(user);
}

// ========================================
// LOAD DM (Optimized + No Flicker + Abort)
// ========================================
async function loadDM(user) {
    if (!user) return;

    if (dmAbortController) dmAbortController.abort();
    dmAbortController = new AbortController();

    try {
        let res = await fetch(`/dm_get?user=${user}`, {
            credentials: "include",
            signal: dmAbortController.signal
        });

        let data = await res.json();
        if (!data.success) return;

        const box = el("chat-box");
        const buffer = document.createDocumentFragment();

        box.innerHTML = "";

        data.messages.forEach(msg => {
            let div = document.createElement("div");
            div.className = "message-line";

            if (msg.sender === user) {
                div.classList.add("msg-other");
                div.textContent = `${user}: ${msg.content}`;
            } else {
                div.classList.add("msg-you");
                div.textContent = `You: ${msg.content}`;
            }

            buffer.appendChild(div);
        });

        box.appendChild(buffer);
        box.scrollTop = box.scrollHeight;

    } catch (e) {
        if (e.name !== "AbortError") console.error("DM fetch failed:", e);
    }
}

</script>


</body>
</html>
