<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <title>Cyvathon Chat</title>
    <style>
/* GLOBAL */
body {
    margin: 0;
    padding: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;

    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* prevent page scroll */
}

/* HEADER */
#header {
    padding: 15px;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    background: #050505;
    box-shadow: 0 0 15px rgba(0, 140, 255, 0.4);
    flex-shrink: 0;
}

/* LOGIN PAGE */
#login-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

#login-section input {
    padding: 14px;
    width: 300px;
    font-size: 18px;
    border-radius: 8px;
    background: #222;
    border: 1px solid #444;
    color: white;
}

/* auth buttons are the same size */
.button-row {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.button-row button {
    width: 130px;     /* SAME WIDTH */
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    border: none;
    cursor: pointer;
}

/* CHAT SECTION */
#chat-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;

    overflow: hidden; /* ***PREVENT PAGE SCROLL*** */
}

/* CHAT MESSAGES SCROLL ONLY */
#chat-box {
    flex: 1;
    overflow-y: auto;  /* INTERNAL SCROLL ONLY */
    background: #111;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #333;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    font-size: 18px;

    max-height: 100%;  /* Always fits viewport */
}

/* MESSAGE INPUT AREA */
#message-bar {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-shrink: 0; /* keep bar visible */
}

#msg {
    flex: 1;
    padding: 14px;
    font-size: 18px;
    border: 1px solid #444;
    background: #222;
    color: white;
    border-radius: 8px;
}

/* SEND + LOGOUT BUTTON */
button {
    padding: 14px 20px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

    </style>
</head>
<body>

<div id="header">Cyvathon Chat</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <div class="button-row">
        <button class="auth-btn" onclick="chatLogin()">Login</button>
        <button class="auth-btn" onclick="chatRegister()">Register</button>
    </div>


    <p id="login-status"></p>
</div>

<!-- CHAT -->
<div id="chat-section" style="display:none;">
    <button onclick="chatLogout()" style="align-self:flex-start; margin-bottom:10px;">Logout</button>

    <div id="chat-box"></div>

    <div id="message-bar">
        <input id="msg" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>


<script>
let last_id = 0;
let messageInterval = null; // Prevent duplicate intervals

function el(id) {
    return document.getElementById(id);
}

// ------------------------- LOGIN -------------------------
async function chatLogin() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();

    if (data.success) {
        el("login-section").style.display = "none";
        el("chat-section").style.display = "flex";

        loadMessages();

        // Start interval ONLY once
        if (messageInterval === null) {
            messageInterval = setInterval(loadMessages, 1200);
        }
    } else {
        el("login-status").textContent = data.error;
    }
}

// ------------------------- REGISTER -------------------------
async function chatRegister() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();

    if (data.success) {
        el("login-section").style.display = "none";
        el("chat-section").style.display = "flex";

        loadMessages();

        // Start interval ONLY once
        if (messageInterval === null) {
            messageInterval = setInterval(loadMessages, 1200);
        }
    } else {
        el("login-status").textContent = data.error;
    }
}

// ------------------------- LOGOUT -------------------------
async function chatLogout() {
    await fetch("/chat_logout", {
        method: "POST",
        credentials: "include"
    });

    el("chat-section").style.display = "none";
    el("login-section").style.display = "flex";

    // STOP the message fetcher
    if (messageInterval !== null) {
        clearInterval(messageInterval);
        messageInterval = null;
    }
}

// ------------------------- SEND MESSAGE -------------------------
async function sendMessage() {
    let text = el("msg").value.trim();
    if (!text) return;

    await fetch("/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ content: text })
    });

    el("msg").value = "";
    loadMessages();
}

// ------------------------- LOAD MESSAGES -------------------------
async function loadMessages() {
    let res = await fetch("/messages", { credentials: "include" });
    let data = await res.json();

    if (!data.success) return;

    let box = el("chat-box");

    box.innerHTML = "";

    data.messages.forEach(msg => {
        let div = document.createElement("div");
        div.textContent = `${msg.sender}: ${msg.content}`;
        div.style.marginBottom = "8px";
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}
</script>


</body>
</html>
