<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyvathon Chat</title>
    <style>

body {
    margin: 0;
    padding: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;

    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#header {
    padding: 15px;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    background: #050505;
    box-shadow: 0 0 15px rgba(0, 140, 255, 0.4);
}

#login-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

#login-section input {
    padding: 14px;
    width: 300px;
    font-size: 18px;
    border-radius: 8px;
    background: #222;
    border: 1px solid #444;
    color: white;
}

.button-row {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.button-row button {
    width: 130px;
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    border: none;
    cursor: pointer;
}

/* CHAT LAYOUT */
#chat-container {
    flex: 1;
    display: none;
    flex-direction: row;
    overflow: hidden;
}

/* LEFT SIDEBAR */
#sidebar {
    width: 220px;
    background: #0c0c0c;
    border-right: 1px solid #222;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
}

#sidebar button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
}

#sidebar button:hover {
    background: #3b82f6;
}

/* CHAT SECTION */
#chat-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow: hidden;
}

#chat-box {
    flex: 1;
    overflow-y: auto;
    background: #111;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #333;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
}

/* DM CHAT BOX */
#dm-box {
    flex: 1;
    overflow-y: auto;
    background: #111;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #333;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    display: none;
}

#message-bar {
    margin-top: 12px;
    display: flex;
    gap: 10px;
}

#msg, #dm-msg {
    flex: 1;
    padding: 14px;
    font-size: 18px;
    background: #222;
    color: white;
    border-radius: 8px;
    border: 1px solid #444;
}

button {
    padding: 14px 20px;
    font-size: 18px;
    border-radius: 8px;
    background: #3b82f6;
    border: none;
    color: white;
    cursor: pointer;
}

    </style>
</head>
<body>

<div id="header">Cyvathon Chat</div>

<!-- LOGIN -->
<div id="login-section">
    <input id="login-username" placeholder="Username">
    <input id="login-password" placeholder="Password" type="password">

    <div class="button-row">
        <button onclick="chatLogin()">Login</button>
        <button onclick="chatRegister()">Register</button>
    </div>

    <p id="login-status"></p>
</div>


<!-- CHAT MAIN CONTAINER -->
<div id="chat-container">
    
    <!-- LEFT SIDEBAR -->
    <div id="sidebar">
        <button onclick="openPublicChat()">🌐 Public Chat</button>
        <hr style="border:1px solid #222; width:100%;">
        <div id="dm-users">
            <p style="opacity:0.6;">DMs:</p>
        </div>
        <button onclick="chatLogout()" style="margin-top:auto; background:#b91c1c;">Logout</button>
    </div>

    <!-- RIGHT CHAT AREA -->
    <div id="chat-section">

        <!-- Public Chat -->
        <div id="chat-box"></div>

        <!-- DM Chat -->
        <div id="dm-box"></div>

        <!-- Input -->
        <div id="message-bar">
            <input id="msg" placeholder="Type message...">
            <input id="dm-msg" placeholder="Send DM..." style="display:none;">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>
</div>

<script>
// -------------------------------
// GLOBAL STATE
// -------------------------------
let activeDM = null;          // who you are chatting with right now
let messageInterval = null;   // auto-refresh interval
let viewingPublic = true;     // track whether you're in public chat

function el(id) {
    return document.getElementById(id);
}

// -------------------------------
// AUTH
// -------------------------------
async function chatLogin() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();

    if (data.success) {
        el("login-section").style.display = "none";
        el("chat-section").style.display = "flex";

        startAutoRefresh();
        loadPublicChat(); // default
    } else {
        el("login-status").textContent = data.error;
    }
}

async function chatRegister() {
    let user = el("login-username").value.trim();
    let pass = el("login-password").value.trim();

    let res = await fetch("/chat_register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ username: user, password: pass })
    });

    let data = await res.json();

    if (data.success) {
        el("login-section").style.display = "none";
        el("chat-section").style.display = "flex";

        startAutoRefresh();
        loadPublicChat();
    } else {
        el("login-status").textContent = data.error;
    }
}

async function chatLogout() {
    await fetch("/chat_logout", {
        method: "POST",
        credentials: "include"
    });

    el("chat-section").style.display = "none";
    el("login-section").style.display = "flex";

    stopAutoRefresh();
}

// -------------------------------
// AUTO REFRESH
// -------------------------------
function startAutoRefresh() {
    if (messageInterval) return;
    messageInterval = setInterval(() => {
        if (viewingPublic) loadPublicChat();
        else if (activeDM) loadDM(activeDM);
    }, 1000);
}

function stopAutoRefresh() {
    if (messageInterval) {
        clearInterval(messageInterval);
        messageInterval = null;
    }
}

// -------------------------------
// PUBLIC CHAT
// -------------------------------
async function loadPublicChat() {
    viewingPublic = true;
    activeDM = null;

    let res = await fetch("/messages", { credentials: "include" });
    let data = await res.json();
    if (!data.success) return;

    let box = el("chat-box");
    box.innerHTML = "";

    data.messages.forEach(msg => {
        let div = document.createElement("div");
        div.textContent = `${msg.sender}: ${msg.content}`;
        div.style.marginBottom = "8px";
        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
    let text = el("msg").value.trim();
    if (!text) return;

    if (viewingPublic) {
        await fetch("/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ content: text })
        });
        el("msg").value = "";
        loadPublicChat();
    } else if (activeDM) {
        await sendDM(text);
        el("msg").value = "";
        loadDM(activeDM);
    }
}

// -------------------------------
// DM SYSTEM
// -------------------------------
async function openDM(user) {
    viewingPublic = false;
    activeDM = user;

    el("chat-title").innerText = "DM with " + user;

    loadDM(user);
}

async function sendDM(message) {
    await fetch("/dm_send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
            recipient: activeDM,
            content: message
        })
    });
}

async function loadDM(user) {
    if (!user) return;
    viewingPublic = false;

    let res = await fetch(`/dm_get?user=${user}`, { credentials: "include" });
    let data = await res.json();

    if (!data.success) return;

    let box = el("chat-box");
    box.innerHTML = "";

    data.messages.forEach(msg => {
        let div = document.createElement("div");
        div.style.marginBottom = "8px";

        if (msg.sender === user) {
            div.style.color = "#38bdf8"; // blue for them
            div.textContent = `${msg.sender}: ${msg.content}`;
        } else {
            div.style.color = "#a1ff8f"; // green for you
            div.textContent = `You: ${msg.content}`;
        }

        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}
</script>


</body>
</html>
