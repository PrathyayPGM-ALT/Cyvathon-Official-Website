<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyvathon Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    .chat-layout{ display:grid; grid-template-columns:250px 1fr; gap:1.2rem; align-items:start;
      max-width:1000px; margin:1.5rem auto; padding:0 1rem; }
    @media(max-width:760px){ .chat-layout{ grid-template-columns:1fr; } }
    .channels .ch{ display:flex; align-items:center; gap:.6rem; padding:.6rem .7rem; border-radius:10px;
      cursor:pointer; transition:.15s; }
    .channels .ch:hover{ background:rgba(88,196,255,.08); }
    .channels .ch.active{ background:rgba(88,196,255,.14); border:1px solid rgba(88,196,255,.35); }
    .channels h4{ color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:1px; margin:1rem 0 .4rem; }
    #box{ height:52vh; overflow-y:auto; padding:.6rem; background:#0c111b; border-radius:12px;
      border:1px solid var(--panel-border); }
    .ln{ margin:.5rem 0; } .ln.me{ text-align:right; }
    .sender{ font-size:.72rem; color:var(--accent); margin-bottom:2px; }
    .bub{ display:inline-block; max-width:78%; text-align:left; padding:.5rem .8rem; border-radius:13px;
      background:#1b222c; border:1px solid #2a3340; word-wrap:break-word; }
    .ln.me .bub{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#06223a; border:none; }
    .chat-img{ max-width:200px; max-height:200px; border-radius:8px; margin:.2rem 0; }
    .toolbar{ display:flex; gap:.3rem; margin-top:.6rem; flex-wrap:wrap; align-items:center; }
    .toolbar button{ width:auto; margin:0; padding:.4rem .7rem; font-size:.85rem;
      background:var(--panel); color:var(--text); border:1px solid var(--panel-border); box-shadow:none; }
    .toolbar button:hover{ border-color:var(--accent); color:var(--accent); }
    .composer{ display:flex; gap:.5rem; margin-top:.5rem; }
    .composer input{ flex:1; margin:0; } .composer .send{ width:auto; margin:0; padding:.7rem 1.3rem; }
    .emoji-pop{ display:none; flex-wrap:wrap; gap:.2rem; max-width:280px; padding:.5rem; margin-top:.4rem;
      background:#0e1320; border:1px solid var(--panel-border); border-radius:10px; }
    .emoji-pop.open{ display:flex; }
    .emoji-pop span{ cursor:pointer; font-size:1.3rem; padding:.1rem .25rem; border-radius:6px; }
    .emoji-pop span:hover{ background:rgba(88,196,255,.15); }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="chat-layout">
    <div class="panel channels">
      <h4>Channels</h4>
      <div id="chList"></div>
      <button class="ghost" style="margin-top:1rem;" onclick="newGroup()"><i class="fas fa-plus"></i> New Group</button>
    </div>

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;">
        <h3 id="chTitle"><i class="fa-solid fa-landmark"></i> Public Square</h3>
        <span id="chAction"></span>
      </div>
      <div id="box"></div>

      <div class="toolbar">
        <button title="Bold" onclick="wrap('**','**')"><b>B</b></button>
        <button title="Italic" onclick="wrap('*','*')"><i>I</i></button>
        <button title="Underline" onclick="wrap('__','__')"><u>U</u></button>
        <button title="Emoji" onclick="toggleEmoji()">😀</button>
        <button title="GIF / Image" onclick="addGif()"><i class="fas fa-image"></i> GIF</button>
      </div>
      <div class="emoji-pop" id="emojiPop"></div>

      <div class="composer">
        <input id="msg" placeholder="Message…  (**bold** *italic* __underline__)">
        <button class="send" onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    let ME=null, channel={type:"public"}, groups=[], poll=null, lastId=0;
    const esc=(s)=>(s||"").replace(/</g,"&lt;");
    const EMOJIS = "😀 😂 😍 😎 😭 😡 👍 👎 🙏 🔥 🎉 💀 🤖 👑 ⚖️ 💰 🦉 🚀 ❤️ ✅ ❌ 🤔 😱 🫡 🐐".split(" ");

    function renderChannels(){
      const el=document.getElementById("chList");
      let html=`<div class="ch ${channel.type==='public'?'active':''}" onclick="openPublic()">
        <i class="fa-solid fa-landmark"></i> Public Square</div><h4>Groups</h4>`;
      html += groups.length ? groups.map(g=>`
        <div class="ch ${channel.type==='group'&&channel.id===g.id?'active':''}" onclick="openGroup(${g.id})">
          <i class="fa-solid fa-user-group"></i> ${esc(g.name)}</div>`).join("")
        : `<p class="small muted">No groups yet.</p>`;
      el.innerHTML=html;
    }

    async function loadGroups(){ try{ const d=await api("/groups"); groups=d.groups; renderChannels(); }catch{} }

    function openPublic(){ channel={type:"public"}; document.getElementById("chTitle").innerHTML='<i class="fa-solid fa-landmark"></i> Public Square';
      document.getElementById("chAction").innerHTML=""; renderChannels(); restartPoll(); }
    function openGroup(id){
      const g=groups.find(x=>x.id===id); if(!g) return;
      channel={type:"group",id};
      document.getElementById("chTitle").innerHTML=`<i class="fa-solid fa-user-group"></i> ${esc(g.name)}`;
      document.getElementById("chAction").innerHTML=`<span class="small">${g.members.length} members</span>
        <button class="ghost" style="width:auto;margin:0;padding:.3rem .8rem;font-size:.8rem;" onclick="addMember(${id})">Add</button>`;
      renderChannels(); restartPoll();
    }

    function chUrl(since){
      const base = channel.type==="public" ? "/messages" : `/groups/${channel.id}/messages`;
      return base + (since ? `?since_id=${since}` : "");
    }
    // Incremental: only fetch & APPEND new messages, so existing GIFs/images
    // are never re-rendered (the old code rebuilt everything every poll).
    async function loadMessages(full){
      const box=document.getElementById("box");
      if(full){ box.innerHTML=""; lastId=0; }
      try{
        const d = await api(chUrl(lastId));
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
        let added=false;
        (d.messages||[]).forEach(m=>{
          if(m.id<=lastId) return;
          lastId=Math.max(lastId,m.id);
          const div=document.createElement("div");
          div.className="ln"+(m.sender===ME?" me":"");
          div.innerHTML=`<div class="sender">${userLink(m.sender)}</div><div class="bub">${renderRich(m.content)}</div>`;
          box.appendChild(div); added=true;
        });
        if(added && (full || nearBottom)) box.scrollTop=box.scrollHeight;
      }catch(e){ if(/not in this group|logged in/i.test(e.message)) openPublic(); }
    }
    function restartPoll(){ loadMessages(true); if(poll) clearInterval(poll); poll=setInterval(()=>loadMessages(false),2500); }

    async function send(){
      const i=document.getElementById("msg"); const content=i.value.trim(); if(!content) return;
      i.value="";
      const url = channel.type==="public" ? "/messages" : `/groups/${channel.id}/messages`;
      try{ await api(url,{method:"POST",body:JSON.stringify({content})}); loadMessages(false); }
      catch(e){ alert(e.message); }
    }

    function wrap(a,b){
      const i=document.getElementById("msg"); const s=i.selectionStart, e=i.selectionEnd, v=i.value;
      i.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e); i.focus();
      i.selectionStart=i.selectionEnd=e+a.length+b.length;
    }
    function toggleEmoji(){
      const p=document.getElementById("emojiPop");
      if(!p.innerHTML) p.innerHTML=EMOJIS.map(x=>`<span onclick="ins('${x}')">${x}</span>`).join("");
      p.classList.toggle("open");
    }
    function ins(x){ const i=document.getElementById("msg"); i.value+=x; i.focus(); }
    function addGif(){ const u=prompt("Paste a GIF or image URL (.gif / .png / .jpg):"); if(u) { document.getElementById("msg").value += " " + u.trim() + " "; } }

    async function newGroup(){
      const name=prompt("Group name:"); if(!name) return;
      const mem=prompt("Add members now? (comma-separated usernames, optional):")||"";
      const members=mem.split(",").map(s=>s.trim()).filter(Boolean);
      try{ await api("/groups",{method:"POST",body:JSON.stringify({name,members})}); await loadGroups(); }
      catch(e){ alert(e.message); }
    }
    async function addMember(id){
      const u=prompt("Username to add:"); if(!u) return;
      try{ await api("/groups/add",{method:"POST",body:JSON.stringify({group_id:id,username:u.trim()})}); await loadGroups(); openGroup(id); }
      catch(e){ alert(e.message); }
    }

    (async function(){
      const user=await requireAuth(); if(!user) return;
      ME=user.username; renderNav("/chat", user);
      await loadGroups();
      openPublic();
      document.getElementById("msg").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); send(); }});
    })();
  </script>
</body>
</html>
